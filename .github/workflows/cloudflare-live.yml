name: Cloudflare live validation

# Keep real-provider endurance checks visible, but outside deployment latency.
# Only successful trusted master deployments trigger this privileged follow-up.
# The gate excludes successful preview-only manual runs.
on:
  workflow_run:
    workflows: [Cloudflare]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      suite:
        description: Live validation suite
        type: choice
        options: [all, goals]
        default: all

permissions:
  contents: read

# Finish the active journey, coalescing superseded pending validations.
concurrency:
  group: cloudflare-live-validation
  cancel-in-progress: false

jobs:
  deployment:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      deployed: ${{ steps.confirm.outputs.deployed }}
    steps:
      - name: Confirm the completed workflow actually deployed production
        id: confirm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$SOURCE_RUN" ]; then
            echo 'deployed=true' >> "$GITHUB_OUTPUT"
          else
            deployed=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "deploy Cloudflare production" and .conclusion == "success" and any(.steps[]; .name == "Verify deployed account Worker health" and .conclusion == "success"))] | length > 0')
            echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          fi

  cron-live:
    name: exercise deployed cron schedules
    needs: deployment
    if: needs.deployment.outputs.deployed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.suite != 'goals')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: cloudflare-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Exercise a real scheduled turn and schedule management
        env:
          NANOCODEX_CRON_TEST_API_KEY: ${{ secrets.NANOCODEX_ASTRA_MANAGED_API_KEY }}
        run: node --test js/managed/test/live-cron.test.mjs

  durability-live:
    name: exercise deployed durable threads
    needs: deployment
    if: needs.deployment.outputs.deployed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.suite != 'goals')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Exercise long conversations through the deployed managed API
        env:
          NANOCODEX_DURABILITY_TEST_API_KEY: ${{ secrets.NANOCODEX_ASTRA_MANAGED_API_KEY }}
          NANOCODEX_DURABILITY_RECOVERY_AGENTS: ${{ vars.NANOCODEX_DURABILITY_RECOVERY_AGENTS || '[]' }}
        run: node --test js/managed/test/live-durability.test.mjs js/managed/test/live-large-input.test.mjs

  goals-live:
    name: exercise deployed goals
    needs: deployment
    if: needs.deployment.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Exercise real goal tools and persisted goal controls
        env:
          NANOCODEX_GOALS_TEST_API_KEY: ${{ secrets.NANOCODEX_ASTRA_MANAGED_API_KEY }}
        run: node --test js/managed/test/live-goals.test.mjs
