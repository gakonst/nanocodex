name: CI

permissions: {}

on:
  push:
    branches: [master]
  pull_request:
    # ready_for_review reruns a draft's fast lane with the heavy matrix.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

env:
  CARGO_TERM_COLOR: always
  # CI needs assertions, not multi-gigabyte debugger and incremental artifacts.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  # Paused test steps and the workspace test job run only when this is "on".
  NANOCODEX_CI_TESTS: paused

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Only superseded PR runs are cancelled; master and merge-queue runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      hands: ${{ steps.select.outputs.hands }}
      windows: ${{ steps.select.outputs.windows }}
      vm: ${{ steps.select.outputs.vm }}
      voice: ${{ steps.select.outputs.voice }}
      python: ${{ steps.select.outputs.python }}
      rust: ${{ steps.select.outputs.rust }}
      rust_extra: ${{ steps.select.outputs.rust_extra }}
      wasm_rust: ${{ steps.select.outputs.wasm_rust }}
      wasm: ${{ steps.select.outputs.wasm }}
      bindings: ${{ steps.select.outputs.bindings }}
      apps: ${{ steps.select.outputs.apps }}
      preview: ${{ steps.select.outputs.preview }}
      policy: ${{ steps.select.outputs.policy }}
      codeql: ${{ steps.select.outputs.codeql }}
      tests: ${{ steps.select.outputs.tests }}
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate CI job selection
        run: node --test scripts/ci/select-jobs.test.mjs
      - id: select
        run: node scripts/ci/select-jobs.mjs

  test:
    # Temporarily disabled: CI tests are paused (NANOCODEX_CI_TESTS above).
    needs: changes
    if: needs.changes.outputs.tests == 'true' && needs.changes.outputs.rust_extra == 'true'
    name: test Rust 1.97
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
      - uses: ./.github/actions/rust-compiler-cache
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --profile ci
      - name: Test public library harness journeys
        run: |
          cargo test --locked -p nanocodex --features claude --test it harness:: -- --nocapture
      # nextest does not run doctests.
      - run: cargo test --workspace --locked --doc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: harness-routing-journeys
          path: |
            output/harness-routing/**
            output/library-harness/**
          if-no-files-found: warn

  shared-hands:
    needs: changes
    if: needs.changes.outputs.hands == 'true'
    name: shared computer Hand (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      NANOCODEX_COMPUTER: "off"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
      - name: Cache Rust compilation
        uses: ./.github/actions/rust-compiler-cache
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        if: needs.changes.outputs.tests == 'true'
        with:
          tool: cargo-nextest
      - name: Check media transport and IPC boundaries on every host OS
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        run: cargo nextest run --locked --profile ci -p nanocodex-remote -p nanocodex-tui-control
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # Private-input journeys run on Linux even while broader tests are paused.
        if: needs.changes.outputs.tests == 'true' || runner.os == 'Linux'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        # Private-input journeys run on Linux even while broader tests are paused.
        if: needs.changes.outputs.tests == 'true' || runner.os == 'Linux'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.tests == 'true' || runner.os == 'Linux'
      - name: Check CUA bridge and native host lifecycle
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true' && runner.os == 'macOS'
        run: |
          node --test scripts/tests/direct-cua-host.test.mjs crates/experimental/nanocodex-computer/tests/linux-sky/host.test.mjs crates/experimental/nanocodex-computer/tests/windows-sky/host.test.mjs crates/experimental/nanocodex-computer/tests/windows-sky/unsupported.test.mjs
          python3 scripts/test_install_linux_sky_host.py
          python3 scripts/test_install_upstream_cua.py
      - name: Check shared native capture policy and platform adapters
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        run: cargo nextest run --locked --profile ci -p nanocodex-hand
      - name: Check native identity, IPC leases, reconnect, and factory discovery
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        # The ci profile serializes and retries these host IPC tests.
        run: cargo nextest run --locked --profile ci -p nanocodex2-bin --bin nanocodex2 -E 'test(hand)'
      - name: Build both public CLI journey executables
        run: cargo build --locked -p nanocodex2-bin -p nanocodex-bin --bins
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Exercise native connector and Vault account APIs
        run: |
          cargo test --locked -p nanocodex2-bin --test nanocodex2_connectors --test nanocodex2_vault
          cargo test --locked -p nanocodex2-bin --bin nanocodex2 account_management_journeys
      - name: Exercise Managed2 CLI through HTTP and WebSocket
        run: node bin/nanocodex/tests/managed2_cli_e2e.mjs
      - name: Exercise local SSH key import through signed Connect consent
        run: node bin/nanocodex/tests/ssh_import_cli_e2e.mjs
      - name: Exercise private TUI input and encrypted Vault reuse
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          pnpm --filter nanocodex-web exec playwright-core install --with-deps chromium
          CHROME_PATH=$(node --input-type=module -e 'import {createRequire} from "node:module"; const require = createRequire(new URL("./js/account/package.json", import.meta.url)); process.stdout.write(require("playwright-core").chromium.executablePath());')
          export CHROME_PATH
          node --experimental-transform-types js/managed/test/private-input-tui.chrome.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'Linux'
        with:
          name: private-tui-vault-journeys
          path: |
            output/private-input-tui/*.json
            output/private-input-tui/*.txt
            output/private-input-tui/*.log
          if-no-files-found: warn
      - name: Run real CLI/app sharing against a local account server
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        shell: bash
        run: |
          NANOCODEX_DEVICE_TEST_BINARY="$(node -p 'require("node:path").resolve("target/debug/nanocodex2" + (process.platform === "win32" ? ".exe" : ""))')"
          export NANOCODEX_DEVICE_TEST_BINARY
          node --test js/desktop-runtime/test/device-hand.integration.test.mjs js/desktop-runtime/test/device-hand-shutdown.test.mjs

  voice-native:
    needs: changes
    if: needs.changes.outputs.voice == 'true'
    name: native voice and relocated runtime
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
      - name: Cache Rust compilation
        uses: ./.github/actions/rust-compiler-cache
        with:
          workspace: third_party/codex-voice
      - name: Install native SDK
        run: brew install gstreamer
      - name: Test native media and process lifecycle
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        run: |
          # This test measures real 10 ms device cadence with injected 100 ms
          # packet bursts. Keep its assertions intact and run it without the
          # other tests' simultaneous decoders/transports distorting that clock.
          continuity=devices::playout::tests::continuous_speech_survives_device_cadence_and_packet_jitter
          python3 third_party/codex-voice/patches/webrtc-sys/prepare.py
          cargo test --locked --manifest-path third_party/codex-voice/Cargo.toml -p nanocodex-voice-host -- --skip "$continuity"
          cargo test --locked --manifest-path third_party/codex-voice/Cargo.toml -p nanocodex-voice-host "$continuity" -- --exact
          cargo test --locked --manifest-path third_party/codex-voice/Cargo.toml -p nanocodex-webrtc-voice-host -- --test-threads=1
          cargo test --locked -p nanocodex-voice-native
      - name: Stage private runtime
        run: python3 scripts/build-voice-native.py
      - name: Test relocated helper
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        run: cargo test --locked -p nanocodex-voice-native --test packaged -- --ignored
        env:
          NANOCODEX_TEST_VOICE_RUNTIME: ${{ github.workspace }}/target/debug/nanocodex-resources/voice

  windows-hand:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: shared Windows Hand and installer
    env:
      NANOCODEX_COMPUTER: "off"
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Validate thin Windows bootstrap and packaging scripts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($script in @((Get-Item ./install.ps1)) + @(Get-ChildItem ./windows/hand -Filter "*.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "Invalid PowerShell in $($script.Name): $parseErrors" }
          }
      - name: Verify CUA bootstrap copies without Store installation
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -File ./windows/hand/test-cua-provision.ps1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Cache Rust compilation
        uses: ./.github/actions/rust-compiler-cache
        with:
          cache-targets: true
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: cargo-nextest
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # Required only by the paused JavaScript lifecycle tests below.
        if: needs.changes.outputs.tests == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        # Required only by the paused JavaScript lifecycle tests below.
        if: needs.changes.outputs.tests == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Re-enable dependency setup together with the lifecycle tests.
        if: needs.changes.outputs.tests == 'true'
      - name: Check media transport and IPC boundaries on every host OS
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        run: cargo nextest run --locked --profile ci -p nanocodex-remote -p nanocodex-tui-control
      - name: Check shared native capture policy and platform adapters
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        run: cargo nextest run --locked --profile ci -p nanocodex-hand
      - name: Test the account Hand
        if: needs.changes.outputs.tests == 'true'
        shell: pwsh
        env:
          NANOCODEX_COMPUTER: "off"
        run: cargo nextest run --locked --profile ci --package nanocodex2-bin --bin nanocodex2
      - name: Build the native controller and account Hand
        shell: pwsh
        env:
          NANOCODEX_COMPUTER: "off"
        run: |
          cargo build --locked --package nanocodex-bin --bin nanocodex --features tempo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --package nanocodex2-bin --bin nanocodex2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native Windows Hand task policy
        shell: pwsh
        run: >-
          cargo nextest run --locked --profile ci --package nanocodex-bin --bin nanocodex
          -E 'test(windows_hand) | test(update::automatic::tests::windows_schedule)'
      - name: Run real CLI/app sharing against a local account server
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        shell: bash
        run: |
          NANOCODEX_DEVICE_TEST_BINARY="$(node -p 'require("node:path").resolve("target/debug/nanocodex2" + (process.platform === "win32" ? ".exe" : ""))')"
          export NANOCODEX_DEVICE_TEST_BINARY
          node --test js/desktop-runtime/test/device-hand.integration.test.mjs js/desktop-runtime/test/device-hand-shutdown.test.mjs
      - name: Build the one-click installer
        shell: pwsh
        run: >-
          ./windows/hand/build.ps1
          -Nanocodex ./target/debug/nanocodex.exe
          -Nanocodex2 ./target/debug/nanocodex2.exe
          -Version 0.0.0-ci
          -NumericVersion 0.0.0.0

  clippy:
    # Fast lane: runs on every push, including drafts.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust fmt and Clippy (affected crates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
          components: clippy, rustfmt
      - uses: ./.github/actions/rust-compiler-cache
      # Same command as `pnpm check:fast` ("*" = whole workspace).
      - name: Clippy affected crates
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: node scripts/check-fast.mjs --packages "$PACKAGES"

  rust-extra:
    needs: changes
    if: needs.changes.outputs.rust_extra == 'true'
    name: Rust quality (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        check: [contracts, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
      - uses: ./.github/actions/rust-compiler-cache
      - name: Check independently usable crates and public examples
        if: matrix.check == 'contracts'
        run: |
          cargo check --locked --package nanocodex-oai-api
          cargo check --locked --package nanocodex-observability
          cargo check --locked --package nanocodex-oai-tools
          cargo check --locked --package nanocodex-claude-tools --all-features
          cargo check --locked --package nanocodex-agent
          cargo check --locked --package nanocodex-claude --no-default-features --features tools
          cargo check --locked --package nanocodex-examples --bins
      - run: cargo doc --workspace --all-features --no-deps --locked
        if: matrix.check == 'docs'
        env:
          RUSTDOCFLAGS: -D warnings

  vm-guest:
    needs: changes
    # Add "hands" here when re-enabling the paused Docker Hand tests (nanocodex2).
    if: needs.changes.outputs.vm == 'true'
    name: static Linux guest and Docker Hand (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache Rust compilation
        uses: ./.github/actions/rust-compiler-cache
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Check the guest-only target matrix
        run: >-
          cargo check --locked --package nanocodex-vm --all-targets
          --no-default-features --features guest-runtime
      - name: Build the actual static guest artifact
        run: >-
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          cargo build --locked --package nanocodex-vm
          --bin nanocodex-vm-guest --no-default-features
          --features guest-runtime --target ${{ matrix.target }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Configure Docker Hand registry cache
        id: hand-cache
        shell: bash
        env:
          CACHE_ARCH: ${{ matrix.arch }}
          CACHE_WRITE: ${{ github.ref == 'refs/heads/master' && contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) }}
        run: |
          cache_ref="ghcr.io/${GITHUB_REPOSITORY,,}-hand:buildcache-ci-hand-$CACHE_ARCH"
          echo "ref=$cache_ref" >> "$GITHUB_OUTPUT"
          echo "from=type=registry,ref=$cache_ref" >> "$GITHUB_OUTPUT"
          if [ "$CACHE_WRITE" = true ]; then
            echo "to=type=registry,ref=$cache_ref,mode=max,ignore-error=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        id: cache-login
        continue-on-error: true
        if: steps.hand-cache.outputs.to != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare Docker Hand build context
        env:
          TARGET: ${{ matrix.target }}
        run: |
          context="$RUNNER_TEMP/hand-context"
          mkdir -p "$context"
          cp "target/$TARGET/debug/nanocodex-vm-guest" "$context/"
          cp crates/nanocodex-vm/image/Dockerfile.hand "$context/Dockerfile"
          cp -R crates/nanocodex-vm/image/toolkit "$context/toolkit"
      - name: Build the Docker Hand image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/hand-context
          load: true
          tags: nanocodex-hand:ci
          cache-from: ${{ steps.hand-cache.outputs.from }}
          cache-to: ${{ steps.cache-login.outcome == 'success' && steps.hand-cache.outputs.to || '' }}
      - name: Verify registry cache is available
        if: steps.cache-login.outcome == 'success'
        env:
          CACHE_REF: ${{ steps.hand-cache.outputs.ref }}
        run: |
          if timeout 30s docker buildx imagetools inspect "$CACHE_REF" > /dev/null 2>&1; then
            echo "::notice title=Docker registry cache::verified $CACHE_REF"
          else
            echo "::warning title=Docker registry cache::Cache export unavailable; future runs will build normally."
          fi
      - name: Exercise offline toolkit with a read-only root and unprivileged user
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        run: >-
          docker run --rm --network none --read-only --user 1000:1000
          --cap-drop ALL --security-opt no-new-privileges --pids-limit 512
          --tmpfs /tmp:rw,nosuid,nodev,size=256m --env HOME=/workspace
          --tmpfs /workspace:rw,exec,nosuid,nodev,uid=1000,gid=1000,size=2g
          --env TMPDIR=/workspace --workdir /workspace
          --entrypoint sh nanocodex-hand:ci -lc nanocodex-check-hand-toolkit
      - name: Test Docker tools, desktop, persistence, and cleanup without KVM
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        run: |
          cargo test --locked -p nanocodex-vm --test docker_live -- --ignored --nocapture
          cargo test --locked -p nanocodex2-bin --test nanocodex2_managed docker_hand_live -- --ignored --nocapture
        env:
          NANOCODEX_DOCKER_TEST_IMAGE: nanocodex-hand:ci
          NANOCODEX_DOCKER_HOST_SENTINEL: must-not-enter-the-container
      - name: Verify missing KVM is explained before account setup
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        run: |
          sudo unshare --mount --propagation private sh -eu -c '
            if test -e /dev/kvm; then mount --bind /dev/null /dev/kvm; fi
            if target/debug/nanocodex2 hand --vm /nonexistent-root.ext4 > /tmp/hand-kvm-error 2>&1; then
              cat /tmp/hand-kvm-error
              exit 1
            fi
            cat /tmp/hand-kvm-error
            grep -F "VM backend is unavailable" /tmp/hand-kvm-error
            grep -F "hand --docker IMAGE --volume NAME" /tmp/hand-kvm-error
          '

  policy:
    needs: changes
    if: needs.changes.outputs.policy == 'true'
    name: dependencies and spelling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        if: needs.changes.outputs.rust == 'true'
        with:
          tool: cargo-deny
      - run: ./scripts/check-experimental-boundary.sh
        if: needs.changes.outputs.rust == 'true'
      - run: cargo deny check
        if: needs.changes.outputs.rust == 'true'
      - run: ./scripts/release-crates.sh check
        if: needs.changes.outputs.rust == 'true'
      - run: ./scripts/check-crate-boundaries.sh
        if: needs.changes.outputs.rust == 'true'
      - run: ./scripts/check-rustls-provider.sh
        if: needs.changes.outputs.rust == 'true'
      - uses: crate-ci/typos@96d9af6217dc2855210655af7e1ff19d23d4e593 # v1
      - name: Check Cloudflare release and image policies
        run: >-
          node --test
          scripts/cloudflare/wrangler-docker.test.mjs scripts/cloudflare/managed-images.test.mjs
          scripts/cloudflare/managed-images-preview.test.mjs scripts/cloudflare/preview-images.test.mjs
          scripts/cloudflare/preview-workflow.test.mjs scripts/cloudflare/worker-build.test.mjs
          scripts/cloudflare/release-plan.test.mjs scripts/cloudflare/release-workers.test.mjs
          scripts/cloudflare/current-production-release.test.mjs
          js/nanocodex-vite/scripts/wasm-output-cache.test.mjs

  wasm-build:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    name: Build WASM bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Reuse unchanged WASM outputs
        id: wasm
        uses: ./.github/actions/wasm-outputs
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          # Reused WASM outputs skip install, so no pnpm store exists to save.
          cache: ${{ steps.wasm.outputs.hit != 'true' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - name: Check CI orchestration and timing reports
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        run: node --test scripts/ci/*.test.mjs
      # The composite action verifies restored bindings against current inputs.
      # Its hit path needs Node built-ins, not the full pnpm workspace install.
      - name: Install JavaScript dependencies for a WASM cache miss
        if: steps.wasm.outputs.hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build or verify WASM package
        run: ./js/nanocodex-vite/scripts/build-js-package.sh --release
      - name: Retain verified WASM outputs
        if: github.ref == 'refs/heads/master'
        uses: ./.github/actions/save-wasm-outputs
        with:
          key: ${{ steps.wasm.outputs.key }}
          cache-hit: ${{ steps.wasm.outputs.cache-hit }}
          rejected-artifact-id: ${{ steps.wasm.outputs.rejected-artifact-id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanocodex-wasm
          # The common root is js/nanocodex; retain both sibling directories.
          # Node glue loads the shared pkg-web WASM. Include declarations,
          # package type markers, build attestation, and the hidden build stamp.
          path: |
            js/nanocodex/pkg-node
            js/nanocodex/pkg-web
          include-hidden-files: true
          if-no-files-found: error

  js-preview:
    needs: [changes, wasm-build]
    if: needs.changes.outputs.preview == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/js-preview.yml
    with:
      wasm-artifact: nanocodex-wasm

  wasm-quality:
    name: Rust WASM quality
    needs: changes
    # Selected when nanocodex-wasm or a crate it depends on changes.
    if: needs.changes.outputs.wasm_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: ./.github/actions/rust-compiler-cache
      - name: Check Rust WASM consumers
        run: |
          cargo clippy --locked --target wasm32-unknown-unknown \
            --package nanocodex-oai-api \
            --package nanocodex-oai-tools \
            --package nanocodex-agent \
            --package nanocodex \
            --package nanocodex-wasm \
            -- -D warnings -A clippy::missing_const_for_fn

  bindings:
    name: Node and browser bindings
    needs: [changes, wasm-build]
    if: needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nanocodex-wasm
          path: js/nanocodex
      - uses: ./.github/actions/turbo-cache
      - name: Install JS consumer dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --only --filter nanocodex-tools
          npm ci --prefix examples/privy
          npm ci --prefix examples/better-auth
      - name: Test JS runtime
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        working-directory: js/nanocodex
        run: |
          node --test --test-timeout=15000 test/*.test.mjs
          pnpm run test:performance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && needs.changes.outputs.tests == 'true'
        with:
          name: mixed-harness-wasm-journey
          path: output/mixed-harness-wasm/trace.json
          if-no-files-found: warn
      - name: Check JS consumers
        run: |
          pnpm --filter nanocodex run test:typecheck
          pnpm --filter nanocodex run check:package
          pnpm exec turbo run build --only \
            --filter nanocodex-react-vite-example
          npm run build --prefix examples/privy
          npm run build --prefix examples/better-auth
      - name: Test JS consumers and examples
        if: needs.changes.outputs.tests == 'true'
        run: |
          pnpm exec turbo run test --only \
            --filter nanocodex-react \
            --filter nanocodex-vite \
            --filter nanocodex-terminal \
            --filter nanocodex-node-example \
            --filter nanocodex-react-vite-example
          node --test examples/browser-cdn/*.test.mjs
          npm test --prefix examples/privy
          npm test --prefix examples/better-auth
      - name: Check managed integrations
        run: |
          pnpm --filter @nanocodex/x-api run typecheck
          pnpm exec turbo run build --filter nanocodex-connect-protocol
          pnpm --filter nanocodex-managed-service run prepare:code-evaluator
      - name: Exercise private-input account admission
        timeout-minutes: 5
        run: node js/managed/test/private-input-admission-journey.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: private-input-account-admission
          path: output/private-input-tui/admission-trace.json
          if-no-files-found: warn
      - name: Exercise all Vault kinds in private browser fields
        timeout-minutes: 10
        shell: bash
        run: |
          pnpm --filter nanocodex-web exec playwright-core install --with-deps chromium
          CHROME_PATH="$(pnpm --filter nanocodex-web exec node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())' | tail -n 1)"
          export CHROME_PATH
          node --experimental-transform-types js/managed/test/browser-injection.chrome.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: private-browser-vault-injection
          path: |
            output/browser-injection/*.json
            output/browser-injection/*.log
          if-no-files-found: warn
      - name: Typecheck connector SDK and computer adapters
        run: |
          pnpm --filter @nanocodex/connect-api run typecheck
          pnpm --filter nanocodex-computer typecheck

      - name: Test managed integrations
        if: needs.changes.outputs.tests == 'true'
        run: |
          pnpm --filter @nanocodex/x-api run test
          pnpm --filter nanocodex-managed-service run test:media
          pnpm --filter nanocodex-managed-service exec vitest run test/account-info.test.ts test/agent-run.test.ts test/default-mcp.test.ts test/startup-context.test.ts
      - name: Test managed Claude account and session journeys
        if: needs.changes.outputs.tests == 'true'
        run: |
          pnpm --filter nanocodex-egress-service exec vitest run test/claude-subscription.test.ts
          pnpm --filter nanocodex-managed-service run test:claude-managed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && needs.changes.outputs.tests == 'true'
        with:
          name: managed-claude-journeys
          path: |
            output/claude-managed/public-api-trace.json
            output/claude-managed/provider-trace.json
          if-no-files-found: warn
      - name: Test connector SDK compatibility
        if: needs.changes.outputs.tests == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/connector-sdk-python"
          "$RUNNER_TEMP/connector-sdk-python/bin/pip" install spotipy==2.26.0 google-api-python-client==2.192.0
          NANOCODEX_CONNECTOR_SDK_PYTHON="$RUNNER_TEMP/connector-sdk-python/bin/python" \
            pnpm --filter @nanocodex/connect-api exec node --experimental-strip-types --test \
            test/connectorPolicy.test.mjs test/connectorWorker.test.mjs test/connectorSpotipy.test.mjs
      - name: Test official computer adapters
        if: needs.changes.outputs.tests == 'true'
        run: |
          pnpm test:computer
          node --test crates/experimental/nanocodex-computer/tests/linux-sky/host.test.mjs
          pnpm --filter nanocodex-managed-service exec vitest run test/namespace-tools.test.ts
      - uses: ./.github/actions/turbo-cache
        with:
          save: true

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Cache Rust compilation
        uses: ./.github/actions/rust-compiler-cache
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: py/bindings/pyproject.toml
      - name: Build Python wheel
        run: |
          python -m pip install \
            --disable-pip-version-check \
            "maturin>=1.9,<2" \
            "mypy==2.3.0"
          maturin build \
            --locked \
            --manifest-path py/bindings/Cargo.toml \
            --interpreter python \
            --out dist/python \
            --release
      - name: Typecheck installed Python package
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/nanocodex-python"
          "$RUNNER_TEMP/nanocodex-python/bin/python" -m pip install \
            --disable-pip-version-check \
            dist/python/*.whl
          cd "$RUNNER_TEMP"
          python -m mypy \
            --strict \
            --python-executable "$RUNNER_TEMP/nanocodex-python/bin/python" \
            "$GITHUB_WORKSPACE/py/bindings/tests/typing_consumer.py"
          "$RUNNER_TEMP/nanocodex-python/bin/python" -m compileall \
            -q "$GITHUB_WORKSPACE/examples/python"

      - name: Test installed Python package
        if: needs.changes.outputs.tests == 'true'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/nanocodex-python/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/py/bindings/tests" -v
          "$RUNNER_TEMP/nanocodex-python/bin/python" "$GITHUB_WORKSPACE/py/bindings/tests/typing_consumer.py"
          "$RUNNER_TEMP/nanocodex-python/bin/python" "$GITHUB_WORKSPACE/py/bindings/benchmarks/benchmark_binding.py" --check

  apps:
    name: JavaScript apps
    needs: [changes, wasm-build]
    if: needs.changes.outputs.apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nanocodex-wasm
          path: js/nanocodex
      - uses: ./.github/actions/turbo-cache
      - name: Install JavaScript workspace
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix examples/astra-mpp-trial
      - name: Build account Worker dependencies
        run: pnpm exec turbo run build --filter nanocodex-connect-protocol
      - name: Test the account Worker
        # Temporarily disabled: CI tests are paused.
        if: needs.changes.outputs.tests == 'true'
        run: pnpm --filter nanocodex-web run test:web
      - name: Build JavaScript apps
        run: |
          pnpm exec turbo run build --only \
            --filter nanocodex-tools \
            --filter nanocodex-connect-ui \
            --filter nanocodex-terminal \
            --filter @nanocodex/connect-dialog \
            --filter @nanocodex/connect-playground \
            --filter nanocodex-web
          npm run typecheck --prefix examples/astra-mpp-trial
          npm run build --prefix examples/astra-mpp-trial
      - name: Test page-aware private browser input in Chromium
        timeout-minutes: 8
        run: |
          pnpm --filter nanocodex-web exec playwright-core install --with-deps chromium
          CHROME_PATH=$(node --input-type=module -e 'import {createRequire} from "node:module"; const require = createRequire(new URL("./js/account/package.json", import.meta.url)); process.stdout.write(require("playwright-core").chromium.executablePath());')
          export CHROME_PATH
          mkdir -p output/private-native-fields
          node --experimental-transform-types js/managed/test/browser-vault-takeover.chrome.mjs 2>&1 | tee output/private-native-fields/ci-browser-journey.log
          node --experimental-transform-types js/managed/test/browser-vault-continuation.chrome.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: private-native-input-journeys
          path: |
            output/private-native-fields/*.json
            output/private-native-fields/*.png
            output/private-native-fields/ci-browser-journey.log
          if-no-files-found: warn
      - name: Test private Claude connection and model picker
        if: needs.changes.outputs.tests == 'true'
        run: |
          pnpm --filter nanocodex-web exec playwright-core install --with-deps chromium
          CLAUDE_BROWSER_CHANNEL=chromium pnpm --filter nanocodex-web run test:claude-connection
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && needs.changes.outputs.tests == 'true'
        with:
          name: claude-connection-ui
          path: |
            output/claude-connection/browser-api-trace.json
            output/claude-connection/inline-*.png
            output/claude-connection/popover-*.png
          if-no-files-found: warn
      - name: Test private provider capture and Vault recovery
        # Exercise custody even while the broader test matrix is paused.
        run: |
          node --test js/nanocodex/test/mcp-private-result.test.mjs
          pnpm --filter nanocodex-egress-service run prepare:whatsapp
          pnpm --filter nanocodex-egress-service exec vitest run test/provider-vault.test.ts
          pnpm --filter nanocodex-managed-service run test:provider-vault
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: provider-vault-journeys
          path: output/provider-vault-journey/
          if-no-files-found: warn
      - name: Test linked Tempo wallet and funding journeys
        # Wallet custody journeys run even while the broader test matrix is paused.
        run: |
          pnpm --filter nanocodex-egress-service run test:wallet-link
          WALLET_BROWSER_CHANNEL=chromium pnpm --filter nanocodex-web run test:wallet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linked-wallet-journeys
          path: |
            js/egress/output/wallet-link-journey.json
            output/wallet-link-ui/*
            output/wallet-ui/*
          if-no-files-found: warn
      - name: Test Astra MPP example
        if: needs.changes.outputs.tests == 'true'
        run: npm test --prefix examples/astra-mpp-trial
      - uses: ./.github/actions/turbo-cache
        with:
          save: true

  codeql:
    needs: changes
    if: needs.changes.outputs.codeql == 'true'
    name: CodeQL actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          category: /language:actions

  ci-success:
    name: ci success
    # Report failed prerequisites, but do not keep a cancelled workflow holding
    # its concurrency slot while this final job waits for a runner.
    if: always() && !cancelled()
    needs: [changes, test, shared-hands, voice-native, windows-hand, clippy, rust-extra, vm-guest, policy, wasm-build, wasm-quality, bindings, python, apps, js-preview, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Require every applicable CI job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/select-jobs.mjs verify
