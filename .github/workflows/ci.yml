name: CI

permissions: {}

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

env:
  CARGO_TERM_COLOR: always
  # CI needs assertions, not multi-gigabyte debugger and incremental artifacts.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected native checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.select.outputs.native }}
      voice: ${{ steps.select.outputs.voice }}
      python: ${{ steps.select.outputs.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        run: node scripts/ci/select-jobs.mjs

  test:
    name: test Rust 1.97
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          # These jobs use the same Rust version and native build profiles.
          # rust-cache still separates runner image, OS, architecture and compiler inputs.
          shared-key: native-ci
          env-vars: ImageOS
          workspaces: |
            . -> target
          cache-on-failure: true
      - run: cargo test --workspace --locked

  shared-hands:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: shared computer Hand (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    env:
      NANOCODEX_COMPUTER: "off"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          # These jobs use the same Rust version and native build profiles.
          # rust-cache still separates runner image, OS, architecture and compiler inputs.
          shared-key: native-ci
          env-vars: ImageOS
          workspaces: |
            . -> target
          cache-on-failure: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check CUA bridge and native host lifecycle
        if: runner.os == 'macOS'
        run: >-
          node --test scripts/tests/openai-cua-app-server.test.mjs
          scripts/tests/openai-cua-native-host.test.mjs
          scripts/tests/openai-cua-gui-readiness.test.mjs
      - name: Check shared native capture policy and platform adapters
        run: cargo test --locked -p nanocodex-hand
      - name: Check native identity, IPC leases, reconnect, and factory discovery
        run: cargo test --locked -p nanocodex2-bin --bin nanocodex2 hand -- --test-threads=1
      - run: cargo build --locked -p nanocodex2-bin --bin nanocodex2
      - name: Run real CLI/app sharing against a local account server
        shell: bash
        run: |
          NANOCODEX_DEVICE_TEST_BINARY="$(node -p 'require("node:path").resolve("target/debug/nanocodex2" + (process.platform === "win32" ? ".exe" : ""))')"
          export NANOCODEX_DEVICE_TEST_BINARY
          node --test js/desktop-runtime/test/device-hand.integration.test.mjs js/desktop-runtime/test/device-hand-shutdown.test.mjs

  voice-native:
    needs: changes
    if: needs.changes.outputs.voice == 'true'
    name: native voice and relocated runtime
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: third_party/codex-voice
      - name: Install native SDK
        run: brew install gstreamer
      - name: Test native media and process lifecycle
        run: |
          # This test measures real 10 ms device cadence with injected 100 ms
          # packet bursts. Keep its assertions intact and run it without the
          # other tests' simultaneous decoders/transports distorting that clock.
          continuity=devices::playout::tests::continuous_speech_survives_device_cadence_and_packet_jitter
          cargo test --locked --manifest-path third_party/codex-voice/Cargo.toml -p nanocodex-voice-host -- --skip "$continuity"
          cargo test --locked --manifest-path third_party/codex-voice/Cargo.toml -p nanocodex-voice-host "$continuity" -- --exact
          cargo test --locked --manifest-path third_party/codex-voice/Cargo.toml -p nanocodex-webrtc-voice-host -- --test-threads=1
          cargo test --locked -p nanocodex-voice-native
      - name: Stage private runtime
        run: python3 scripts/build-voice-native.py
      - name: Test relocated helper
        run: cargo test --locked -p nanocodex-voice-native --test packaged -- --ignored
        env:
          NANOCODEX_TEST_VOICE_RUNTIME: ${{ github.workspace }}/target/debug/nanocodex-resources/voice

  windows-hand:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: Windows Hand and installer
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Compile the service supervisor and validate Windows scripts
        shell: powershell
        run: ./windows/hand/test-service-build.ps1
      - name: Verify CUA bootstrap copies without Store installation
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -File ./windows/hand/test-cua-provision.ps1
      - name: Validate the one-click installer definition
        shell: pwsh
        run: |
          $placeholder = Join-Path $env:RUNNER_TEMP "nanocodex-installer-placeholder.exe"
          [IO.File]::WriteAllBytes($placeholder, [byte[]]@(0))
          try {
            ./windows/hand/build.ps1 `
              -Nanocodex2 $placeholder `
              -Version 0.0.0-ci `
              -NumericVersion 0.0.0.0
          } finally {
            Remove-Item -LiteralPath $placeholder -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath ./dist/windows-hand -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          # These jobs use the same Rust version and native build profiles.
          # rust-cache still separates runner image, OS, architecture and compiler inputs.
          shared-key: native-ci
          env-vars: ImageOS
          workspaces: |
            . -> target
          cache-on-failure: true
      - name: Build and test the account Hand
        shell: pwsh
        env:
          # Unit tests exercise the Hand protocol without installing desktop software.
          NANOCODEX_COMPUTER: "off"
        run: |
          cargo test --locked --package nanocodex2-bin --bin nanocodex2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --package nanocodex2-bin --bin nanocodex2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate the per-user startup plan
        shell: pwsh
        env:
          NANOCODEX_COMPUTER: "off"
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "nanocodex-hand"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/debug/nanocodex2.exe $stage/
          Copy-Item windows/hand/run-hand.ps1 $stage/
          ./windows/hand/test-setup.ps1 -InstallDir $stage
      - name: Build the one-click installer
        shell: pwsh
        run: >-
          ./windows/hand/build.ps1
          -Nanocodex2 ./target/debug/nanocodex2.exe
          -Version 0.0.0-ci
          -NumericVersion 0.0.0.0

  quality:
    name: rustfmt, clippy, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - name: Check Linux Hand installation boundaries
        run: python3 bin/nanocodex/src/hand_setup/test_install.py
      - name: Clippy workspace targets
        run: |
          cargo clippy --workspace --all-targets --all-features --exclude nanocodex-bin -- -D warnings -A clippy::missing_const_for_fn
          cargo clippy --package nanocodex-bin --all-features --bin nanocodex -- -D warnings -A clippy::missing_const_for_fn
          cargo clippy --package nanocodex-bin --all-features --bench tui_render -- -D warnings -A clippy::missing_const_for_fn
      - name: Check independently usable crates and public examples
        run: |
          cargo check --locked --package nanocodex-oai-api
          cargo check --locked --package nanocodex-observability
          cargo check --locked --package nanocodex-tools
          cargo check --locked --package nanocodex-agent
          cargo check --locked --package nanocodex-examples --bins
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  vm-guest:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: static Linux guest and Docker Hand (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Check the guest-only target matrix
        run: >-
          cargo check --locked --package nanocodex-vm --all-targets
          --no-default-features --features guest-runtime
      - name: Build the actual static guest artifact
        run: >-
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          cargo build --locked --package nanocodex-vm
          --bin nanocodex-vm-guest --no-default-features
          --features guest-runtime --target ${{ matrix.target }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare Docker Hand build context
        env:
          TARGET: ${{ matrix.target }}
        run: |
          context="$RUNNER_TEMP/hand-context"
          mkdir -p "$context"
          cp "target/$TARGET/debug/nanocodex-vm-guest" "$context/"
          cp crates/nanocodex-vm/image/Dockerfile.hand "$context/Dockerfile"
          cp -R crates/nanocodex-vm/image/toolkit "$context/toolkit"
      - name: Build the Docker Hand image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/hand-context
          load: true
          tags: nanocodex-hand:ci
          cache-from: type=gha,scope=ci-hand-${{ matrix.arch }}
          cache-to: type=gha,scope=ci-hand-${{ matrix.arch }},mode=max,ignore-error=true,timeout=3m
      - name: Exercise offline toolkit with a read-only root and unprivileged user
        run: >-
          docker run --rm --network none --read-only --user 1000:1000
          --cap-drop ALL --security-opt no-new-privileges --pids-limit 512
          --tmpfs /tmp:rw,nosuid,nodev,size=256m --env HOME=/workspace
          --tmpfs /workspace:rw,exec,nosuid,nodev,uid=1000,gid=1000,size=2g
          --env TMPDIR=/workspace --workdir /workspace
          --entrypoint sh nanocodex-hand:ci -lc nanocodex-check-hand-toolkit
      - name: Test Docker tools, desktop, persistence, and cleanup without KVM
        run: |
          cargo test --locked -p nanocodex-vm --test docker_live -- --ignored --nocapture
          cargo test --locked -p nanocodex2-bin --test nanocodex2_managed docker_hand_live -- --ignored --nocapture
        env:
          NANOCODEX_DOCKER_TEST_IMAGE: nanocodex-hand:ci
          NANOCODEX_DOCKER_HOST_SENTINEL: must-not-enter-the-container
      - name: Verify missing KVM is explained before account setup
        run: |
          sudo unshare --mount --propagation private sh -eu -c '
            if test -e /dev/kvm; then mount --bind /dev/null /dev/kvm; fi
            if target/debug/nanocodex2 hand --vm /nonexistent-root.ext4 > /tmp/hand-kvm-error 2>&1; then
              cat /tmp/hand-kvm-error
              exit 1
            fi
            cat /tmp/hand-kvm-error
            grep -F "VM backend is unavailable" /tmp/hand-kvm-error
            grep -F "hand --docker IMAGE --volume NAME" /tmp/hand-kvm-error
          '

  policy:
    name: dependencies and spelling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: cargo-deny
      - run: ./scripts/check-experimental-boundary.sh
      - run: cargo deny check
      - run: ./scripts/check-crate-boundaries.sh
      - run: ./scripts/check-rustls-provider.sh
      - uses: crate-ci/typos@96d9af6217dc2855210655af7e1ff19d23d4e593 # v1

  wasm-build:
    name: Build WASM bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: Check CI orchestration and timing reports
        run: node --test scripts/ci/*.test.mjs
      - name: Build WASM package
        run: |
          pnpm install --frozen-lockfile
          ./js/nanocodex-vite/scripts/build-js-package.sh --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanocodex-wasm
          # The common root is js/nanocodex; retain both sibling directories.
          # Node glue loads the shared pkg-web WASM. Include declarations,
          # package type markers, build attestation, and the hidden build stamp.
          path: |
            js/nanocodex/pkg-node
            js/nanocodex/pkg-web
          include-hidden-files: true
          if-no-files-found: error

  js-preview:
    needs: wasm-build
    permissions:
      contents: read
    uses: ./.github/workflows/js-preview.yml
    with:
      wasm-artifact: nanocodex-wasm

  bindings:
    name: Node and browser bindings
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nanocodex-wasm
          path: js/nanocodex
      - name: Check WASM consumers
        run: |
          cargo clippy --locked --target wasm32-unknown-unknown \
            --package nanocodex-oai-api \
            --package nanocodex-tools \
            --package nanocodex-agent \
            --package nanocodex \
            --package nanocodex-wasm \
            -- -D warnings -A clippy::missing_const_for_fn
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --only --filter nanocodex-tools
          npm ci --prefix examples/privy
          npm ci --prefix examples/better-auth
      - name: Test JS runtime
        working-directory: js/nanocodex
        run: |
          node --test --test-timeout=15000 test/*.test.mjs
          pnpm run test:performance
      - name: Check JS consumers
        run: |
          pnpm --filter nanocodex run test:typecheck
          pnpm --filter nanocodex run check:package
          pnpm exec turbo run test --only \
            --filter nanocodex-react \
            --filter nanocodex-vite \
            --filter nanocodex-terminal \
            --filter nanocodex-node-example \
            --filter nanocodex-react-vite-example
          node --test examples/browser-cdn/*.test.mjs
          pnpm exec turbo run build --only \
            --filter nanocodex-react-vite-example
          npm test --prefix examples/privy
          npm run build --prefix examples/privy
          npm test --prefix examples/better-auth
          npm run build --prefix examples/better-auth
      - name: Check managed integrations
        run: |
          pnpm --filter @nanocodex/x-api run typecheck
          pnpm --filter @nanocodex/x-api run test
          pnpm exec turbo run build --filter nanocodex-connect-protocol
          pnpm --filter nanocodex-managed-service run prepare:code-evaluator
          pnpm --filter nanocodex-managed-service run test:media
          pnpm --filter nanocodex-managed-service exec vitest run test/account-info.test.ts test/agent-run.test.ts test/default-mcp.test.ts test/startup-context.test.ts
      - name: Test connector SDK compatibility
        run: |
          python3 -m venv "$RUNNER_TEMP/connector-sdk-python"
          "$RUNNER_TEMP/connector-sdk-python/bin/pip" install spotipy==2.26.0 google-api-python-client==2.192.0
          pnpm --filter @nanocodex/connect-api run typecheck
          NANOCODEX_CONNECTOR_SDK_PYTHON="$RUNNER_TEMP/connector-sdk-python/bin/python" \
            pnpm --filter @nanocodex/connect-api exec node --experimental-strip-types --test \
            test/connectorPolicy.test.mjs test/connectorWorker.test.mjs test/connectorSpotipy.test.mjs
      - name: Test official computer adapters
        run: |
          pnpm test:computer
          node --test crates/experimental/nanocodex-computer/tests/linux-sky/host.test.mjs
          pnpm --filter nanocodex-computer typecheck
          pnpm --filter nanocodex-managed-service exec vitest run test/namespace-tools.test.ts

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: py/bindings/pyproject.toml
      - name: Build Python wheel
        run: |
          python -m pip install \
            --disable-pip-version-check \
            "maturin>=1.9,<2" \
            "mypy==2.3.0"
          maturin build \
            --locked \
            --manifest-path py/bindings/Cargo.toml \
            --interpreter python \
            --out dist/python \
            --release
      - name: Test installed Python package
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/nanocodex-python"
          "$RUNNER_TEMP/nanocodex-python/bin/python" -m pip install \
            --disable-pip-version-check \
            dist/python/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/nanocodex-python/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/py/bindings/tests" \
            -v
          "$RUNNER_TEMP/nanocodex-python/bin/python" \
            "$GITHUB_WORKSPACE/py/bindings/tests/typing_consumer.py"
          python -m mypy \
            --strict \
            --python-executable "$RUNNER_TEMP/nanocodex-python/bin/python" \
            "$GITHUB_WORKSPACE/py/bindings/tests/typing_consumer.py"
          "$RUNNER_TEMP/nanocodex-python/bin/python" \
            "$GITHUB_WORKSPACE/py/bindings/benchmarks/benchmark_binding.py" \
            --check
          "$RUNNER_TEMP/nanocodex-python/bin/python" -m compileall \
            -q "$GITHUB_WORKSPACE/examples/python"

  apps:
    name: JavaScript apps
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nanocodex-wasm
          path: js/nanocodex
      - name: Install JavaScript workspace
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix examples/astra-mpp-trial
      - name: Build account Worker dependencies
        run: pnpm exec turbo run build --filter nanocodex-connect-protocol
      - name: Test the account Worker
        run: pnpm --filter nanocodex-web run test:web
      - name: Build JavaScript apps
        run: |
          pnpm exec turbo run build --only \
            --filter nanocodex-tools \
            --filter nanocodex-connect-ui \
            --filter nanocodex-terminal \
            --filter @nanocodex/connect-dialog \
            --filter @nanocodex/connect-playground \
            --filter nanocodex-web
          npm run check --prefix examples/astra-mpp-trial
  codeql:
    name: CodeQL actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          category: /language:actions

  ci-success:
    name: ci success
    # Report failed prerequisites, but do not keep a cancelled workflow holding
    # its concurrency slot while this final job waits for a runner.
    if: always() && !cancelled()
    needs: [changes, test, shared-hands, voice-native, windows-hand, quality, vm-guest, policy, wasm-build, bindings, python, apps, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable CI job
        env:
          CHANGES: ${{ needs.changes.result }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
          VOICE_REQUIRED: ${{ needs.changes.outputs.voice }}
          PYTHON_REQUIRED: ${{ needs.changes.outputs.python }}
          TEST: ${{ needs.test.result }}
          SHARED_HANDS: ${{ needs.shared-hands.result }}
          VOICE_NATIVE: ${{ needs.voice-native.result }}
          WINDOWS_HAND: ${{ needs.windows-hand.result }}
          QUALITY: ${{ needs.quality.result }}
          VM_GUEST: ${{ needs.vm-guest.result }}
          POLICY: ${{ needs.policy.result }}
          WASM_BUILD: ${{ needs.wasm-build.result }}
          BINDINGS: ${{ needs.bindings.result }}
          PYTHON: ${{ needs.python.result }}
          APPS: ${{ needs.apps.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          # Missing/invalid selection must fail, never silently waive coverage.
          test "$CHANGES" = success
          require_selected() {
            case "$1" in
              true) test "$2" = success ;;
              false) test "$2" = skipped ;;
              *) return 1 ;;
            esac
          }
          test "$TEST" = success
          require_selected "$NATIVE_REQUIRED" "$SHARED_HANDS"
          require_selected "$VOICE_REQUIRED" "$VOICE_NATIVE"
          require_selected "$NATIVE_REQUIRED" "$WINDOWS_HAND"
          test "$QUALITY" = success
          require_selected "$NATIVE_REQUIRED" "$VM_GUEST"
          test "$POLICY" = success
          test "$WASM_BUILD" = success
          test "$BINDINGS" = success
          require_selected "$PYTHON_REQUIRED" "$PYTHON"
          test "$APPS" = success
          test "$CODEQL" = success
