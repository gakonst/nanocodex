name: Windows RTMP deployment build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-rtmp:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: f142cdeda5018d7725556662cd8f2dc3f945363f
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          key: nightly-windows-hand
          cache-on-failure: true
      - name: Test RTMP publisher and build
        shell: pwsh
        env:
          STABLE_GIT_COMMIT: f142cdeda5018d7725556662cd8f2dc3f945363f
        run: |
          cargo test --locked --package nanocodex2-bin --bin nanocodex2 screen_broadcast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --profile nightly --package nanocodex2-bin --bin nanocodex2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item target/nightly/nanocodex2.exe dist/nanocodex2.exe
          git rev-parse HEAD | Set-Content dist/BUILD_SHA.txt
          Get-FileHash dist/nanocodex2.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-rtmp-publisher
          path: dist/*
          retention-days: 7
