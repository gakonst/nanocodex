name: Nightly Release
run-name: "${{ inputs.pr && format('PR #{0} artifacts', inputs.pr) || 'Nightly Release' }}"

permissions: {}

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to build without publishing a release
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ inputs.pr && format('pr-artifacts-{0}', inputs.pr) || 'nightly-release' }}
  cancel-in-progress: ${{ inputs.pr != '' }}

jobs:
  # CLI and voice builds are independent. Keep them on separate
  # runners, then assemble the same complete per-platform downloads as before.
  build:
    if: github.repository == 'gakonst/nanocodex'
    name: build ${{ matrix.component }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        component: [cli, voice]
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            init-target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
            init-target: aarch64-unknown-linux-musl
          - component: cli
            workspaces: .
          - component: voice
            workspaces: |
              .
              third_party/codex-voice
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || github.sha }}
          persist-credentials: false
      - name: Record exact source revision
        shell: bash
        run: |
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "STABLE_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}${{ matrix.component == 'cli' && format(',{0}', matrix.init-target) || '' }}
      - name: Install Linux init linker
        if: runner.os == 'Linux' && matrix.component == 'cli'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Install macOS init linker
        if: runner.os == 'macOS' && matrix.component == 'cli'
        run: brew install lld
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: nightly-${{ matrix.component }}-${{ matrix.target }}
          # Voice helpers have their own Cargo target directories.
          workspaces: ${{ matrix.workspaces }}
          cache-on-failure: true
      - name: Enforce ring-only Rustls provider
        if: matrix.component == 'cli'
        shell: bash
        run: ./scripts/check-rustls-provider.sh
      - name: Build nightly binaries
        if: matrix.component == 'cli'
        shell: bash
        env:
          TAG_NAME: ${{ inputs.pr && format('pr-{0}', inputs.pr) || 'nightly' }}
        run: |
          # libkrun's build script does not track installed Rust targets. Drop
          # cached init blobs that may have used its dynamic-link fallback.
          cargo clean --package krun-init-blob --profile nightly --target ${{ matrix.target }}
          VERGEN_GIT_SHA="$BUILD_SHA" \
            cargo build --locked --profile nightly --timings \
              --package nanocodex-bin --bin nanocodex --features tempo \
              --target ${{ matrix.target }}
          VERGEN_GIT_SHA="$BUILD_SHA" \
            cargo build --locked --profile nightly --timings \
              --package nanocodex2-bin --bin nanocodex2 \
              --target ${{ matrix.target }}
      - name: Verify embedded VM init
        if: matrix.component == 'cli'
        shell: bash
        run: python3 scripts/check-vm-init.py "target/${{ matrix.target }}/nightly/build"
      - name: Sign macOS VM hand host
        if: runner.os == 'macOS' && matrix.component == 'cli'
        shell: bash
        run: |
          codesign --force --sign - \
            --entitlements nanocodex-vm.entitlements \
            "target/${{ matrix.target }}/nightly/nanocodex2"
          codesign --verify --strict "target/${{ matrix.target }}/nightly/nanocodex2"
      - uses: ./.github/actions/voice-release
        if: matrix.component == 'voice'
        with:
          target: ${{ matrix.target }}
          output: dist/nanocodex-voice-${{ matrix.target }}.tar.gz
      - name: Stage and smoke native component
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          case "$COMPONENT" in
            cli)
              for binary in nanocodex nanocodex2; do
                "target/$TARGET/nightly/$binary" --help >/dev/null
                cp "target/$TARGET/nightly/$binary" "dist/$binary-$TARGET"
              done
              ;;
            voice)
              # The composite action verifies initialization and relocation.
              test -s "dist/nanocodex-voice-$TARGET.tar.gz"
              ;;
          esac
          printf '%s\n' "$BUILD_SHA" > "dist/BUILD_SHA-$COMPONENT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-component-${{ matrix.component }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.pr && 7 || 1 }}
      - name: Retain Cargo build timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-timings-${{ matrix.component }}-${{ matrix.target }}
          path: |
            target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  bundle:
    name: bundle ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-apple-darwin]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nightly-component-*-${{ matrix.target }}
          path: parts
      - name: Assemble matching components
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          mkdir dist
          for component in cli voice; do
            part="parts/nightly-component-$component-$TARGET"
            cmp "parts/nightly-component-cli-$TARGET/BUILD_SHA-cli" "$part/BUILD_SHA-$component"
            cp "$part"/nanocodex* dist/
          done
          BUILD_SHA=$(cat "parts/nightly-component-cli-$TARGET/BUILD_SHA-cli")
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -z "$PR_NUMBER" ]]; then
            test "$BUILD_SHA" = "$GITHUB_SHA"
          fi
          cd dist
          for binary in "nanocodex-$TARGET" "nanocodex2-$TARGET"; do
            test -s "$binary"
            # Artifact downloads do not preserve executable permissions.
            chmod +x "$binary"
            if [[ -z "$PR_NUMBER" ]]; then
              gzip -n -9 -c "$binary" > "$binary.gz"
            fi
          done
          test -s "nanocodex-voice-$TARGET.tar.gz"
          if [[ -n "$PR_NUMBER" ]]; then
            sha256sum "nanocodex-$TARGET" "nanocodex2-$TARGET" \
              "nanocodex-voice-$TARGET.tar.gz" \
              > "nanocodex-$TARGET.sha256"
            printf '{"repository":"%s","pr":%s,"sha":"%s","artifact":"%s","run_id":%s}\n' \
              "$GITHUB_REPOSITORY" "$PR_NUMBER" "$BUILD_SHA" "nanocodex-$TARGET" \
              "$GITHUB_RUN_ID" > PR_BUILD.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanocodex-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.pr && 7 || 1 }}

  build-windows-hand:
    if: github.repository == 'gakonst/nanocodex'
    name: build Windows Hand installer
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || github.sha }}
          persist-credentials: false
      - name: Record exact source revision
        shell: pwsh
        run: |
          "BUILD_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STABLE_GIT_COMMIT=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: nightly-windows-hand
          workspaces: |
            . -> target
          cache-on-failure: true
      - name: Build Windows Hand payload
        shell: pwsh
        env:
          TAG_NAME: ${{ inputs.pr && format('pr-{0}', inputs.pr) || 'nightly' }}
        run: |
          cargo build --locked --profile nightly --timings --package nanocodex2-bin --bin nanocodex2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign payload when Authenticode is configured
        shell: pwsh
        run: >-
          ./windows/hand/sign.ps1 -Path
          ./target/nightly/nanocodex2.exe
      - name: Build and sign one-click installer
        shell: pwsh
        run: |
          $displayVersion = "nightly-$($env:BUILD_SHA.Substring(0, 10))"
          ./windows/hand/build.ps1 `
            -Nanocodex2 ./target/nightly/nanocodex2.exe `
            -Version $displayVersion `
            -NumericVersion 0.0.0.0
          ./windows/hand/sign.ps1 -Path ./dist/windows-hand/nanocodex-hand-setup-x86_64.exe
      - name: Stage artifacts and provenance
        shell: pwsh
        env:
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          Copy-Item target/nightly/nanocodex2.exe dist/windows-hand/nanocodex2-x86_64-pc-windows-msvc.exe
          if (-not [string]::IsNullOrWhiteSpace($env:PR_NUMBER)) {
            [pscustomobject]@{
              repository = $env:GITHUB_REPOSITORY
              pr = [int]$env:PR_NUMBER
              sha = $env:BUILD_SHA
              artifact = "nanocodex-hand-setup-x86_64.exe"
              run_id = [long]$env:GITHUB_RUN_ID
            } | ConvertTo-Json -Compress | Set-Content dist/windows-hand/PR_BUILD.json
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanocodex-hand-x86_64-pc-windows-msvc
          path: dist/windows-hand/*
          if-no-files-found: error
          retention-days: ${{ inputs.pr && 7 || 1 }}
      - name: Retain Cargo build timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-timings-windows-hand
          path: |
            target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  build-vm-guest:
    if: >-
      github.repository == 'gakonst/nanocodex' &&
      (github.event_name != 'workflow_dispatch' || inputs.pr == '')
    name: build x86_64 Linux VM guest
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build nightly VM guest
        shell: bash
        run: >-
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          cargo build --locked --profile nightly --package nanocodex-vm
          --bin nanocodex-vm-guest --no-default-features
          --features guest-runtime --target x86_64-unknown-linux-musl
      - name: Verify VM guest is static
        shell: bash
        run: |
          guest=target/x86_64-unknown-linux-musl/nightly/nanocodex-vm-guest
          LC_ALL=C readelf -lW "$guest" > guest-program-headers.txt
          if grep -q '[[:space:]]INTERP[[:space:]]' guest-program-headers.txt; then
            cat guest-program-headers.txt >&2
            echo "VM guest has a dynamic program interpreter" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, subprocess, tempfile
          with tempfile.TemporaryDirectory() as workspace:
              result = subprocess.run(
                  ["target/x86_64-unknown-linux-musl/nightly/nanocodex-vm-guest", workspace],
                  input=b'{"kind":"ready","payload":{"id":1}}\n',
                  capture_output=True, check=True, timeout=30)
              assert json.loads(result.stdout) == {"kind": "ready", "payload": {"id": 1, "error": None}}
          PY
      - name: Stage artifact
        shell: bash
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/nightly/nanocodex-vm-guest \
            dist/nanocodex-vm-guest-x86_64-unknown-linux-musl
          gzip -n -9 -c dist/nanocodex-vm-guest-x86_64-unknown-linux-musl \
            > dist/nanocodex-vm-guest-x86_64-unknown-linux-musl.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanocodex-vm-guest-x86_64-unknown-linux-musl
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.pr && 7 || 1 }}

  publish:
    if: >-
      github.repository == 'gakonst/nanocodex' &&
      (github.event_name != 'workflow_dispatch' || inputs.pr == '')
    name: publish immutable and rolling nightlies
    needs: [bundle, build-windows-hand, build-vm-guest]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nanocodex-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum nanocodex-*.gz nanocodex2-*.gz nanocodex-*.exe nanocodex2-*.exe > SHA256SUMS
      - name: Publish immutable and rolling releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          immutable_tag="nightly-${GITHUB_SHA}"
          short_sha="${GITHUB_SHA:0:10}"
          release_name="Nanocodex Nightly ($(date -u +%Y-%m-%d), ${short_sha})"
          notes_file=$(mktemp)
          {
            printf "Automated nightly build from [\`%s\`](https://github.com/%s/commit/%s).\n\n" "$short_sha" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf "Install it with \`nanocodex update --nightly\`.\n"
          } > "$notes_file"

          if gh release view "$immutable_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$immutable_tag" --repo "$GITHUB_REPOSITORY" \
              --title "$release_name" --notes-file "$notes_file" --prerelease
          else
            gh release create "$immutable_tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$release_name" \
              --notes-file "$notes_file" --prerelease
          fi
          gh release upload "$immutable_tag" dist/*.gz dist/*.exe dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

          # Rolling releases retain raw binaries for updaters shipped before
          # gzip support. Their checksum manifest covers both representations.
          (cd dist && sha256sum nanocodex-* nanocodex2-* > SHA256SUMS)

          # SHA256SUMS is the commit marker for clients that still read rolling assets.
          rolling_exists=false
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            rolling_exists=true
            checksum_asset_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
              --jq '[.assets[] | select(.name == "SHA256SUMS") | .id][0] // empty')
            if [ -n "$checksum_asset_id" ]; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${checksum_asset_id}"
            fi
            gh release upload nightly dist/nanocodex-* dist/nanocodex2-* \
              --repo "$GITHUB_REPOSITORY" --clobber

            while IFS=$'\t' read -r asset_id asset_name; do
              case "$asset_name" in
                nanocodex-aarch64-apple-darwin|nanocodex-aarch64-apple-darwin.gz|\
                nanocodex-x86_64-unknown-linux-gnu|nanocodex-x86_64-unknown-linux-gnu.gz|\
                nanocodex2-aarch64-apple-darwin|nanocodex2-aarch64-apple-darwin.gz|\
                nanocodex2-x86_64-unknown-linux-gnu|nanocodex2-x86_64-unknown-linux-gnu.gz|\
                nanocodex2-x86_64-pc-windows-msvc.exe|nanocodex-hand-setup-x86_64.exe|\
                nanocodex-voice-aarch64-apple-darwin.tar.gz|nanocodex-voice-x86_64-unknown-linux-gnu.tar.gz|\
                nanocodex-vm-guest-x86_64-unknown-linux-musl|nanocodex-vm-guest-x86_64-unknown-linux-musl.gz)
                  ;;
                *)
                  gh api --method DELETE \
                    "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                  ;;
              esac
            done < <(
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
                --jq '.assets[] | [.id, .name] | @tsv'
            )
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/nightly' -f sha="$GITHUB_SHA" >/dev/null
          fi

          if [ "$rolling_exists" = true ]; then
            gh release edit nightly --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Nanocodex Nightly" \
              --notes-file "$notes_file" --prerelease
          else
            gh release create nightly --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Nanocodex Nightly" \
              --notes-file "$notes_file" --prerelease
            gh release upload nightly dist/nanocodex-* dist/nanocodex2-* \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release upload nightly dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
