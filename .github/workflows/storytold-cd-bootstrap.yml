name: Bootstrap Storytold deployment credential
on:
  push:
    branches: [codex/storytold-cd-bootstrap-20261006]
    paths: [.github/workflows/storytold-cd-bootstrap.yml]
permissions: {}
jobs:
  configure:
    if: github.repository == 'gakonst/nanocodex'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-production
    steps:
      - name: Install sealed-box encryption
        run: python3 -m pip install --quiet PyNaCl==1.5.0
      - name: Encrypt directly for the destination repository
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          from nacl.public import PublicKey,SealedBox
          token=os.environ['CF_DEPLOY_TOKEN']
          if not token: raise SystemExit('Missing deployment credential')
          key=PublicKey(base64.b64decode('mgV3OqHgy/RVDSIcnm7BjWZNERKdgI3MNCEZbBf8Bis='))
          encrypted=base64.b64encode(SealedBox(key).encrypt(token.encode())).decode()
          Path('storytold-secret.json').write_text(json.dumps({'key_id':'3380204578043523366','encrypted_value':encrypted}))
          print('Prepared destination-encrypted credential; plaintext was not written.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storytold-destination-encrypted-credential
          path: storytold-secret.json
          retention-days: 1
          if-no-files-found: error
