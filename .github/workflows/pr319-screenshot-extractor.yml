name: PR 319 screenshot extractor
on:
  pull_request:
    paths: ['.github/workflows/pr319-screenshot-extractor.yml']
permissions:
  actions: read
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-inbox-evidence
          path: evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: gakonst/nanocodex
          run-id: 34924227528
      - name: Keep exported attachment manifest only
        run: |
          mkdir -p manifest-only
          find evidence -type f -path '*screenshots*' ! -iname '*.png' ! -iname '*.jpg' ! -iname '*.jpeg' -exec cp --parents '{}' manifest-only/ ';'
          find manifest-only -type f -print
          test -n "$(find manifest-only -type f -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr319-screenshot-manifest
          path: manifest-only
          if-no-files-found: error
