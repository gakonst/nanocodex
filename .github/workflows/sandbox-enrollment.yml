name: Sandbox enrollment
on:
  pull_request:
    paths:
      - 'js/managed/src/hand-hosts.ts'
      - 'js/managed/src/account-hosted-tools.ts'
      - 'js/managed/src/sandbox-desktop.ts'
      - 'js/managed/src/sandbox-runtime.ts'
      - 'js/managed/test/sandbox-*'
      - 'js/managed/vitest.sandbox.config.ts'
      - '.github/workflows/sandbox-enrollment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter nanocodex-tools run build
      - run: pnpm --filter nanocodex-managed-service exec vitest run --config vitest.sandbox.config.ts
