name: Linux Hand image

on:
  pull_request:
    paths:
      # Every path the Dockerfile COPYs, plus the smoke test.
      - 'hands/remote/image/**'
      - 'scripts/build-linux-screen-helpers.sh'
      - 'scripts/build-linux-screen-helpers.py'
      - 'scripts/tests/linux-screen-helpers-bundle.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bin/**'
      - 'crates/**'
      - 'examples/**'
      - 'js/nanocodex/**'
      - 'py/bindings/**'
      - 'third_party/**'
      - '.github/workflows/hand-image.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified AMD64 and ARM64 images and an immutable manifest receipt
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hand-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}-hand
  IMAGE_TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    # Publication always uses reviewed master source. Validation can use a branch.
    if: ${{ !inputs.publish || github.ref == 'refs/heads/master' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Pull the BuildKit bootstrap image from mirror.gcr.io by digest.
          # Docker Hub build images try mirror.gcr.io before Docker Hub.
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Configure per-architecture registry cache
        id: image-cache
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          CACHE_WRITE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}-hand:buildcache-image-$ARCH"
          echo "from=type=registry,ref=$ref" >> "$GITHUB_OUTPUT"
          if [ "$CACHE_WRITE" = true ]; then
            echo "to=type=registry,ref=$ref,mode=max,ignore-error=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        id: cache-login
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Native runners avoid running Zig's translate-c compiler under emulation.
      # A missing cache never skips the real image build; only trusted master
      # dispatches write the cache, and PRs can only read it.
      - name: Build native image
        env:
          ARCH: ${{ matrix.arch }}
          CACHE_FROM: ${{ steps.image-cache.outputs.from }}
          CACHE_TO: ${{ steps.cache-login.outcome == 'success' && steps.image-cache.outputs.to || '' }}
        run: |
          cache_args=(--cache-from "$CACHE_FROM")
          if [ -n "$CACHE_TO" ]; then
            cache_args+=(--cache-to "$CACHE_TO")
          fi
          docker buildx build --platform "linux/$ARCH" --load \
            "${cache_args[@]}" \
            --tag "$IMAGE:$IMAGE_TAG-$ARCH" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --file hands/remote/image/Dockerfile .
      - name: Exercise offline creative and development tools
        env:
          ARCH: ${{ matrix.arch }}
        run: docker run --rm --network none --entrypoint sh "$IMAGE:$IMAGE_TAG-$ARCH" -lc nanocodex-check-hand-toolkit
      - name: Exercise the desktop and both video encoders
        env:
          ARCH: ${{ matrix.arch }}
        run: bash hands/remote/image/smoke.sh "$IMAGE:$IMAGE_TAG-$ARCH" "$ARCH"
      # A native smoke can hide a binary specialized for the build runner's CPU.
      # User-mode QEMU masks extensions; no privileged binfmt registration needed.
      - name: Verify capture startup on a baseline CPU
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          case "$ARCH" in
            amd64) emulator=/usr/bin/qemu-x86_64-static; cpu=qemu64 ;;
            arm64) emulator=/usr/bin/qemu-aarch64-static; cpu=cortex-a53 ;;
          esac
          container="nanocodex-hand-cpu-$ARCH"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          timeout 20s docker run --rm --name "$container" --network none --ulimit core=0:0 --env "QEMU_CPU=$cpu" \
            --mount "type=bind,src=$emulator,dst=/usr/local/bin/qemu-baseline,readonly" \
            --entrypoint /usr/local/bin/qemu-baseline "$IMAGE:$IMAGE_TAG-$ARCH" \
            /usr/local/bin/waymote-streamd --help
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified architecture and record its digest
        if: inputs.publish
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker push "$IMAGE:$IMAGE_TAG-$ARCH"
          docker image inspect "$IMAGE:$IMAGE_TAG-$ARCH" \
            | jq -er --arg image "$IMAGE" '.[0].RepoDigests[] | select(startswith($image + "@sha256:"))' \
            > "digest-$ARCH.txt"
          test "$(wc -l < "digest-$ARCH.txt")" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.publish
        with:
          name: hand-digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}.txt
          if-no-files-found: error

  manifest:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Pull the BuildKit bootstrap image from mirror.gcr.io by digest.
          # Docker Hub build images try mirror.gcr.io before Docker Hub.
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hand-digest-*
          path: digests
          merge-multiple: true
      - name: Publish and verify the two-architecture manifest
        run: |
          docker buildx imagetools create --tag "$IMAGE:$IMAGE_TAG" \
            "$(cat digests/digest-amd64.txt)" "$(cat digests/digest-arm64.txt)"
          docker buildx imagetools inspect --raw "$IMAGE:$IMAGE_TAG" > manifest.json
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' manifest.json
          digest=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{json .Manifest}}' | jq -er '.digest')
          printf '%s@%s\n' "$IMAGE" "$digest" > hand-image.txt
          {
            echo 'Verified Linux Hand image (AMD64 and ARM64):'
            echo '```'
            cat hand-image.txt
            echo '```'
            echo 'Configure NANOCODEX_HAND_IMAGE with this digest after anonymous pull verification.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hand-image-receipt
          path: |
            hand-image.txt
            manifest.json
            digests/*.txt
          if-no-files-found: error
