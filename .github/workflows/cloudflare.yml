name: Cloudflare

permissions: {}

on:
  pull_request:
    paths:
      - "js/**"
      - "!js/desktop-runtime/**"
      - "crates/**"
      - "hands/**"
      - "bin/**"
      - "py/bindings/**"
      - "third_party/**"
      - ".dockerignore"
      - ".node-version"
      - ".nvmrc"
      - "tsconfig*.json"
      - "assets/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - ".cargo/**"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/cloudflare.yml"
      - ".github/actions/**"
  push:
    branches: [master]
    # Native client releases must not evict unrelated live Durable Objects.
    # Manual production dispatch remains available for an explicit redeploy.
    paths:
      - "js/**"
      - "!js/desktop-runtime/**"
      - "crates/**"
      - "hands/**"
      - "bin/**"
      - "py/bindings/**"
      - "third_party/**"
      - ".dockerignore"
      - ".node-version"
      - ".nvmrc"
      - "tsconfig*.json"
      - "assets/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - ".cargo/**"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/cloudflare.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      target:
        description: Upload preview versions or deploy production
        required: true
        default: preview
        type: choice
        options: [preview, production]

env:
  # Bump this repository variable to refresh mutable upstream base images or
  # recover a receipt whose registry image was explicitly deleted.
  MANAGED_IMAGE_CACHE_EPOCH: ${{ vars.MANAGED_IMAGE_CACHE_EPOCH || '1' }}

jobs:
  # Preview builds stay unprivileged. Production builds selected Workers once on its deployment runner.
  worker-build:
    name: build Cloudflare Worker artifacts
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloudflare-worker-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Reuse unchanged WASM outputs
        id: wasm
        uses: ./.github/actions/wasm-outputs
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Test Wrangler image cache boundary
        # Temporarily disabled; re-enable when CI test coverage resumes.
        if: false
        run: node --test scripts/cloudflare/*.test.mjs
      - name: Install deployment packages
        run: pnpm install --frozen-lockfile
      - name: Install Astra trial package
        run: npm ci --prefix examples/astra-mpp-trial
      - name: Prepare managed evaluator asset
        working-directory: js/managed
        run: npm run prepare:code-evaluator
      - name: Build deployable applications
        run: |
          pnpm exec turbo run build \
            --filter nanocodex-terminal \
            --filter @nanocodex/connect-api \
            --filter @nanocodex/connect-dialog \
            --filter @nanocodex/connect-playground \
            --filter nanocodex-web
      - name: Retain verified WASM outputs
        if: github.ref == 'refs/heads/master'
        uses: ./.github/actions/save-wasm-outputs
        with:
          key: ${{ steps.wasm.outputs.key }}
          cache-hit: ${{ steps.wasm.outputs.cache-hit }}
          rejected-artifact-id: ${{ steps.wasm.outputs.rejected-artifact-id }}
      - name: Build Astra trial application
        run: npm run build:client --prefix examples/astra-mpp-trial
      - name: Package same-revision Worker outputs
        run: node scripts/cloudflare/worker-build.mjs pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-worker-build
          path: .ci-worker-build/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  preview:
    needs: worker-build
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'preview'))
    name: validate Workers and publish asset previews
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-preview
    concurrency:
      group: cloudflare-preview-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_MESSAGE: GitHub Actions preview ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select managed container rollout
        id: managed-container
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/cloudflare/preview-images.mjs
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Test Wrangler image cache boundary
        # Temporarily disabled; re-enable when CI test coverage resumes.
        if: false
        run: node --test scripts/cloudflare/*.test.mjs
      - name: Install deployment packages
        run: pnpm install --frozen-lockfile
      - name: Install Astra trial package
        run: npm ci --prefix examples/astra-mpp-trial
      - name: Prepare managed evaluator asset
        working-directory: js/managed
        run: npm run prepare:code-evaluator
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cloudflare-worker-build
          path: .ci-worker-build
      - name: Restore same-revision Worker outputs
        run: node scripts/cloudflare/worker-build.mjs restore
      # Cloudflare does not issue preview URLs for Durable Object or container
      # Workers. Dry-run those and publish previews only for asset Workers.
      - name: Validate egress Worker
        working-directory: js/egress
        run: npx wrangler deploy --dry-run --config wrangler.broker.jsonc
      - name: Validate email Worker
        working-directory: js/email
        run: npx wrangler deploy --dry-run --env=""
      - name: Validate X Worker
        run: pnpm --filter @nanocodex/x-api run build
      # Wrangler invokes plain `docker build`; the CLI override adds GHA cache
      # import/export to the actual build and preserves its loaded image for push.
      - name: Set up managed image builder
        if: steps.managed-container.outputs.rollout != 'none'
        id: managed-builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Expose BuildKit cache runtime
        if: steps.managed-container.outputs.rollout != 'none'
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - name: Validate managed Worker
        working-directory: js/managed
        env:
          WRANGLER_DOCKER_BIN: ${{ github.workspace }}/scripts/cloudflare/wrangler-docker.mjs
          BUILDX_BUILDER: ${{ steps.managed-builder.outputs.name }}
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --containers-rollout "${{ steps.managed-container.outputs.rollout }}"
      - name: Upload Connect dialog preview version
        working-directory: js/connect-dialog
        run: npx wrangler versions upload --config wrangler.jsonc --preview-alias "pr-${{ github.event.pull_request.number || github.run_id }}" --message "$DEPLOY_MESSAGE"
      - name: Validate Connect API Worker
        working-directory: js/connect-api
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Validate Astra trial Worker
        working-directory: examples/astra-mpp-trial
        run: npx wrangler deploy --dry-run --env="" --outdir dist
      - name: Validate Chief of Staff Worker
        working-directory: js/chief-of-staff
        run: npm run typecheck && npm run build
      - name: Validate account Worker
        working-directory: js/account
        run: npx wrangler deploy --dry-run --config dist/nanocodex/wrangler.json
      - name: Upload Connect playground preview version
        working-directory: js/connect-playground
        run: npx wrangler versions upload --config wrangler.jsonc --preview-alias "pr-${{ github.event.pull_request.number || github.run_id }}" --message "$DEPLOY_MESSAGE"

  image-plan:
    name: select changed Workers and required images
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-production
    permissions:
      contents: read
      deployments: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix || '{"image":[]}' }}
      build: ${{ steps.plan.outputs.build || 'false' }}
      managed: ${{ steps.release.outputs.managed }}
      phone-input: ${{ steps.phone.outputs.input }}
      sandbox-input: ${{ steps.sandbox.outputs.input }}
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_TARGET: ${{ inputs.target }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Skip superseded push
        id: current-release
        run: node scripts/cloudflare/current-production-release.mjs
      - name: Select changed Workers before scheduling images
        id: release
        if: steps.current-release.outputs.active == 'true'
        run: node scripts/cloudflare/release-plan.mjs plan
      - name: Fingerprint phone image
        if: steps.release.outputs.managed == 'true'
        id: phone
        run: node scripts/cloudflare/managed-images.mjs fingerprint phone
      - name: Fingerprint sandbox image
        if: steps.release.outputs.managed == 'true'
        id: sandbox
        run: node scripts/cloudflare/managed-images.mjs fingerprint sandbox
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.release.outputs.managed == 'true'
        with:
          path: .ci-images/phone.json
          key: managed-image-v1-${{ steps.phone.outputs.input }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.release.outputs.managed == 'true'
        with:
          path: .ci-images/sandbox.json
          key: managed-image-v1-${{ steps.sandbox.outputs.input }}
      - name: Select missing images and verify reusable receipts
        if: steps.release.outputs.managed == 'true'
        id: plan
        run: node scripts/cloudflare/plan-images.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.release.outputs.managed == 'true'
        with:
          name: managed-image-reused
          path: .ci-images/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  managed-images:
    needs: image-plan
    name: publish managed image (${{ matrix.image }})
    if: needs.image-plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Coalesce superseded pushes by immutable input, then recheck receipts once
    # the previous publisher releases the slot. Explicit dispatches stay separate.
    concurrency:
      group: cloudflare-image-${{ matrix.image }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (matrix.image == 'phone' && needs.image-plan.outputs.phone-input || needs.image-plan.outputs.sandbox-input) }}
      cancel-in-progress: false
    environment: cloudflare-production
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      CI_TESTS_ENABLED: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Test image publication boundaries
        if: false
        run: node --test scripts/cloudflare/*.test.mjs
      - name: Fingerprint committed image inputs
        id: image-input
        env:
          IMAGE: ${{ matrix.image }}
        run: node scripts/cloudflare/managed-images.mjs fingerprint "$IMAGE"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: receipt
        with:
          path: .ci-images/${{ matrix.image }}.json
          key: managed-image-v1-${{ steps.image-input.outputs.input }}
      - name: Recheck receipts after waiting for an image publisher
        id: available
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          node scripts/cloudflare/plan-images.mjs
          if [ -f ".ci-images/$IMAGE.json" ]; then
            node scripts/cloudflare/managed-images.mjs verify "$IMAGE"
            echo 'hit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.available.outputs.hit != 'true'
      - name: Install image publication tooling
        if: steps.available.outputs.hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.available.outputs.hit != 'true'
        id: builder
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
        if: steps.available.outputs.hit != 'true'
      - name: Build, verify, and publish changed image
        if: steps.available.outputs.hit != 'true'
        env:
          IMAGE: ${{ matrix.image }}
          BUILDX_BUILDER: ${{ steps.builder.outputs.name }}
        run: node scripts/cloudflare/managed-images.mjs publish "$IMAGE"
      - name: Verify immutable image receipt
        env:
          IMAGE: ${{ matrix.image }}
        run: node scripts/cloudflare/managed-images.mjs verify "$IMAGE"
      - name: Retain published image receipt independently of the build cache
        env:
          IMAGE: ${{ matrix.image }}
        run: node scripts/cloudflare/image-receipts.mjs "$IMAGE"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.receipt.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .ci-images/${{ matrix.image }}.json
          key: managed-image-v1-${{ steps.image-input.outputs.input }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-image-${{ matrix.image }}
          path: .ci-images/${{ matrix.image }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  production:
    needs: [image-plan, managed-images]
    if: >-
      always() && !cancelled() &&
      needs.image-plan.result == 'success' &&
      (needs.managed-images.result == 'success' || needs.managed-images.result == 'skipped') &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    name: build and deploy changed Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      actions: read
    env:
      CI_TESTS_ENABLED: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_MESSAGE: GitHub Actions production ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      DEPLOY_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Skip a push superseded while its images were building
        id: current-release
        run: node scripts/cloudflare/current-production-release.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.current-release.outputs.active == 'true' && needs.image-plan.outputs.managed == 'true'
        with:
          pattern: managed-image-*
          merge-multiple: true
          path: .ci-images
      - name: Select Workers changed since their successful deployments
        id: plan
        if: steps.current-release.outputs.active == 'true'
        run: node scripts/cloudflare/release-plan.mjs plan
      - name: Fingerprint the shared account relay image
        id: account-image
        if: steps.plan.outputs.account == 'true'
        run: echo "input=$(node scripts/cloudflare/account-relay-image.mjs key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: account-image-cache
        if: steps.plan.outputs.account == 'true'
        with:
          path: .ci-images/account-relay.json
          key: account-relay-image-v1-${{ steps.account-image.outputs.input }}
      - name: Reconcile image receipts after the locked release plan
        id: image-state
        if: steps.plan.outputs.managed == 'true'
        run: node scripts/cloudflare/plan-images.mjs
      - name: Compute missing receipt cache keys
        id: missing-images
        if: steps.image-state.outputs.build == 'true'
        run: |
          echo "phone=$(node scripts/cloudflare/image-key.mjs phone)" >> "$GITHUB_OUTPUT"
          echo "sandbox=$(node scripts/cloudflare/image-key.mjs sandbox)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.image-state.outputs.phone == 'true'
        with:
          path: .ci-images/phone.json
          key: managed-image-v1-${{ steps.missing-images.outputs.phone }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.image-state.outputs.sandbox == 'true'
        with:
          path: .ci-images/sandbox.json
          key: managed-image-v1-${{ steps.missing-images.outputs.sandbox }}
      - name: Check for missing images after recovery
        id: recovered-images
        if: steps.image-state.outputs.build == 'true'
        run: node scripts/cloudflare/plan-images.mjs
      - name: Reuse unchanged WASM outputs
        id: wasm
        if: steps.plan.outputs.wasm == 'true'
        uses: ./.github/actions/wasm-outputs
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.plan.outputs.workspace == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.plan.outputs.any == 'true'
        with:
          node-version: 24
          cache: ${{ steps.plan.outputs.workspace == 'true' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - name: Install only selected application dependencies
        if: steps.plan.outputs.any == 'true'
        run: node scripts/cloudflare/release-plan.mjs install
      - name: Reuse or publish one image for all account relay regions
        if: steps.plan.outputs.account == 'true'
        run: node scripts/cloudflare/account-relay-image.mjs ensure
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.plan.outputs.account == 'true' && steps.account-image-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .ci-images/account-relay.json
          key: account-relay-image-v1-${{ steps.account-image.outputs.input }}
      - name: Prepare a builder only for an image missing after locked replan
        if: steps.recovered-images.outputs.build == 'true'
        id: recovery-builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Expose recovery build cache runtime
        if: steps.recovered-images.outputs.build == 'true'
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - name: Recover missing images and retain all selected receipts
        if: steps.plan.outputs.managed == 'true'
        env:
          BUILDX_BUILDER: ${{ steps.recovery-builder.outputs.name }}
        run: node scripts/cloudflare/recover-images.mjs
      - name: Build only selected applications and their dependencies
        if: steps.plan.outputs.any == 'true'
        run: node scripts/cloudflare/release-plan.mjs build
      - name: Configure the shared immutable account relay image
        if: steps.plan.outputs.account == 'true'
        run: node scripts/cloudflare/account-relay-image.mjs config
      - name: Retain verified WASM outputs
        if: steps.plan.outputs.wasm == 'true' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/save-wasm-outputs
        with:
          key: ${{ steps.wasm.outputs.key }}
          cache-hit: ${{ steps.wasm.outputs.cache-hit }}
          rejected-artifact-id: ${{ steps.wasm.outputs.rejected-artifact-id }}
      - name: Deploy selected Workers and record successful releases
        if: steps.plan.outputs.any == 'true'
        env:
          ASTRA_MANAGED_API_KEY: ${{ secrets.NANOCODEX_ASTRA_MANAGED_API_KEY }}
          ASTRA_MPP_SECRET: ${{ secrets.NANOCODEX_ASTRA_MPP_SECRET }}
          TEMPO_API_KEY: ${{ secrets.TEMPO_MPP_API_KEY }}
        run: node scripts/cloudflare/release-workers.mjs
