name: Cloudflare

permissions: {}

on:
  pull_request:
    paths:
      - "js/**"
      - "!js/desktop-runtime/**"
      - "crates/**"
      - "hands/**"
      - "bin/**"
      - "py/bindings/**"
      - "third_party/**"
      - ".dockerignore"
      - ".node-version"
      - ".nvmrc"
      - "tsconfig*.json"
      - "assets/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - ".cargo/**"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/cloudflare.yml"
      - ".github/actions/**"
  push:
    branches: [master]
    # Native client releases must not evict unrelated live Durable Objects.
    # Manual production dispatch remains available for an explicit redeploy.
    paths:
      - "js/**"
      - "!js/desktop-runtime/**"
      - "crates/**"
      - "hands/**"
      - "bin/**"
      - "py/bindings/**"
      - "third_party/**"
      - ".dockerignore"
      - ".node-version"
      - ".nvmrc"
      - "tsconfig*.json"
      - "assets/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - ".cargo/**"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/cloudflare.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      target:
        description: Upload preview versions or deploy production
        required: true
        default: preview
        type: choice
        options: [preview, production]
      validate_images:
        description: Also validate container images independently of Worker uploads
        type: boolean
        default: false

env:
  # Bump this repository variable to refresh mutable upstream base images or
  # recover a receipt whose registry image was explicitly deleted.
  MANAGED_IMAGE_CACHE_EPOCH: ${{ vars.MANAGED_IMAGE_CACHE_EPOCH || '1' }}

jobs:
  # Preview builds stay unprivileged. Production builds selected Workers once on its deployment runner.
  worker-build:
    name: build Cloudflare Worker artifacts
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloudflare-worker-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Reuse unchanged WASM outputs
        id: wasm
        uses: ./.github/actions/wasm-outputs
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Test Wrangler image cache boundary
        # Temporarily disabled; re-enable when CI test coverage resumes.
        if: false
        run: node --test scripts/cloudflare/*.test.mjs
      - name: Install deployment packages
        run: pnpm install --frozen-lockfile
      - name: Install Astra trial package
        run: npm ci --prefix examples/astra-mpp-trial
      - name: Prepare managed evaluator asset
        working-directory: js/managed
        run: npm run prepare:code-evaluator
      - name: Build deployable applications
        run: |
          pnpm exec turbo run build \
            --filter nanocodex-terminal \
            --filter @nanocodex/connect-api \
            --filter @nanocodex/connect-dialog \
            --filter @nanocodex/connect-playground \
            --filter nanocodex-web
      - name: Retain verified WASM outputs
        if: github.ref == 'refs/heads/master'
        uses: ./.github/actions/save-wasm-outputs
        with:
          key: ${{ steps.wasm.outputs.key }}
          cache-hit: ${{ steps.wasm.outputs.cache-hit }}
          rejected-artifact-id: ${{ steps.wasm.outputs.rejected-artifact-id }}
      - name: Build Astra trial application
        run: npm run build:client --prefix examples/astra-mpp-trial
      - name: Package same-revision Worker outputs
        run: node scripts/cloudflare/worker-build.mjs pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-worker-build
          path: .ci-worker-build/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  preview-image-plan:
    name: select preview container images
    # Production already publishes changed images independently. Avoid repeating
    # release compilation on every PR; request it explicitly when testing images.
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.target == 'preview' &&
      inputs.validate_images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      required: ${{ steps.plan.outputs.required }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Select changed preview images
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/cloudflare/preview-images.mjs

  preview-images:
    needs: preview-image-plan
    name: validate preview container (${{ matrix.image }})
    concurrency:
      group: cloudflare-preview-image-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.image }}
      cancel-in-progress: true
    if: needs.preview-image-plan.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preview-image-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        id: builder
      # Keep CI_TESTS_ENABLED unset so the sandbox retains its default tests.
      - name: Build preview image without publication
        env:
          IMAGE: ${{ matrix.image }}
          BUILDX_BUILDER: ${{ steps.builder.outputs.name }}
        run: node scripts/cloudflare/managed-images.mjs preview "$IMAGE"

  preview:
    needs: worker-build
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'preview'))
    name: validate Workers and publish asset previews
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-preview
    concurrency:
      group: cloudflare-preview-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_MESSAGE: GitHub Actions preview ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Test Wrangler image cache boundary
        # Temporarily disabled; re-enable when CI test coverage resumes.
        if: false
        run: node --test scripts/cloudflare/*.test.mjs
      - name: Install deployment packages
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cloudflare-worker-build
          path: .ci-worker-build
      - name: Restore same-revision Worker outputs
        run: node scripts/cloudflare/worker-build.mjs restore
      # Publish ready assets before unrelated Worker validation.
      - name: Upload Connect dialog preview version
        working-directory: js/connect-dialog
        run: npx wrangler versions upload --config wrangler.jsonc --preview-alias "pr-${{ github.event.pull_request.number || github.run_id }}" --message "$DEPLOY_MESSAGE"
      - name: Upload Connect playground preview version
        working-directory: js/connect-playground
        run: npx wrangler versions upload --config wrangler.jsonc --preview-alias "pr-${{ github.event.pull_request.number || github.run_id }}" --message "$DEPLOY_MESSAGE"
      # Cloudflare does not issue preview URLs for Durable Object or container
      # Workers. Dry-run those and publish previews only for asset Workers.
      - name: Validate egress Worker
        working-directory: js/egress
        run: npx wrangler deploy --dry-run --config wrangler.broker.jsonc
      # These are separate Workers and do not replace the existing managed API.
      - name: Validate parallel Managed2 and Egress2 Workers
        run: |
          pnpm --filter nanocodex-egress2-service typecheck
          pnpm --filter nanocodex-egress2-service test
          pnpm --filter nanocodex-managed2 typecheck
          pnpm --filter nanocodex-managed2 test
          pnpm --filter nanocodex-managed2 test:websocket
          pnpm --filter nanocodex-egress2-service build
          pnpm --filter nanocodex-managed2 build
      - name: Validate email Worker
        working-directory: js/email
        run: npx wrangler deploy --dry-run --env=""
      - name: Validate X Worker
        run: pnpm --filter @nanocodex/x-api run build
      - name: Prepare managed evaluator asset
        working-directory: js/managed
        run: npm run prepare:code-evaluator
      - name: Validate private media Worker
        working-directory: js/media
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Validate managed Worker
        working-directory: js/managed
        run: pnpm run preview
      - name: Validate Connect API Worker
        working-directory: js/connect-api
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Install Astra trial package
        run: npm ci --prefix examples/astra-mpp-trial
      - name: Validate Astra trial Worker
        working-directory: examples/astra-mpp-trial
        run: npx wrangler deploy --dry-run --env="" --outdir dist
      - name: Validate Chief of Staff Worker
        working-directory: js/chief-of-staff
        run: npm run typecheck && npm run build
      - name: Validate account Worker
        working-directory: js/account
        run: npx wrangler deploy --dry-run --config dist/nanocodex/wrangler.json

  preview-success:
    name: Cloudflare preview success
    # Worker readiness is independent of optional native image validation.
    needs: [worker-build, preview]
    if: >-
      always() &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require Worker build and preview publication
        shell: bash
        env:
          WORKER_BUILD_RESULT: ${{ needs.worker-build.result }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
        run: |
          set -euo pipefail
          if [[ "$WORKER_BUILD_RESULT" != success || "$PREVIEW_RESULT" != success ]]; then
            printf '::error::Worker preview failed (build=%s, preview=%s)\n' \
              "$WORKER_BUILD_RESULT" "$PREVIEW_RESULT"
            exit 1
          fi

  preview-images-success:
    name: Cloudflare image validation
    needs: [preview-image-plan, preview-images]
    if: >-
      always() && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.target == 'preview' &&
      inputs.validate_images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require explicitly requested image validation
        shell: bash
        env:
          IMAGE_PLAN_RESULT: ${{ needs.preview-image-plan.result }}
          PREVIEW_IMAGES_RESULT: ${{ needs.preview-images.result }}
          IMAGES_REQUIRED: ${{ needs.preview-image-plan.outputs.required }}
        run: |
          set -euo pipefail
          if [[ "$IMAGE_PLAN_RESULT" != success ]]; then
            printf '::error::Image selection failed (%s)\n' "$IMAGE_PLAN_RESULT"
            exit 1
          fi
          case "$IMAGES_REQUIRED:$PREVIEW_IMAGES_RESULT" in
            true:success|false:skipped) ;;
            *)
              printf '::error::Invalid image validation (required=%s, result=%s)\n' \
                "$IMAGES_REQUIRED" "$PREVIEW_IMAGES_RESULT"
              exit 1
              ;;
          esac

  image-plan:
    name: select changed Workers and required images
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-production
    permissions:
      contents: read
      deployments: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix || '{"image":[]}' }}
      build: ${{ steps.plan.outputs.build || 'false' }}
      phone-input: ${{ steps.phone.outputs.input }}
      sandbox-input: ${{ steps.sandbox.outputs.input }}
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_TARGET: ${{ inputs.target }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Skip superseded push
        id: current-release
        run: node scripts/cloudflare/current-production-release.mjs
      - name: Fingerprint phone image
        if: steps.current-release.outputs.active == 'true'
        id: phone
        run: node scripts/cloudflare/managed-images.mjs fingerprint phone
      - name: Fingerprint sandbox image
        if: steps.current-release.outputs.active == 'true'
        id: sandbox
        run: node scripts/cloudflare/managed-images.mjs fingerprint sandbox
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.current-release.outputs.active == 'true'
        with:
          path: .ci-images/phone.json
          key: managed-image-v1-${{ steps.phone.outputs.input }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.current-release.outputs.active == 'true'
        with:
          path: .ci-images/sandbox.json
          key: managed-image-v1-${{ steps.sandbox.outputs.input }}
      - name: Select missing images and verify reusable receipts
        if: steps.current-release.outputs.active == 'true'
        id: plan
        run: node scripts/cloudflare/plan-images.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.current-release.outputs.active == 'true'
        with:
          name: managed-image-reused
          path: .ci-images/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  managed-images:
    needs: image-plan
    name: publish managed image (${{ matrix.image }})
    if: needs.image-plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Coalesce superseded pushes by immutable input, then recheck receipts once
    # the previous publisher releases the slot. Explicit dispatches stay separate.
    concurrency:
      group: cloudflare-image-${{ matrix.image }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (matrix.image == 'phone' && needs.image-plan.outputs.phone-input || needs.image-plan.outputs.sandbox-input) }}
      cancel-in-progress: false
    environment: cloudflare-production
    permissions:
      contents: read
      deployments: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      CI_TESTS_ENABLED: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Test image publication boundaries
        if: false
        run: node --test scripts/cloudflare/*.test.mjs
      - name: Fingerprint committed image inputs
        id: image-input
        env:
          IMAGE: ${{ matrix.image }}
        run: node scripts/cloudflare/managed-images.mjs fingerprint "$IMAGE"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: receipt
        with:
          path: .ci-images/${{ matrix.image }}.json
          key: managed-image-v1-${{ steps.image-input.outputs.input }}
      - name: Recheck receipts after waiting for an image publisher
        id: available
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          node scripts/cloudflare/plan-images.mjs
          if [ -f ".ci-images/$IMAGE.json" ]; then
            node scripts/cloudflare/managed-images.mjs verify "$IMAGE"
            echo 'hit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.available.outputs.hit != 'true'
      - name: Install image publication tooling
        if: steps.available.outputs.hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.available.outputs.hit != 'true'
        id: builder
      - name: Log in to the image cache registry
        id: cache-login
        if: >-
          steps.available.outputs.hit != 'true' &&
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, verify, and publish changed image
        if: steps.available.outputs.hit != 'true'
        env:
          IMAGE: ${{ matrix.image }}
          BUILDX_BUILDER: ${{ steps.builder.outputs.name }}
          WRANGLER_DOCKER_CACHE_WRITE: ${{ steps.cache-login.outcome == 'success' }}
        run: node scripts/cloudflare/managed-images.mjs publish "$IMAGE"
      - name: Verify immutable image receipt
        env:
          IMAGE: ${{ matrix.image }}
        run: node scripts/cloudflare/managed-images.mjs verify "$IMAGE"
      - name: Retain published image receipt independently of the build cache
        env:
          IMAGE: ${{ matrix.image }}
        run: node scripts/cloudflare/image-receipts.mjs "$IMAGE"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.receipt.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .ci-images/${{ matrix.image }}.json
          key: managed-image-v1-${{ steps.image-input.outputs.input }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-image-${{ matrix.image }}
          path: .ci-images/${{ matrix.image }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  production:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    name: build and deploy changed Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    environment: cloudflare-production
    permissions:
      contents: read
      deployments: write
      actions: read
    env:
      CI_TESTS_ENABLED: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_MESSAGE: GitHub Actions production ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      DEPLOY_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy-workers
        with:
          astra-api-key: ${{ secrets.NANOCODEX_ASTRA_MANAGED_API_KEY }}
          astra-mpp-secret: ${{ secrets.NANOCODEX_ASTRA_MPP_SECRET }}
          tempo-api-key: ${{ secrets.TEMPO_MPP_API_KEY }}

  account-image:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    name: publish account relay image independently
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-account-relay-publication
      cancel-in-progress: false
    outputs:
      built: ${{ steps.image.outputs.build }}
    environment: cloudflare-production
    permissions:
      contents: read
      deployments: write
      actions: read
    env:
      CI_TESTS_ENABLED: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_MESSAGE: GitHub Actions production ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      DEPLOY_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Skip superseded push
        id: current
        run: node scripts/cloudflare/current-production-release.mjs
      - name: Check for the published relay image
        id: image
        if: steps.current.outputs.active == 'true'
        run: node scripts/cloudflare/account-relay-image.mjs restore
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.image.outputs.build == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.image.outputs.build == 'true'
        with:
          node-version: 24
      - name: Install relay publication tools
        if: steps.image.outputs.build == 'true'
        run: pnpm install --frozen-lockfile --filter nanocodex-monorepo --filter nanocodex-web...
      - name: Publish one shared relay image
        if: steps.image.outputs.build == 'true'
        run: node scripts/cloudflare/account-relay-image.mjs ensure

  image-rollout:
    needs: [image-plan, managed-images, account-image, production]
    if: >-
      always() && !cancelled() && needs.production.result == 'success' &&
      ((needs.image-plan.outputs.build == 'true' && needs.managed-images.result == 'success') ||
       (needs.account-image.outputs.built == 'true' && needs.account-image.result == 'success'))
    name: roll out published images independently
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    environment: cloudflare-production
    permissions:
      contents: read
      deployments: write
      actions: read
    env:
      CI_TESTS_ENABLED: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_MESSAGE: GitHub Actions production ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      DEPLOY_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy-workers
        with:
          astra-api-key: ${{ secrets.NANOCODEX_ASTRA_MANAGED_API_KEY }}
          astra-mpp-secret: ${{ secrets.NANOCODEX_ASTRA_MPP_SECRET }}
          tempo-api-key: ${{ secrets.TEMPO_MPP_API_KEY }}
          component: ${{ (needs.image-plan.outputs.build == 'true' && needs.managed-images.result == 'success') && ((needs.account-image.outputs.built == 'true' && needs.account-image.result == 'success') && 'managed,account' || 'managed') || 'account' }}
