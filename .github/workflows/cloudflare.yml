name: Cloudflare

permissions: {}

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: Upload preview versions or deploy production
        required: true
        default: preview
        type: choice
        options: [preview, production]

jobs:
  durability-retained-diagnostics:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: inspect retained archive timeout
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: cloudflare-production
    permissions: {}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Read synthetic thread metadata
        env:
          NANOCODEX_DURABILITY_TEST_API_KEY: ${{ secrets.NANOCODEX_ASTRA_MANAGED_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          timeout 75s npx --yes wrangler@4.127.1 tail nanocodex-durable-agent --status error --format json > "$RUNNER_TEMP/durability-tail.json" &
          tail_pid=$!
          node --input-type=module <<'JS'
          const base = 'https://nanocodex.gakonst.workers.dev/v1/agents/feefdff0-7ce2-84e4-9601-330e10d1af28';
          await Promise.all(['', '/capacity', '/events/history?limit=8'].map(async (path) => {
            try {
              const response = await fetch(base + path, {
                headers: { authorization: `Bearer ${process.env.NANOCODEX_DURABILITY_TEST_API_KEY}` },
                signal: AbortSignal.timeout(30_000),
              });
              const data = await response.json();
              console.log(JSON.stringify({ path, status: response.status,
                ...(path === '' ? { loaded: data.agent_loaded, active_turns: data.active_turns,
                  completed_turns: data.completed_turns, stream_failed: Boolean(data.stream_error) } : {}),
                ...(path === '/capacity' ? { durable_state: data.durable_state, turns: data.turns,
                  archived_turns: data.archived_turns, archived_events: data.archived_events } : {}),
                ...(path.startsWith('/events') ? { events: data.data?.map(event => ({
                  cursor: event.cursor, turn: event.turn_id, at: event.created_at,
                  type: event.type === 'event' ? event.event.type : event.type,
                })) } : {}),
              }));
            } catch (error) { console.log(JSON.stringify({ path, error_kind: error.name })); }
          }));
          JS
          wait "$tail_pid" || [ "$?" -eq 124 ]
          python3 - <<'PY'
          import json, os
          text = open(os.path.join(os.environ['RUNNER_TEMP'], 'durability-tail.json')).read()
          decoder = json.JSONDecoder()
          while text.strip():
              text = text.lstrip()
              try:
                  event, end = decoder.raw_decode(text)
              except ValueError:
                  text = text.partition('\n')[2]
                  continue
              text = text[end:]
              print(json.dumps({'outcome': event.get('outcome'), 'timestamp': event.get('eventTimestamp'),
                  'exceptions': [{'name': e.get('name'), 'known_causes': [s for s in
                    ['memory', 'CPU', 'reset', 'deadlock', 'code was updated', 'canceled', 'storage', 'overloaded']
                    if s.lower() in e.get('message', '').lower()]} for e in event.get('exceptions', [])]}))
          PY

  preview:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'preview'))
    name: validate Workers and publish asset previews
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-preview
    concurrency:
      group: cloudflare-preview-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_MESSAGE: GitHub Actions preview ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Select managed container rollout
        id: managed-container
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          rollout=immediate
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- js/managed/Dockerfile js/managed/wrangler.jsonc; then
              rollout=none
            fi
          fi
          echo "rollout=$rollout" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: Install deployment packages
        run: pnpm install --frozen-lockfile
      - name: Install Astra trial package
        run: npm ci --prefix examples/astra-mpp-trial
      - name: Prepare managed evaluator asset
        working-directory: js/managed
        run: npm run prepare:code-evaluator
      - name: Build deployable applications
        run: |
          pnpm exec turbo run build \
            --filter nanocodex-terminal \
            --filter @nanocodex/connect-api \
            --filter @nanocodex/connect-dialog \
            --filter @nanocodex/connect-playground \
            --filter nanocodex-web
      - name: Build Astra trial application
        run: npm run build:client --prefix examples/astra-mpp-trial
      # Cloudflare does not issue preview URLs for Durable Object or container
      # Workers. Dry-run those and publish previews only for asset Workers.
      - name: Validate egress Worker
        working-directory: js/egress
        run: npx wrangler deploy --dry-run --config wrangler.broker.jsonc
      - name: Validate managed Worker
        working-directory: js/managed
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --containers-rollout "${{ steps.managed-container.outputs.rollout }}"
      - name: Upload Connect dialog preview version
        working-directory: js/connect-dialog
        run: npx wrangler versions upload --config wrangler.jsonc --preview-alias "pr-${{ github.event.pull_request.number || github.run_id }}" --message "$DEPLOY_MESSAGE"
      - name: Validate Connect API Worker
        working-directory: js/connect-api
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Validate Astra trial Worker
        working-directory: examples/astra-mpp-trial
        run: npx wrangler deploy --dry-run --env="" --outdir dist
      - name: Validate Chief of Staff Worker
        working-directory: js/chief-of-staff
        run: npm run check
      - name: Validate account Worker
        working-directory: js/account
        run: npx wrangler deploy --dry-run --config dist/nanocodex/wrangler.json
      - name: Upload Connect playground preview version
        working-directory: js/connect-playground
        run: npx wrangler versions upload --config wrangler.jsonc --preview-alias "pr-${{ github.event.pull_request.number || github.run_id }}" --message "$DEPLOY_MESSAGE"

  production:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    name: deploy Cloudflare production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_MESSAGE: GitHub Actions production ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Select managed container rollout
        id: managed-container
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          rollout=immediate
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- js/managed/Dockerfile js/managed/wrangler.jsonc; then
              rollout=none
            fi
          fi
          echo "rollout=$rollout" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: Install deployment packages
        run: pnpm install --frozen-lockfile
      - name: Install Astra trial package
        run: npm ci --prefix examples/astra-mpp-trial
      - name: Prepare managed evaluator asset
        working-directory: js/managed
        run: npm run prepare:code-evaluator
      - name: Build deployable applications
        run: |
          pnpm exec turbo run build \
            --filter nanocodex-terminal \
            --filter @nanocodex/connect-api \
            --filter @nanocodex/connect-dialog \
            --filter @nanocodex/connect-playground \
            --filter nanocodex-web
      - name: Build Astra trial application
        run: npm run build:client --prefix examples/astra-mpp-trial
      - name: Deploy egress broker
        working-directory: js/egress
        run: npx wrangler deploy --config wrangler.broker.jsonc --message "$DEPLOY_MESSAGE"
      - name: Deploy managed agent service
        working-directory: js/managed
        run: npx wrangler deploy --config wrangler.jsonc --containers-rollout "${{ steps.managed-container.outputs.rollout }}" --message "$DEPLOY_MESSAGE"
      - name: Deploy Connect dialog assets
        working-directory: js/connect-dialog
        run: npx wrangler deploy --config wrangler.jsonc --message "$DEPLOY_MESSAGE"
      - name: Deploy Connect API
        working-directory: js/connect-api
        run: npx wrangler deploy --config wrangler.jsonc --message "$DEPLOY_MESSAGE"
      - name: Deploy Astra trial application
        working-directory: examples/astra-mpp-trial
        run: npx wrangler deploy --env="" --message "$DEPLOY_MESSAGE"
      - name: Configure Astra trial secrets
        working-directory: examples/astra-mpp-trial
        env:
          ASTRA_MANAGED_API_KEY: ${{ secrets.NANOCODEX_ASTRA_MANAGED_API_KEY }}
          ASTRA_MPP_SECRET: ${{ secrets.NANOCODEX_ASTRA_MPP_SECRET }}
          TEMPO_API_KEY: ${{ secrets.TEMPO_MPP_API_KEY }}
        run: |
          missing=()
          [ -n "$ASTRA_MANAGED_API_KEY" ] || missing+=(NANOCODEX_ASTRA_MANAGED_API_KEY)
          [ -n "$ASTRA_MPP_SECRET" ] || missing+=(NANOCODEX_ASTRA_MPP_SECRET)
          [ -n "$TEMPO_API_KEY" ] || missing+=(TEMPO_MPP_API_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Astra trial remains fail-closed; missing repository secrets: ${missing[*]}"
          fi
          if [ "${#missing[@]}" -lt 3 ]; then
            node --input-type=module -e '
              const entries = [
                ["NANOCODEX_ASTRA_MANAGED_API_KEY", process.env.ASTRA_MANAGED_API_KEY],
                ["NANOCODEX_ASTRA_MPP_SECRET", process.env.ASTRA_MPP_SECRET],
                ["TEMPO_MPP_API_KEY", process.env.TEMPO_API_KEY],
              ].filter(([, value]) => value);
              process.stdout.write(JSON.stringify(Object.fromEntries(entries)));
            ' | npx wrangler secret bulk --env=""
          fi
      - name: Deploy Chief of Staff integration
        working-directory: js/chief-of-staff
        run: npx wrangler deploy --config wrangler.jsonc --message "$DEPLOY_MESSAGE"
      - name: Deploy Connect playground
        working-directory: js/connect-playground
        run: npx wrangler deploy --config wrangler.jsonc --message "$DEPLOY_MESSAGE"
      - name: Deploy account application
        working-directory: js/account
        run: npx wrangler deploy --config dist/nanocodex/wrangler.json --message "$DEPLOY_MESSAGE"

  durability-live:
    name: exercise deployed durable threads
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Exercise long conversations through the deployed managed API
        env:
          NANOCODEX_DURABILITY_TEST_API_KEY: ${{ secrets.NANOCODEX_ASTRA_MANAGED_API_KEY }}
          NANOCODEX_DURABILITY_RECOVERY_AGENTS: ${{ vars.NANOCODEX_DURABILITY_RECOVERY_AGENTS || '[]' }}
        run: node --test js/managed/test/live-durability.test.mjs
