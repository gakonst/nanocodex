# Deployment-only branch: release the scoped image recovery fix without changing containers.
name: Cloudflare
permissions: {}
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy the managed image recovery fix
        required: true
        default: production
        type: choice
        options: [production]
jobs:
  production:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    name: deploy Cloudflare production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_MESSAGE: Managed image recovery ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: Install deployment packages
        run: pnpm install --frozen-lockfile
      - name: Prepare managed evaluator asset
        working-directory: js/managed
        run: npm run prepare:code-evaluator
      - name: Verify image output validation
        run: node --test js/nanocodex/test/code-runtime.test.mjs js/nanocodex/test/worker-evaluator.test.mjs
      - name: Build managed agent and WASM dependencies
        run: pnpm exec turbo run build --filter=nanocodex-managed-service
      - name: Deploy managed agent service
        working-directory: js/managed
        run: npx wrangler deploy --config wrangler.jsonc --containers-rollout none --message "$DEPLOY_MESSAGE"
