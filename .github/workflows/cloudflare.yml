name: Cloudflare

permissions: {}

on:
  pull_request:
  push:
    branches: [master]
    # Native client releases must not evict unrelated live Durable Objects.
    # Manual production dispatch remains available for an explicit redeploy.
    paths:
      - "js/**"
      - "!js/desktop-runtime/**"
      - "crates/**"
      - "hands/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - ".cargo/**"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Upload preview versions or deploy production
        required: true
        default: preview
        type: choice
        options: [preview, production]

env:
  # Bump this repository variable to refresh mutable upstream base images or
  # recover a receipt whose registry image was explicitly deleted.
  MANAGED_IMAGE_CACHE_EPOCH: ${{ vars.MANAGED_IMAGE_CACHE_EPOCH || '1' }}

jobs:
  preview:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'preview'))
    name: validate Workers and publish asset previews
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-preview
    concurrency:
      group: cloudflare-preview-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_MESSAGE: GitHub Actions preview ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Select managed container rollout
        id: managed-container
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          rollout=immediate
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
              js/managed/Dockerfile js/managed/wrangler.jsonc js/managed/.dockerignore \
              js/managed/scripts/prepare-hand-image.mjs js/managed/scripts/bundle-hand-desktop.sh \
              hands/remote crates/nanocodex-vm/image/toolkit \
              js/managed/scripts/check-dev-stack.sh \
              .dockerignore js/phone-cloud Cargo.toml Cargo.lock bin crates examples \
              js/nanocodex py/bindings third_party \
              js/managed/scripts/phone-bridge.mjs js/managed/scripts/phone-delegation.mjs \
              js/managed/src/twilio-voice.ts; then
              rollout=none
            fi
          fi
          echo "rollout=$rollout" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: Test Wrangler image cache boundary
        run: node --test scripts/cloudflare/*.test.mjs
      - name: Install deployment packages
        run: pnpm install --frozen-lockfile
      - name: Install Astra trial package
        run: npm ci --prefix examples/astra-mpp-trial
      - name: Prepare managed evaluator asset
        working-directory: js/managed
        run: npm run prepare:code-evaluator
      - name: Build deployable applications
        run: |
          pnpm exec turbo run build \
            --filter nanocodex-terminal \
            --filter @nanocodex/connect-api \
            --filter @nanocodex/connect-dialog \
            --filter @nanocodex/connect-playground \
            --filter nanocodex-web
      - name: Build Astra trial application
        run: npm run build:client --prefix examples/astra-mpp-trial
      # Cloudflare does not issue preview URLs for Durable Object or container
      # Workers. Dry-run those and publish previews only for asset Workers.
      - name: Validate egress Worker
        working-directory: js/egress
        run: npx wrangler deploy --dry-run --config wrangler.broker.jsonc
      - name: Validate X Worker
        run: pnpm --filter @nanocodex/x-api run build
      # Wrangler invokes plain `docker build`; the CLI override adds GHA cache
      # import/export to the actual build and preserves its loaded image for push.
      - name: Set up managed image builder
        if: steps.managed-container.outputs.rollout != 'none'
        id: managed-builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Expose BuildKit cache runtime
        if: steps.managed-container.outputs.rollout != 'none'
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - name: Validate managed Worker
        working-directory: js/managed
        env:
          WRANGLER_DOCKER_BIN: ${{ github.workspace }}/scripts/cloudflare/wrangler-docker.mjs
          BUILDX_BUILDER: ${{ steps.managed-builder.outputs.name }}
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --containers-rollout "${{ steps.managed-container.outputs.rollout }}"
      - name: Upload Connect dialog preview version
        working-directory: js/connect-dialog
        run: npx wrangler versions upload --config wrangler.jsonc --preview-alias "pr-${{ github.event.pull_request.number || github.run_id }}" --message "$DEPLOY_MESSAGE"
      - name: Validate Connect API Worker
        working-directory: js/connect-api
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Validate Astra trial Worker
        working-directory: examples/astra-mpp-trial
        run: npx wrangler deploy --dry-run --env="" --outdir dist
      - name: Validate Chief of Staff Worker
        working-directory: js/chief-of-staff
        run: npm run check
      - name: Validate account Worker
        working-directory: js/account
        run: npx wrangler deploy --dry-run --config dist/nanocodex/wrangler.json
      - name: Upload Connect playground preview version
        working-directory: js/connect-playground
        run: npx wrangler versions upload --config wrangler.jsonc --preview-alias "pr-${{ github.event.pull_request.number || github.run_id }}" --message "$DEPLOY_MESSAGE"

  managed-images:
    name: publish managed image (${{ matrix.image }})
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: cloudflare-production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [phone, sandbox]
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Test image publication boundaries
        run: node --test scripts/cloudflare/*.test.mjs
      - name: Fingerprint committed image inputs
        id: image-input
        env:
          IMAGE: ${{ matrix.image }}
        run: node scripts/cloudflare/managed-images.mjs fingerprint "$IMAGE"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: receipt
        with:
          path: .ci-images/${{ matrix.image }}.json
          key: managed-image-v1-${{ steps.image-input.outputs.input }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.receipt.outputs.cache-hit != 'true'
      - name: Install image publication tooling
        if: steps.receipt.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.receipt.outputs.cache-hit != 'true'
        id: builder
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
        if: steps.receipt.outputs.cache-hit != 'true'
      - name: Build, verify, and publish changed image
        if: steps.receipt.outputs.cache-hit != 'true'
        env:
          IMAGE: ${{ matrix.image }}
          BUILDX_BUILDER: ${{ steps.builder.outputs.name }}
        run: node scripts/cloudflare/managed-images.mjs publish "$IMAGE"
      - name: Verify immutable image receipt
        env:
          IMAGE: ${{ matrix.image }}
        run: node scripts/cloudflare/managed-images.mjs verify "$IMAGE"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.receipt.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .ci-images/${{ matrix.image }}.json
          key: managed-image-v1-${{ steps.image-input.outputs.input }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-image-${{ matrix.image }}
          path: .ci-images/${{ matrix.image }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  production:
    needs: managed-images
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    name: deploy Cloudflare production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_MESSAGE: GitHub Actions production ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Skip a push superseded while its images were building
        id: current-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          active=true
          if [ "$EVENT" = push ]; then
            latest=$(gh api "repos/$GH_REPO/actions/workflows/cloudflare.yml/runs?branch=master&event=push&per_page=1" --jq '.workflow_runs[0].id')
            [[ "$latest" =~ ^[0-9]+$ ]]
            if [ "$latest" != "$GITHUB_RUN_ID" ]; then
              active=false
              echo 'A newer production push exists; skipping this superseded deployment.'
            fi
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.current-release.outputs.active == 'true'
        with:
          pattern: managed-image-*
          merge-multiple: true
          path: .ci-images
      - name: Select immutable managed images
        if: steps.current-release.outputs.active == 'true'
        run: node scripts/cloudflare/managed-images.mjs config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        if: steps.current-release.outputs.active == 'true'
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        if: steps.current-release.outputs.active == 'true'
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.current-release.outputs.active == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.current-release.outputs.active == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        if: steps.current-release.outputs.active == 'true'
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: Test Wrangler image cache boundary
        if: steps.current-release.outputs.active == 'true'
        run: node --test scripts/cloudflare/*.test.mjs
      - name: Install deployment packages
        if: steps.current-release.outputs.active == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Astra trial package
        if: steps.current-release.outputs.active == 'true'
        run: npm ci --prefix examples/astra-mpp-trial
      - name: Prepare managed evaluator asset
        if: steps.current-release.outputs.active == 'true'
        working-directory: js/managed
        run: npm run prepare:code-evaluator
      - name: Build deployable applications
        if: steps.current-release.outputs.active == 'true'
        run: |
          pnpm exec turbo run build \
            --filter nanocodex-terminal \
            --filter @nanocodex/connect-api \
            --filter @nanocodex/connect-dialog \
            --filter @nanocodex/connect-playground \
            --filter nanocodex-web
      - name: Build Astra trial application
        if: steps.current-release.outputs.active == 'true'
        run: npm run build:client --prefix examples/astra-mpp-trial
      - name: Deploy egress broker
        if: steps.current-release.outputs.active == 'true'
        working-directory: js/egress
        run: npx wrangler deploy --config wrangler.broker.jsonc --message "$DEPLOY_MESSAGE"
      - name: Deploy X Worker
        if: steps.current-release.outputs.active == 'true'
        run: pnpm deploy:x
      - name: Deploy managed agent service
        if: steps.current-release.outputs.active == 'true'
        working-directory: js/managed
        run: npx wrangler deploy --config wrangler.ci.jsonc --containers-rollout immediate --message "$DEPLOY_MESSAGE"
      - name: Deploy agent email service
        if: steps.current-release.outputs.active == 'true'
        run: pnpm deploy:email
      - name: Deploy Connect dialog assets
        if: steps.current-release.outputs.active == 'true'
        working-directory: js/connect-dialog
        run: npx wrangler deploy --config wrangler.jsonc --message "$DEPLOY_MESSAGE"
      - name: Deploy Connect API
        if: steps.current-release.outputs.active == 'true'
        working-directory: js/connect-api
        run: npx wrangler deploy --config wrangler.jsonc --message "$DEPLOY_MESSAGE"
      - name: Deploy Astra trial application
        if: steps.current-release.outputs.active == 'true'
        working-directory: examples/astra-mpp-trial
        run: npx wrangler deploy --env="" --message "$DEPLOY_MESSAGE"
      - name: Configure Astra trial secrets
        if: steps.current-release.outputs.active == 'true'
        working-directory: examples/astra-mpp-trial
        env:
          ASTRA_MANAGED_API_KEY: ${{ secrets.NANOCODEX_ASTRA_MANAGED_API_KEY }}
          ASTRA_MPP_SECRET: ${{ secrets.NANOCODEX_ASTRA_MPP_SECRET }}
          TEMPO_API_KEY: ${{ secrets.TEMPO_MPP_API_KEY }}
        run: |
          missing=()
          [ -n "$ASTRA_MANAGED_API_KEY" ] || missing+=(NANOCODEX_ASTRA_MANAGED_API_KEY)
          [ -n "$ASTRA_MPP_SECRET" ] || missing+=(NANOCODEX_ASTRA_MPP_SECRET)
          [ -n "$TEMPO_API_KEY" ] || missing+=(TEMPO_MPP_API_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Astra trial remains fail-closed; missing repository secrets: ${missing[*]}"
          fi
          if [ "${#missing[@]}" -lt 3 ]; then
            node --input-type=module -e '
              const entries = [
                ["NANOCODEX_ASTRA_MANAGED_API_KEY", process.env.ASTRA_MANAGED_API_KEY],
                ["NANOCODEX_ASTRA_MPP_SECRET", process.env.ASTRA_MPP_SECRET],
                ["TEMPO_MPP_API_KEY", process.env.TEMPO_API_KEY],
              ].filter(([, value]) => value);
              process.stdout.write(JSON.stringify(Object.fromEntries(entries)));
            ' | npx wrangler secret bulk --env=""
          fi
      - name: Deploy Chief of Staff integration
        if: steps.current-release.outputs.active == 'true'
        working-directory: js/chief-of-staff
        run: npx wrangler deploy --config wrangler.jsonc --message "$DEPLOY_MESSAGE"
      - name: Deploy Connect playground
        if: steps.current-release.outputs.active == 'true'
        working-directory: js/connect-playground
        run: npx wrangler deploy --config wrangler.jsonc --message "$DEPLOY_MESSAGE"
      - name: Deploy account application
        if: steps.current-release.outputs.active == 'true'
        working-directory: js/account
        run: npx wrangler deploy --config dist/nanocodex/wrangler.json --message "$DEPLOY_MESSAGE"

      - name: Verify deployed account Worker health
        if: steps.current-release.outputs.active == 'true'
        timeout-minutes: 1
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('https://nanocodex.gakonst.workers.dev/api/health', {
            signal: AbortSignal.timeout(20_000),
          });
          assert.equal(response.status, 200, 'account Worker health HTTP status');
          const health = await response.json();
          assert.equal(health.service, 'nanocodex');
          assert.equal(health.runtime, 'cloudflare-workers');
          assert.equal(health.status, 'ok');
          console.log('Account Worker health passed');
          JS
