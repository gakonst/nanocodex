name: Apple Inbox
on:
  push:
    branches: [feat/swift-agent-inbox]
    paths: ['apple/**', '.github/workflows/apple-inbox.yml']
  pull_request:
    paths: ['apple/**', '.github/workflows/apple-inbox.yml']
permissions:
  contents: read
concurrency:
  group: apple-inbox-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Protocol and inbox policy
        run: swift test --package-path apple/InboxCore
      - name: Build Mac app
        run: xcodebuild -project apple/NanocodexInbox.xcodeproj -scheme NanocodexInbox -configuration Debug -destination 'platform=macOS' -derivedDataPath apple/build/mac CODE_SIGNING_ALLOWED=NO build
      - name: Build iPhone app
        run: xcodebuild -project apple/NanocodexInbox.xcodeproj -scheme NanocodexInbox -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath apple/build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Native iPhone journey
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild -project apple/NanocodexInbox.xcodeproj -scheme NanocodexInbox -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath apple/build/ios CODE_SIGNING_ALLOWED=NO build-for-testing
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          mkdir -p apple/build/evidence
          xcrun simctl io "$device" recordVideo --codec=h264 apple/build/evidence/inbox-journey.mp4 &
          capture_pid=$!
          trap 'kill -INT "$capture_pid" 2>/dev/null || true; wait "$capture_pid" || true' EXIT
          xcodebuild -project apple/NanocodexInbox.xcodeproj -scheme NanocodexInbox -configuration Debug -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -derivedDataPath apple/build/ios -resultBundlePath apple/build/inbox.xcresult CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Export native screenshots
        if: always()
        run: |
          if [ -d apple/build/inbox.xcresult ]; then
            xcrun xcresulttool export attachments --path apple/build/inbox.xcresult --output-path apple/build/evidence/screenshots
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-inbox-evidence
          path: |
            apple/build/evidence
            apple/build/inbox.xcresult
          if-no-files-found: ignore
