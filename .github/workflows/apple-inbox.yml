name: Apple apps
on:
  push:
    branches: [master]
    paths: ['Cargo.toml', 'Cargo.lock', 'bin/nanocodex/**', 'crates/experimental/nanocodex-computer/**', 'js/nanocodex-computer/**', 'crates/nanocodex-voice-protocol/**', 'crates/nanocodex-voice-ffi/**', 'apple/**', 'macos/**', 'hands/remote/**', 'js/desktop-runtime/**', 'js/nanocodex/**', 'js/nanocodex-tools/**', 'js/nanocodex-vite/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', '.github/workflows/apple-inbox.yml', 'scripts/ci/apple-package-tests.sh', 'scripts/ci/select-apple-jobs.mjs', 'scripts/ci/select-jobs.mjs']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'bin/nanocodex/**', 'crates/experimental/nanocodex-computer/**', 'js/nanocodex-computer/**', 'crates/nanocodex-voice-protocol/**', 'crates/nanocodex-voice-ffi/**', 'apple/**', 'macos/**', 'hands/remote/**', 'js/desktop-runtime/**', 'js/nanocodex/**', 'js/nanocodex-tools/**', 'js/nanocodex-vite/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', '.github/workflows/apple-inbox.yml', 'scripts/ci/apple-package-tests.sh', 'scripts/ci/select-apple-jobs.mjs', 'scripts/ci/select-jobs.mjs']
permissions:
  contents: read
# Explicit bash enables GitHub Actions' -e -o pipefail invocation, including
# the xcodebuild | tee | grep evidence pipeline below.
defaults:
  run:
    shell: bash
concurrency:
  group: apple-inbox-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  changes:
    name: Select affected Apple targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.select.outputs.macos }}
      ios: ${{ steps.select.outputs.ios }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        run: node scripts/ci/select-apple-jobs.mjs
  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    name: Native Mac workspace
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: apple-macos
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build shared Rust voice core
        run: pnpm build:voice-core
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: hands/remote/go.sum
      - name: Remote companion protocol
        # Temporarily disabled: CI tests are paused.
        if: ${{ false }}
        run: go test -race ./...
        working-directory: hands/remote
      - name: Native remote video, input, and reconnection
        # Temporarily disabled: CI tests are paused.
        if: ${{ false }}
        run: swift test --package-path apple/NanocodexRemote
      - name: Build shared desktop runtime and dependencies
        run: pnpm exec turbo run build --filter=@nanocodex/desktop-runtime
      - name: Build computer Hand and matching service installer
        run: cargo build --release --locked -p nanocodex-bin --bin nanocodex -p nanocodex2-bin --bin nanocodex2
      - name: Prepare bundled Mac runtime
        run: |
          curl --fail --location https://nodejs.org/dist/v24.19.0/node-v24.19.0-darwin-arm64.tar.gz --output "$RUNNER_TEMP/nanocodex-node.tar.gz"
          printf '%s  %s\n' 8294b7aa9b03997481c06babf1e8b270c859358f27da57a11509afe537ac381d "$RUNNER_TEMP/nanocodex-node.tar.gz" | shasum -a 256 --check
          tar -xOf "$RUNNER_TEMP/nanocodex-node.tar.gz" node-v24.19.0-darwin-arm64/bin/node > macos/Resources/runtime/node
          tar -xOf "$RUNNER_TEMP/nanocodex-node.tar.gz" node-v24.19.0-darwin-arm64/LICENSE > macos/Resources/runtime/NODE-LICENSE.txt
          chmod 755 macos/Resources/runtime/node
      - name: Build native workspace
        run: >-
          xcodebuild -project macos/Nanocodex.xcodeproj -scheme Nanocodex
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath macos/build -resultBundlePath macos/build/background-hands.xcresult
          build
      - name: Build native workspace and check tiling and background Hands
        if: ${{ false }}
        run: >-
          xcodebuild -project macos/Nanocodex.xcodeproj -scheme Nanocodex
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath macos/build -resultBundlePath macos/build/background-hands-tests.xcresult
          -only-testing:NanocodexTests/BackgroundHandTests
          -only-testing:NanocodexTests/ProtocolTests/testRestoredTiledSelectionIgnoresInboxFiltering
          -only-testing:NanocodexTests/ProtocolTests/testNativeTiledInboxKeepsEditorsActionsAndReviewIndependent
          test
      - name: Verify bundled installer and VM host entitlement
        run: |
          helper=macos/build/Build/Products/Debug/Nanocodex.app/Contents/Resources/runtime/nanocodex2
          installer="$(dirname "$helper")/nanocodex"
          test -x "$installer"
          codesign --verify --strict "$installer"
          "$installer" hand install --help | grep -- --prepare
          codesign --verify --strict "$helper"
          codesign --display --entitlements - --xml "$helper" > "$RUNNER_TEMP/vm-host-entitlements.plist"
          python3 - "$RUNNER_TEMP/vm-host-entitlements.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as source:
              assert plistlib.load(source).get("com.apple.security.hypervisor") is True
          PY
      - name: Mac first launch and saved-login Hand journey
        run: |
          runtime="$PWD/macos/build/Build/Products/Debug/Nanocodex.app/Contents/Resources/runtime"
          NANOCODEX_HAND_INSTALL_E2E=1 NANOCODEX_TEST_CLI="$runtime/nanocodex" NANOCODEX_TEST_HAND="$runtime/nanocodex2" \
            node --test js/desktop-runtime/test/hand-install-login.integration.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-macos-evidence
          path: |
            macos/build/background-hands.xcresult
            macos/build/evidence
            output/hand-install-login
          if-no-files-found: ignore
  native:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    name: iPhone and iPad Inbox
    runs-on: macos-26
    # The UI suite is intentionally sequential because its system-app journeys
    # share one simulator. Leave enough room for the complete suite and one
    # targeted retry while per-test timeouts fence individual simulator hangs.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: apple-inbox
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build shared Rust voice core
        run: bash apple/NanocodexVoice/scripts/build-core.sh
      - name: Protocol, voice, context, and native Hand package tests
        # Temporarily disabled: CI tests are paused.
        if: ${{ false }}
        run: bash scripts/ci/apple-package-tests.sh
      - name: Validate native private-input transport journeys
        run: swift test --package-path apple/InboxCore --filter 'Browser(NativeForm|Login)Tests'
      # Keep the app build active while simulator journeys are paused.
      - name: Build iPhone app
        run: >-
          xcodebuild -project apple/NanocodexInbox.xcodeproj -scheme NanocodexInbox
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apple/build/ios
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/inbox-packages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          -disablePackageRepositoryCache CODE_SIGNING_ALLOWED=NO build
      # Keep the full suite paused; these bounded review journeys produce
      # successful-test recordings for the mobile rendering/media changes.
      - name: Record mobile chat timeline and media review journeys
        id: native-tests
        if: github.event_name == 'pull_request'
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild -project apple/NanocodexInbox.xcodeproj -scheme NanocodexInbox -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath apple/build/ios -clonedSourcePackagesDirPath "$RUNNER_TEMP/inbox-packages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -disablePackageRepositoryCache CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          mkdir -p apple/build/evidence
          # XCTest owns screen recording. Retain successful-test attachments in
          # the generated specification and consume that same file below.
          xctestrun=$(python3 - <<'PYTHON'
          import pathlib, plistlib
          paths = list(pathlib.Path("apple/build/ios/Build/Products").glob("NanocodexInbox_*.xctestrun"))
          if len(paths) != 1:
              raise SystemExit(f"Expected one generated Inbox xctestrun, found {len(paths)}")
          path = paths[0]
          with path.open("rb") as source:
              run = plistlib.load(source)
          if "TestConfigurations" in run:
              targets = [target for config in run["TestConfigurations"] for target in config["TestTargets"]]
          else:
              targets = [target for name, target in run.items() if not name.startswith("__")]
          ui_targets = [target for target in targets if target.get("IsUITestBundle")]
          if not ui_targets:
              raise SystemExit("Generated Inbox xctestrun contains no UI test targets")
          for target in ui_targets:
              target["PreferredScreenCaptureFormat"] = "screenRecording"
              target["SystemAttachmentLifetime"] = "keepAlways"
              target["UserAttachmentLifetime"] = "keepAlways"
          # Keep the file beside the build products: __TESTROOT__ is relative to it.
          with path.open("wb") as destination:
              plistlib.dump(run, destination)
          print(path)
          PYTHON
          )
          # Preserve the full XCTest transcript as evidence while keeping the
          # Actions log focused enough that late-suite failures are not cut off.
          xcodebuild -xctestrun "$xctestrun" -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2 -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 -resultBundlePath apple/build/inbox.xcresult \
            -only-testing:NanocodexInboxUITests/InboxUITests/testAgentSelectedNativeChoicesNotesAndCheckboxFillTogether \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeCheckboxOnlyConfirmsDisplayedStateWithoutToggling \
            -only-testing:NanocodexInboxUITests/InboxUITests/testStaleNativeSelectionHandsBackWithoutFillAndRetriesOnlyHandoff \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeBrowserCodeUsesSameFillAndHandoffJourney \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeBrowserResponsesWaitForActiveAndBackgroundCancels \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeBrowserInactiveDraftsAndLoginCheckResume \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeBrowserFormFillsOnceAndHandsBackWithoutWebsiteSubmit \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeBrowserFormHandoffFailureDoesNotRepeatFill \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeBrowserFormFailureClearsDraftsWithoutRetry \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeBrowserFormWebsiteFallbackIsExplicitAndClearsDrafts \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeBrowserFormKeepsNativeFieldsWhenOnlyHintsAreUnsupported \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeBrowserFormFallsBackToLegacyBackendOnce \
            -only-testing:NanocodexInboxUITests/InboxUITests/testMarkdownRendersInConversationAndAfterTabSwitch \
            -only-testing:NanocodexInboxUITests/InboxUITests/testWideTableKeepsTailAboveComposer \
            -only-testing:NanocodexInboxUITests/InboxUITests/testStreamingMarkdownAndToolProgressShareTimeline \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeMediaPreviewZoomPlaybackAndDraftRestoration \
            -only-testing:NanocodexInboxUITests/InboxUITests/testStreamingGrowthDoesNotMoveReaderInEarlierParagraphs \
            -only-testing:NanocodexInboxUITests/InboxUITests/testLatestButtonResumesFollowingSubsequentStreamingArrivals \
            -only-testing:NanocodexInboxUITests/InboxUITests/testSuccessiveToolCardsFollowTailWithoutFlashingJump \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeTranscriptPreservesExpandedToolAfterCellRecycling \
            -only-testing:NanocodexInboxUITests/InboxUITests/testConversationComposerKeepsReadingPositionAndSharesDraft \
            -only-testing:NanocodexInboxUITests/InboxUITests/testNativeTranscriptBoundsMountedCellsFor500Rows \
            -only-testing:NanocodexInboxUITests/InboxUITests/testLongThreadKeepsPlaceAcrossUpdatesHistoryAndForeground \
            -only-testing:NanocodexInboxUITests/InboxUITests/testSwitchingTabsRestoresEarlierReadingPosition \
            -only-testing:NanocodexInboxUITests/InboxUITests/testDrawerButtonsAndEdgeSwipePreserveMiddleTranscriptAnchor \
            test-without-building 2>&1 \
            | tee apple/build/evidence/inbox-xcodebuild.log \
            | grep -E 'Test Case .* (started|passed|failed|skipped)|\.swift:[0-9]+: error:|Testing failed:|\*\* TEST (SUCCEEDED|FAILED) \*\*'
      - name: Export native XCTest recordings and screenshots
        if: ${{ always() && steps.native-tests.outcome != 'skipped' && steps.native-tests.outcome != '' }}
        run: |
          if [ -f apple/build/inbox.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path apple/build/inbox.xcresult --output-path apple/build/evidence/attachments
            python3 - <<'PYTHON'
          import json, pathlib, shutil
          source = pathlib.Path("apple/build/evidence/attachments")
          destination = pathlib.Path("apple/build/evidence/recordings")
          destination.mkdir(exist_ok=True)
          names = {
              "testStreamingMarkdownAndToolProgressShareTimeline": "streaming-markdown-and-tools",
              "testStreamingGrowthDoesNotMoveReaderInEarlierParagraphs": "reading-during-streaming",
              "testLatestButtonResumesFollowingSubsequentStreamingArrivals": "resume-following-stream",
              "testWideTableKeepsTailAboveComposer": "table-and-keyboard",
          }
          for test in json.loads((source / "manifest.json").read_text()):
              identifier = test.get("testIdentifier", "")
              name = next((name for method, name in names.items() if method + "()" in identifier), None)
              if not name:
                  continue
              for index, attachment in enumerate(test["attachments"]):
                  filename = attachment["exportedFileName"]
                  if filename.endswith(".mp4"):
                      shutil.copy2(source / filename, destination / f"{name}-{index}.mp4")
          PYTHON
          else
            echo "Skipping attachment export because the result bundle is incomplete"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-inbox-evidence
          path: |
            apple/build/evidence
            apple/build/inbox.xcresult
          if-no-files-found: ignore
  app-intents-sdk27:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # The SDK guard must be compiled, not left unchecked by stable Xcode builds.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: apple-sdk27
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build shared Rust voice core
        run: bash apple/NanocodexVoice/scripts/build-core.sh
      # Persistent runners must not reuse shared SwiftPM bare repositories or
      # DerivedData whose repository references another job can remove.
      - name: Build iOS 27 App Intents
        run: xcodebuild -project apple/NanocodexInbox.xcodeproj -scheme NanocodexInbox -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/inbox-sdk27-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -clonedSourcePackagesDirPath "$RUNNER_TEMP/inbox-sdk27-packages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -disablePackageRepositoryCache CODE_SIGNING_ALLOWED=NO build
