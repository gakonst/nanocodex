name: JavaScript Package Preview

permissions: {}

on:
  workflow_call:
    inputs:
      wasm-artifact:
        description: Same-run WASM artifact supplied by CI
        type: string
        required: true
  workflow_dispatch:

concurrency:
  group: js-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'gakonst/nanocodex'
    name: publish commit preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - if: github.event_name == 'workflow_dispatch'
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - if: github.event_name == 'workflow_dispatch'
        uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - run: pnpm install --frozen-lockfile
      - name: Download the shared WASM package
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.wasm-artifact }}
          path: js/nanocodex
      - name: Build package for a standalone manual preview
        if: github.event_name == 'workflow_dispatch'
        run: ./js/nanocodex-vite/scripts/build-js-package.sh --release
      - name: Publish immutable commit previews
        working-directory: js/nanocodex
        run: >-
          pnpm exec pkg-pr-new publish --previewVersion --compact
          --commentWithSha . ../nanocodex-vite
