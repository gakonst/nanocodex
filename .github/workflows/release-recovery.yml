name: Recover native release artifacts

permissions: {}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to rebuild
        type: string
        required: true
        default: v0.6.4
      platform:
        description: Native platform to recover from the immutable tag
        type: choice
        required: true
        default: linux
        options: [linux, macos]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ${{ inputs.platform == 'macos' && 'macos-15' || 'ubuntu-22.04' }}
            target: ${{ inputs.platform == 'macos' && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}
            artifact: ${{ inputs.platform == 'macos' && 'nanocodex-aarch64-apple-darwin' || 'nanocodex-x86_64-unknown-linux-gnu' }}
            companion: ${{ inputs.platform == 'macos' && 'nanocodex2-aarch64-apple-darwin' || 'nanocodex2-x86_64-unknown-linux-gnu' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Verify immutable release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "nanocodex") | .version')
          test "$RELEASE_TAG" = "v$version"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - name: Prepare embedded Linux Wayland helpers
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          # Historical tags predate embedded helpers and retain their source contract.
          if [[ -x ./scripts/build-linux-screen-helpers.sh ]]; then
            ./scripts/build-linux-screen-helpers.sh --container "$RUNNER_TEMP/linux-screen-helpers.tar.gz"
            echo "NANOCODEX_LINUX_SCREEN_BUNDLE=$RUNNER_TEMP/linux-screen-helpers.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Build release binaries
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag }}
          VERGEN_GIT_SHA: ${{ env.RELEASE_SHA }}
          STABLE_GIT_COMMIT: ${{ env.RELEASE_SHA }}
        run: |
          release="target/${{ matrix.target }}/release"
          # Tags before the crate merge built the Hand from its own package.
          if cargo metadata --locked --no-deps --format-version 1 \
            | jq -e '.packages[] | select(.name == "nanocodex2-bin")' >/dev/null; then
            cargo build --locked --release \
              --package nanocodex-bin --bin nanocodex --features tempo \
              --target ${{ matrix.target }}
            cargo build --locked --release \
              --package nanocodex2-bin --bin nanocodex2 \
              --target ${{ matrix.target }}
            echo "HAND_BINARY=$release/nanocodex2" >> "$GITHUB_ENV"
            echo "VM_BINARIES=$release/nanocodex2" >> "$GITHUB_ENV"
          else
            cargo build --locked --release \
              --package nanocodex-bin --bin nanocodex --bin nanocodex-hand --features tempo \
              --target ${{ matrix.target }}
            echo "HAND_BINARY=$release/nanocodex-hand" >> "$GITHUB_ENV"
            echo "VM_BINARIES=$release/nanocodex-hand" >> "$GITHUB_ENV"
          fi
      - name: Verify shipped Linux Hand screen payload
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          if [[ -n "${NANOCODEX_LINUX_SCREEN_BUNDLE:-}" ]]; then
            # Use the verifier from the same immutable release checkout.
            python3 scripts/tests/linux-screen-helpers-bundle.py \
              --binary "$HAND_BINARY" \
              "$NANOCODEX_LINUX_SCREEN_BUNDLE"
          else
            echo "Historical release: no embedded screen-helper packaging contract"
          fi
      - name: Sign macOS VM hand host
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for binary in $VM_BINARIES; do
            codesign --force --sign - \
              --entitlements nanocodex-vm.entitlements \
              "$binary"
            codesign --verify --strict "$binary"
          done
      - name: Stage artifact
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/nanocodex" "dist/${{ matrix.artifact }}"
          cp "$HAND_BINARY" "dist/${{ matrix.companion }}"
          gzip -n -9 -c "dist/${{ matrix.artifact }}" \
            > "dist/${{ matrix.artifact }}.gz"
          gzip -n -9 -c "dist/${{ matrix.companion }}" \
            > "dist/${{ matrix.companion }}.gz"
      - name: Retain compiled binaries before voice packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}-binaries
          path: dist/*
          if-no-files-found: error
      - uses: ./.github/actions/voice-release
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && format('-Lnative={0}/voice-release/native/prefix/lib', runner.temp) || '' }}
          STABLE_GIT_COMMIT: ${{ env.RELEASE_SHA }}
        with:
          target: ${{ matrix.target }}
          output: voice-dist/nanocodex-voice-${{ matrix.target }}.tar.gz
      - name: Include verified voice archive
        run: cp "voice-dist/nanocodex-voice-${{ matrix.target }}.tar.gz" dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish-crates:
    name: publish crates.io packages
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          ./scripts/publish-crates.sh

