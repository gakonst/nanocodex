name: Bounded cold Durable Object trace diagnostic
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NANOCODEX_PROBE_API_KEY: ${{ secrets.NANOCODEX_ASTRA_MANAGED_API_KEY }}
    steps:
      - name: Measure twelve create, replay and cleanup pairs against deployed API
        shell: bash
        run: |
          node --input-type=module <<'JS' > "$RUNNER_TEMP/cold-create-summary.txt"
          import { randomUUID } from 'node:crypto';
          import { performance } from 'node:perf_hooks';
          const key = process.env.NANOCODEX_PROBE_API_KEY;
          if (!key) throw new Error('Live-test API key unavailable');
          const origin = 'https://nanocodex.gakonst.workers.dev';
          const body = JSON.stringify({settings:{model:'gpt-6-luna',thinking:'low',reasoning_mode:'standard',fast_mode:false}});
          const records=[];
          const metricNames=new Set(['managed_auth','managed_create','session_create','session_pre_handler','session_before_constructor','session_constructor','session_constructor_base','session_handler','catalog_attach']);
          const timing = headers => {
            const output={}; const raw=headers.get('server-timing')||'';
            for(const match of raw.matchAll(/([a-zA-Z_]+)(?:;[^,]*?)?;dur=([\d.]+)/g)) if(metricNames.has(match[1])) output[match[1]]=Number(match[2]);
            return output;
          };
          const request=async (method,path,body,key) => {
            const started=performance.now();
            const response=await fetch(origin+path,{method,headers:{authorization:'Bearer '+process.env.NANOCODEX_PROBE_API_KEY,'content-type':'application/json',...(key?{'idempotency-key':key}:{})},...(body?{body}:{}),signal:AbortSignal.timeout(16000)});
            const text=await response.text();
            return {status:response.status,elapsed:Math.round(performance.now()-started),metrics:timing(response.headers),colo:(response.headers.get('cf-ray')||'').split('-').at(-1),text};
          };
          for(let i=0;i<12;i++) {
            const idem='cold-do-followup-'+process.env.GITHUB_RUN_ID+'-'+randomUUID();
            let id; let deletion='not-created';
            try {
              const fresh=await request('POST','/v1/agents',body,idem);
              if(fresh.status<200||fresh.status>=300) throw new Error('create status '+fresh.status);
              id=JSON.parse(fresh.text).id ?? JSON.parse(fresh.text).agent_id;
              if(typeof id!=='string') throw new Error('create response missing id');
              const replay=await request('POST','/v1/agents',body,idem);
              if(replay.status<200||replay.status>=300) throw new Error('replay status '+replay.status);
              const replayId=JSON.parse(replay.text).id ?? JSON.parse(replay.text).agent_id;
              if(replayId!==id) throw new Error('idempotency mismatch');
              records.push({index:i,fresh:{status:fresh.status,elapsed:fresh.elapsed,colo:fresh.colo,metrics:fresh.metrics},replay:{status:replay.status,elapsed:replay.elapsed,colo:replay.colo,metrics:replay.metrics}});
            } finally {
              if(id) {
                const removed=await request('DELETE','/v1/agents/'+encodeURIComponent(id));
                deletion=removed.status;
              }
              console.log('trial',i,JSON.stringify(records.at(-1)||{}),'delete_status',deletion);
            }
          }
          console.log('completed',records.length);
          JS
      - name: Surface bounded sanitized summary as one annotation
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os
          p=os.path.join(os.environ['RUNNER_TEMP'],'cold-create-summary.txt')
          content=open(p).read()[:16000] if os.path.exists(p) else 'No diagnostic output'
          content=content.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice file=.github/workflows/cold-do-trace-diagnostic.yml,line=1,title=Cold create sample::'+content)
          PYCODE
