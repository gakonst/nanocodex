name: Bounded cold Durable Object trace diagnostic
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Aggregate bounded production Durable Object trace colos
        shell: bash
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/cold-colo-summary.txt"
          import json,os,urllib.request,collections
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']
          u=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/observability/telemetry/query'
          for service in ['nanocodex-cold-slim-probe','nanocodex-durable-agent']:
            body={'queryId':'cold-colo-20260924','timeframe':{'from':1790275680000,'to':1790275920000},'view':'events','dry':True,'limit':1000,'parameters':{'datasets':['otel'],'filters':[{'key':'$metadata.service','operation':'eq','type':'string','value':service}]}}
            req=urllib.request.Request(u,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+t,'Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req,timeout=35) as r: response=json.load(r)
            assert response.get('success'),[e.get('code') for e in response.get('errors',[])]
            events=(response.get('result') or {}).get('events',{}).get('events') or []
            print('service',service,'otel count',len(events))
            counts=collections.Counter()
            samples=[]
            for e in events:
              s=e.get('source') or {}; cf=s.get('cloudflare') or {}
              if not isinstance(cf,dict): continue
              kind='do' if cf.get('durable_object') else 'worker'
              counts[(kind,str(s.get('name')),str(cf.get('colo')))] += 1
              if kind=='do' and s.get('name') in ('POST','jsrpc','jsRpcCall','jsRpcSession'):
                samples.append((str(cf.get('colo')),str(s.get('name')),s.get('durationMS')))
            print('spans',counts.most_common(40))
            print('DO representative',samples[:20])
          PY
      - name: Surface bounded sanitized summary as one annotation
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os
          p=os.path.join(os.environ['RUNNER_TEMP'],'cold-colo-summary.txt')
          content=open(p).read()[:16000] if os.path.exists(p) else 'No diagnostic output'
          content=content.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice file=.github/workflows/cold-do-trace-diagnostic.yml,line=1,title=Cold DO colo summary::'+content)
          PYCODE
