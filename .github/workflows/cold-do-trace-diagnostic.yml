name: Bounded cold Durable Object trace diagnostic
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Summarize bounded production span chains without raw telemetry
        shell: bash
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/cold-trace-summary.txt"
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/observability/telemetry/query'
          timeframe={'from':1790273220000,'to':1790273760000}
          def query(view, parameters):
              body={'queryId':'cold-do-chains-20260924','timeframe':timeframe,'view':view,'dry':True,'limit':200,'parameters':parameters}
              req=urllib.request.Request(endpoint,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=35) as r: response=json.load(r)
              assert response.get('success'), [x.get('code') for x in response.get('errors',[])]
              return response.get('result') or {}
          params={'datasets':['cloudflare-workers'],'filters':[{'key':'$metadata.service','operation':'eq','type':'string','value':'nanocodex-durable-agent'}], 'needle':{'value':'managed.session.constructor'}}
          summaries=query('traces',params).get('traces') or []
          print('trace duration | root worker/colo | caller dispatch start+duration | callee handler start+duration | residual | constructor log offset; all milliseconds')
          for index,trace in enumerate([t for t in summaries if t.get('rootSpanName')=='POST'][:8]):
              tid=trace['traceId']; found=query('events',{'datasets':[],'filters':[{'key':'$metadata.traceId','operation':'eq','type':'string','value':tid}]})
              events=(found.get('events') or {}).get('events') or []
              spans=[e.get('source') or {} for e in events if e.get('dataset')=='otel']
              byid={s.get('spanId'):s for s in spans if s.get('spanId')}
              root=min((s.get('startTime') or 0) for s in spans)
              constructors=[e for e in events if isinstance(e.get('source'),dict) and e['source'].get('type')=='managed.session.constructor']
              print('TRACE',index,'summary',trace.get('traceDurationMs'),'spans',len(spans),'constructors',len(constructors))
              candidates=[]
              for handler in spans:
                  cf=handler.get('cloudflare') or {}
                  if handler.get('name')!='POST' or not cf.get('durable_object'): continue
                  fetch=byid.get(handler.get('parentSpanId')) or {}
                  caller=byid.get(fetch.get('parentSpanId')) or {}
                  if caller.get('name')!='durable_object_subrequest': continue
                  hstart=handler.get('startTime') or 0; cstart=caller.get('startTime') or 0
                  candidates.append((handler,fetch,caller))
              for h,f,c in candidates[:3]:
                  hc=h.get('cloudflare') or {}; cc=c.get('cloudflare') or {}
                  print('  root=%s/%s caller=%s/%s %s+%s callee=%s/%s %s+%s residual=%s fetch=%s constructor_logs=%s' % (next((str((s.get('cloudflare') or {}).get('script_name'))+'/'+str((s.get('cloudflare') or {}).get('colo')) for s in spans if s.get('name')=='POST' and not (s.get('cloudflare') or {}).get('durable_object')),'none'),str((byid.get(c.get('parentSpanId')) or {}).get('name')),cc.get('script_name'),cc.get('colo'),(c.get('startTime') or 0)-root,c.get('durationMS'),hc.get('script_name'),hc.get('colo'),(h.get('startTime') or 0)-root,h.get('durationMS'),(c.get('durationMS') or 0)-(h.get('durationMS') or 0),f.get('durationMS'),[(e.get('timestamp',0)-(h.get('startTime') or 0), (e.get('source') or {}).get('constructor_ms')) for e in constructors]))
          PY
      - name: Surface bounded sanitized summary as one annotation
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os
          p=os.path.join(os.environ['RUNNER_TEMP'],'cold-trace-summary.txt')
          content=open(p).read()[:16000] if os.path.exists(p) else 'No diagnostic output'
          content=content.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice file=.github/workflows/cold-do-trace-diagnostic.yml,line=1,title=Cold DO trace::'+content)
          PYCODE
