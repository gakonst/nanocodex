name: Bounded cold Durable Object trace diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Query bounded production telemetry without printing source or credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          assert account and token, 'Missing Cloudflare deployment context'
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/observability/telemetry/query'
          timeframe={'from':1790273220000,'to':1790273760000} # Sep 24, 18:07–18:16 UTC
          def query(view, parameters):
              body={'queryId':'cold-do-20260924','timeframe':timeframe,'view':view,'dry':True,'limit':100,'parameters':parameters}
              req=urllib.request.Request(endpoint,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=35) as r: result=json.load(r)
              except urllib.error.HTTPError as e:
                  print('Cloudflare telemetry HTTP status:', e.code)
                  return None
              if not result.get('success'):
                  print('Cloudflare telemetry rejected request, error codes:', [e.get('code') for e in result.get('errors',[])])
                  return None
              return result.get('result') or {}
          parameters={'datasets':['cloudflare-workers'],'filters':[{'key':'$metadata.service','operation':'eq','type':'string','value':'nanocodex-durable-agent'}], 'needle':{'value':'managed.session.constructor'}}
          result=query('events',parameters)
          if result is None: raise SystemExit(1)
          events=(result.get('events') or {}).get('events') or []
          print('Bounded constructor events:', len(events))
          trace_ids=[]
          for item in events:
              meta=item.get('$metadata') or {}
              workers=item.get('$workers') or {}
              tid=meta.get('traceId') or workers.get('traceId')
              if tid and tid not in trace_ids: trace_ids.append(tid)
              print('constructor event:',json.dumps({k:meta.get(k) for k in ('timestamp','service','traceId','spanId','parentSpanId','duration') if meta.get(k) is not None},sort_keys=True))
          # Request only the first few traces; never print source, request bodies, headers, or arbitrary log text.
          for tid in trace_ids[:4]:
              found=query('events',{'datasets':['cloudflare-workers'],'filters':[{'key':'$metadata.traceId','operation':'eq','type':'string','value':tid}]})
              if found is None: continue
              spans=(found.get('events') or {}).get('events') or []
              print('trace summary:',tid,'events:',len(spans))
              for item in spans:
                  meta=item.get('$metadata') or {}; w=item.get('$workers') or {}
                  print('span:',json.dumps({'timestamp':item.get('timestamp'),'service':meta.get('service'),'name':meta.get('spanName') or meta.get('message'),'duration':meta.get('duration'),'span_id':meta.get('spanId'),'parent_span_id':meta.get('parentSpanId'),'colo':meta.get('colo'),'execution_model':w.get('executionModel'),'event_type':w.get('eventType')},sort_keys=True))
          PY
