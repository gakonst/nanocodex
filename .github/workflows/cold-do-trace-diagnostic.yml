name: Bounded cold Durable Object trace diagnostic
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Query bounded telemetry with no raw source or credentials
        shell: bash
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/cold-trace-summary.txt"
          import json, os, urllib.request, urllib.error
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          assert account and token, 'Missing Cloudflare deployment context'
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/observability/telemetry/query'
          timeframe={'from':1790273220000,'to':1790273760000} # 2026-09-24 18:07–18:16 UTC
          def query(view, parameters):
              body={'queryId':'cold-do-20260924','timeframe':timeframe,'view':view,'dry':True,'limit':30,'parameters':parameters}
              req=urllib.request.Request(endpoint,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=35) as r: result=json.load(r)
              except urllib.error.HTTPError as e:
                  print('Cloudflare telemetry HTTP status:', e.code)
                  return None
              if not result.get('success'):
                  print('Cloudflare telemetry error codes:', [e.get('code') for e in result.get('errors',[])])
                  return None
              return result.get('result') or {}
          params={'datasets':['cloudflare-workers'],'filters':[{'key':'$metadata.service','operation':'eq','type':'string','value':'nanocodex-durable-agent'}], 'needle':{'value':'managed.session.constructor'}}
          result=query('events',params)
          if result is None: raise SystemExit(1)
          events=(result.get('events') or {}).get('events') or []
          print('Bounded constructor events:',len(events))
          if events:
              sample=events[0]
              print('event keys:', sorted(sample.keys()))
              print('metadata keys:', sorted((sample.get('$metadata') or {}).keys()))
              print('worker keys:', sorted((sample.get('$workers') or {}).keys()))
              print('source type:', type(sample.get('source')).__name__)
              if isinstance(sample.get('source'),dict): print('source keys:',sorted(sample['source'].keys()))
              print('trace-related metadata keys:',[k for k in (sample.get('$metadata') or {}) if 'trace' in k.lower() or 'span' in k.lower()])
          traces=query('traces',params)
          if traces is not None:
              summaries=traces.get('traces') or []
              print('matching trace summaries:',len(summaries))
              for trace in summaries[:8]:
                  print('trace root:',json.dumps({'name':trace.get('rootSpanName'),'duration':trace.get('traceDurationMs'),'services':trace.get('service'),'spans':trace.get('spans')},sort_keys=True))
          trace_ids=[]
          if traces is not None: trace_ids.extend([t['traceId'] for t in (traces.get('traces') or []) if t.get('traceId') and t.get('rootSpanName')=='POST' and (t.get('traceDurationMs') or 0)<10000][:3])
          for item in events[:10]:
              meta=item.get('$metadata') or {}; w=item.get('$workers') or {}
              tid=meta.get('traceId') or w.get('traceId')
              if tid and tid not in trace_ids: trace_ids.append(tid)
              print('constructor event:',json.dumps({'timestamp':item.get('timestamp'),'service':meta.get('service'),'duration':meta.get('duration'),'colo':meta.get('colo')},sort_keys=True))
          for i,tid in enumerate(trace_ids[:3]):
              found=query('events',{'datasets':['cloudflare-workers'],'filters':[{'key':'$metadata.traceId','operation':'eq','type':'string','value':tid}]})
              if found is None: continue
              spans=(found.get('events') or {}).get('events') or []
              print('trace',i+1,'event count:',len(spans))
              for item in spans[:30]:
                  meta=item.get('$metadata') or {}; w=item.get('$workers') or {}
                  print('span:',json.dumps({'timestamp':item.get('timestamp'),'service':meta.get('service'),'name':meta.get('spanName'),'duration':meta.get('duration'),'colo':meta.get('colo'),'execution_model':w.get('executionModel'),'event_type':w.get('eventType')},sort_keys=True))
          PY
      - name: Surface sanitized summary as one GitHub check annotation
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os
          p=os.path.join(os.environ['RUNNER_TEMP'],'cold-trace-summary.txt')
          content=open(p).read()[:16000] if os.path.exists(p) else 'No diagnostic output'
          content=content.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice file=.github/workflows/cold-do-trace-diagnostic.yml,line=1,title=Cold DO trace::'+content)
          PYCODE
