name: Release

permissions: {}

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: validate release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Match tag to the workspace version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "nanocodex") | .version')
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(node -p "require('./js/nanocodex/package.json').version")" = "$version"
          test "$(node -p "require('./js/nanocodex-vite/package.json').version")" = "$version"
          test "$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "nanocodex-python") | .version')" = "$version"
          grep -Fq 'dynamic = ["version"]' py/bindings/pyproject.toml
          grep -Fq "## [$version]" CHANGELOG.md
          grep -Fq '<!-- generated by git-cliff -->' CHANGELOG.md
          ./scripts/release-crates.sh check
          for crate_path in $(./scripts/release-crates.sh paths); do
            grep -Fq "## [$version]" "$crate_path/CHANGELOG.md"
            grep -Fq '<!-- generated by git-cliff -->' "$crate_path/CHANGELOG.md"
          done
          cargo metadata --no-deps --format-version 1 | jq -e --arg version "$version" \
            '[.packages[].dependencies[] | select(.source == null and (.name | startswith("nanocodex"))) | .req] | all(. == ("^" + $version))' >/dev/null
      - name: Validate installers and crate packages
        shell: bash
        run: |
          bash -n install scripts/changelog.sh scripts/check-crate-boundaries.sh scripts/check-docs.sh scripts/publish-crates.sh scripts/release-crates.sh scripts/test-install.sh
          ./scripts/test-install.sh
          ./scripts/check-crate-boundaries.sh
          ./scripts/release-crates.sh check
          for crate in $(./scripts/release-crates.sh names); do
            cargo package --locked --no-verify --config .cargo/release.toml --package "$crate"
          done
          ./scripts/check-docs.sh

  prepare-release:
    name: prepare draft release
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find previous stable release
        id: release_info
        shell: bash
        run: |
          previous=$(git tag -l 'v*.*.*' --sort=-v:refname | awk -v current="$GITHUB_REF_NAME" '$0 != current { print; exit }')
          printf 'previous=%s\n' "$previous" >> "$GITHUB_OUTPUT"
      - name: Build contributor changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@c9bcd8238b6f41e05561348339429d360b1c0247 # v6.2.3
        with:
          configuration: ./.github/changelog.json
          fromTag: ${{ steps.release_info.outputs.previous || '' }}
          toTag: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create or refresh draft release
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file=$(mktemp)
          cp .github/RELEASE_TEMPLATE.md "$notes_file"
          printf '\n%s\n' "$CHANGELOG" >> "$notes_file"

          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != true ]]; then
              echo "::error::release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --title "Nanocodex $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "Nanocodex $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: nanocodex-x86_64-unknown-linux-gnu
            companion: nanocodex2-x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: nanocodex-aarch64-apple-darwin
            companion: nanocodex2-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - name: Build release binaries
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          VERGEN_GIT_SHA: ${{ github.sha }}
        run: |
          cargo build --locked --release \
            --package nanocodex-bin --bin nanocodex --features tempo \
            --target ${{ matrix.target }}
          cargo build --locked --release \
            --package nanocodex2-bin --bin nanocodex2 \
            --target ${{ matrix.target }}
      - name: Sign macOS VM hand host
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          codesign --force --sign - \
            --entitlements nanocodex-vm.entitlements \
            "target/${{ matrix.target }}/release/nanocodex2"
          codesign --verify --strict "target/${{ matrix.target }}/release/nanocodex2"
      - name: Stage artifact
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/nanocodex" "dist/${{ matrix.artifact }}"
          cp "target/${{ matrix.target }}/release/nanocodex2" "dist/${{ matrix.companion }}"
          gzip -n -9 -c "dist/${{ matrix.artifact }}" \
            > "dist/${{ matrix.artifact }}.gz"
          gzip -n -9 -c "dist/${{ matrix.companion }}" \
            > "dist/${{ matrix.companion }}.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish-crates:
    name: publish crates.io packages
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          ./scripts/publish-crates.sh

  publish-npm:
    name: publish npm packages
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: Build and test the publishable package
        shell: bash
        run: |
          npm ci --prefix js/nanocodex
          npm ci --prefix js/nanocodex-vite
          ./js/nanocodex-vite/scripts/build-js-package.sh --release
          npm test --prefix js/nanocodex
          npm test --prefix js/nanocodex-vite
          (cd js/nanocodex && npm pack --dry-run)
          (cd js/nanocodex-vite && npm pack --dry-run)
      - name: Publish immutable npm versions
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          is_published() {
            local package_name="$1"
            local version="$2"
            [[ "$(npm view "$package_name@$version" version 2>/dev/null || true)" == "$version" ]]
          }

          publish_package() {
            local package_dir="$1"
            local package_name
            local version
            package_name=$(node -p "require('./$package_dir/package.json').name")
            version=$(node -p "require('./$package_dir/package.json').version")

            if is_published "$package_name" "$version"; then
              echo "$package_name@$version is already published"
              return
            fi

            if ! (cd "$package_dir" && npm publish --access public --provenance); then
              if is_published "$package_name" "$version"; then
                echo "$package_name@$version was published despite the client error"
                return
              fi
              echo "npm publish failed and $package_name@$version is not available" >&2
              return 1
            fi

            for attempt in {1..12}; do
              if is_published "$package_name" "$version"; then
                echo "$package_name@$version is available from the registry"
                return
              fi
              echo "Waiting for $package_name@$version registry propagation (attempt $attempt/12)..."
              sleep 10
            done

            echo "$package_name@$version did not propagate within 120 seconds" >&2
            return 1
          }

          publish_package js/nanocodex
          publish_package js/nanocodex-vite

  finalize-release:
    name: attach GitHub release assets
    needs: [build, publish-crates, publish-npm]
    if: >-
      ${{ always() &&
          needs.build.result == 'success' &&
          needs.publish-crates.result == 'success' &&
          needs.publish-npm.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum nanocodex-* nanocodex2-* > SHA256SUMS
      - name: Upload binary assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          is_draft=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft)
          test "$is_draft" = true
          gh release upload "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
