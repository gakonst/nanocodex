name: Release

permissions: {}

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: validate release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Match tag to the workspace version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "nanocodex") | .version')
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(node -p "require('./js/nanocodex/package.json').version")" = "$version"
          test "$(node -p "require('./js/nanocodex-tools/package.json').version")" = "$version"
          test "$(node -p "require('./js/nanocodex-vite/package.json').version")" = "$version"
          node --input-type=module -e 'import {readFile} from "node:fs/promises"; import {checkDocumentedBrowserVersion} from "./js/nanocodex/scripts/check-package.mjs"; checkDocumentedBrowserVersion(await readFile("js/nanocodex/README.md", "utf8"), JSON.parse(await readFile("js/nanocodex/package.json", "utf8")).version);'
          test "$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "nanocodex-python") | .version')" = "$version"
          grep -Fq 'dynamic = ["version"]' py/bindings/pyproject.toml
          grep -Fq "## [$version]" CHANGELOG.md
          grep -Fq '<!-- generated by git-cliff -->' CHANGELOG.md
          ./scripts/release-crates.sh check
          for crate_path in $(./scripts/release-crates.sh paths); do
            grep -Fq "## [$version]" "$crate_path/CHANGELOG.md"
            grep -Fq '<!-- generated by git-cliff -->' "$crate_path/CHANGELOG.md"
          done
          cargo metadata --no-deps --format-version 1 | jq -e --arg version "$version" \
            '[.packages[].dependencies[] | select(.source == null and (.name | startswith("nanocodex"))) | .req] | all(. == ("^" + $version))' >/dev/null
      - name: Validate isolated voice lockfile
        run: |
          python3 third_party/codex-voice/patches/webrtc-sys/prepare.py
          cargo metadata --locked --manifest-path third_party/codex-voice/Cargo.toml --format-version 1 > /dev/null
      - name: Validate installers and crate packages
        shell: bash
        run: |
          bash -n install scripts/changelog.sh scripts/check-crate-boundaries.sh scripts/check-docs.sh scripts/publish-crates.sh scripts/release-crates.sh scripts/test-install.sh
          ./scripts/check-crate-boundaries.sh
          ./scripts/release-crates.sh check
          for crate in $(./scripts/release-crates.sh names); do
            cargo package --locked --no-verify --config .cargo/release.toml --package "$crate"
          done
          ./scripts/check-docs.sh

      - name: Test installer
        run: ./scripts/test-install.sh

  prepare-release:
    name: prepare draft release
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find previous stable release
        id: release_info
        shell: bash
        run: |
          previous=$(git tag -l 'v*.*.*' --sort=-v:refname | awk -v current="$GITHUB_REF_NAME" '$0 != current { print; exit }')
          printf 'previous=%s\n' "$previous" >> "$GITHUB_OUTPUT"
      - name: Build contributor changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@c9bcd8238b6f41e05561348339429d360b1c0247 # v6.2.3
        with:
          configuration: ./.github/changelog.json
          fromTag: ${{ steps.release_info.outputs.previous || '' }}
          toTag: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create or refresh draft release
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file=$(mktemp)
          release_notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [[ -f "$release_notes" ]]; then
            cp "$release_notes" "$notes_file"
          else
            cp .github/RELEASE_TEMPLATE.md "$notes_file"
          fi
          printf '\n%s\n' "$CHANGELOG" >> "$notes_file"

          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != true ]]; then
              echo "::error::release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --title "Nanocodex $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "Nanocodex $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: nanocodex-x86_64-unknown-linux-gnu
            companion: nanocodex2-x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: nanocodex-aarch64-apple-darwin
            companion: nanocodex2-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          # A failed job (e.g. before compiling) must not store a near-empty target
          # under the exact key: rust-cache then restores it as "full match" and
          # skips saving ("Cache up-to-date"), keeping that key cold indefinitely.
          cache-on-failure: false
      - uses: ./.github/actions/docker-hub-mirror
        if: matrix.target == 'x86_64-unknown-linux-gnu'
      - name: Prepare embedded Linux Wayland helpers
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          ./scripts/build-linux-screen-helpers.sh --container "$RUNNER_TEMP/linux-screen-helpers.tar.gz"
          echo "NANOCODEX_LINUX_SCREEN_BUNDLE=$RUNNER_TEMP/linux-screen-helpers.tar.gz" >> "$GITHUB_ENV"
      - name: Build release binaries
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          VERGEN_GIT_SHA: ${{ github.sha }}
          STABLE_GIT_COMMIT: ${{ github.sha }}
        run: |
          # Release-stage Hand identity: computed from the Hand package closure
          # before compiling, verified against the Hand's Cargo dep-info after.
          features=nanocodex-bin/tempo
          payload=()
          if [[ -n "${NANOCODEX_LINUX_SCREEN_BUNDLE:-}" ]]; then
            # Distributable Linux Hands embed the helper payload named above.
            features+=",nanocodex-hand-daemon/embedded-screen-helpers"
            payload=(--payload "linux-screen-helpers=$NANOCODEX_LINUX_SCREEN_BUNDLE")
          fi
          NANOCODEX_HAND_IDENTITY="$(scripts/release/hand-source-identity.py compute \
            --target ${{ matrix.target }} --profile release --features "$features" \
            ${payload[@]+"${payload[@]}"} --report "$RUNNER_TEMP/hand-identity-inputs.json")"
          export NANOCODEX_HAND_IDENTITY
          echo "Hand source identity: $NANOCODEX_HAND_IDENTITY" >> "$GITHUB_STEP_SUMMARY"
          cargo build --locked --release --timings \
            --package nanocodex-bin --package nanocodex-hand-daemon --features "$features" \
            --target ${{ matrix.target }}
          scripts/release/hand-source-identity.py verify \
            --report "$RUNNER_TEMP/hand-identity-inputs.json" \
            --dep-info "target/${{ matrix.target }}/release/nanocodex-hand.d"
      - name: Verify shipped Linux Hand screen payload
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          python3 scripts/tests/linux-screen-helpers-bundle.py \
            --binary "target/${{ matrix.target }}/release/nanocodex-hand" \
            "$NANOCODEX_LINUX_SCREEN_BUNDLE"
      - name: Sign the macOS Hand and Nanocodex.app
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_TEAM_ID: ${{ secrets.MACOS_DEVELOPER_ID_TEAM_ID }}
        run: |
          # Only the Hand starts libkrun VMM children and holds macOS privacy
          # grants; the CLI keeps the default linker signature.
          scripts/release/macos-sign-hand.sh \
            "target/${{ matrix.target }}/release/nanocodex-hand" "${GITHUB_REF_NAME#v}" signed-hand
          echo "macOS Hand signature: $(cat signed-hand/SIGNING)" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/voice-release
        env:
          STABLE_GIT_COMMIT: ${{ github.sha }}
        with:
          target: ${{ matrix.target }}
          output: voice-dist/nanocodex-voice-${{ matrix.target }}.tar.gz
      - name: Stage artifact
        shell: bash
        run: |
          mkdir dist
          cp "voice-dist/nanocodex-voice-${{ matrix.target }}.tar.gz" dist/
          # nanocodex-* is the CLI; nanocodex2-* keeps the companion name for the Hand.
          cp "target/${{ matrix.target }}/release/nanocodex" "dist/${{ matrix.artifact }}"
          if [[ -d signed-hand ]]; then
            cp signed-hand/nanocodex2 "dist/${{ matrix.companion }}"
            cp signed-hand/nanocodex-app-aarch64-apple-darwin.tar.gz dist/
          else
            cp "target/${{ matrix.target }}/release/nanocodex-hand" "dist/${{ matrix.companion }}"
          fi
          signing=unsigned
          if [[ -f signed-hand/SIGNING ]]; then signing="$(cat signed-hand/SIGNING)"; fi
          scripts/release/hand-identity.sh "target/${{ matrix.target }}/release/nanocodex" \
            "${{ matrix.target }}" "$signing" dist
          gzip -n -9 -c "dist/${{ matrix.artifact }}" \
            > "dist/${{ matrix.artifact }}.gz"
          gzip -n -9 -c "dist/${{ matrix.companion }}" \
            > "dist/${{ matrix.companion }}.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
      # Per-crate compile critical path for profiling; never a release asset.
      - name: Retain Cargo build timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-timings-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 30

  build-windows-hand:
    name: build Windows Hand installer
    needs: prepare-release
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          # A failed job (e.g. before compiling) must not store a near-empty target
          # under the exact key: rust-cache then restores it as "full match" and
          # skips saving ("Cache up-to-date"), keeping that key cold indefinitely.
          cache-on-failure: false
      - name: Build Windows Hand payload
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
          VERGEN_GIT_SHA: ${{ github.sha }}
          STABLE_GIT_COMMIT: ${{ github.sha }}
        run: |
          cargo build --locked --release --timings --package nanocodex-bin --package nanocodex-hand-daemon --features nanocodex-bin/tempo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign payload when Authenticode is configured
        shell: pwsh
        run: >-
          ./windows/hand/sign.ps1 -Path @(
            "./target/release/nanocodex.exe",
            "./target/release/nanocodex-hand.exe"
          )
      - name: Build and sign one-click installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart("v")
          ./windows/hand/build.ps1 `
            -Nanocodex ./target/release/nanocodex.exe `
            -Nanocodex2 ./target/release/nanocodex-hand.exe `
            -Version $version `
            -NumericVersion $version
          ./windows/hand/sign.ps1 -Path ./dist/windows-hand/nanocodex-hand-setup-x86_64.exe
      - name: Stage release assets
        shell: pwsh
        run: |
          Copy-Item target/release/nanocodex.exe dist/windows-hand/nanocodex-x86_64-pc-windows-msvc.exe
          Copy-Item target/release/nanocodex-hand.exe dist/windows-hand/nanocodex2-x86_64-pc-windows-msvc.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanocodex-hand-x86_64-pc-windows-msvc
          path: dist/windows-hand/*
          if-no-files-found: error
      - name: Retain Cargo build timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-timings-windows-hand
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 30

  publish-crates:
    name: publish crates.io packages
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          ./scripts/publish-crates.sh

  publish-npm:
    name: publish npm packages
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          # A failed job (e.g. before compiling) must not store a near-empty target
          # under the exact key: rust-cache then restores it as "full match" and
          # skips saving ("Cache up-to-date"), keeping that key cold indefinitely.
          cache-on-failure: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: Build the publishable package
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter nanocodex run build
          mkdir -p dist/npm
          pnpm --filter nanocodex-tools pack --pack-destination "$PWD/dist/npm"
          pnpm --filter nanocodex pack --pack-destination "$PWD/dist/npm"
          pnpm --filter nanocodex-vite pack --pack-destination "$PWD/dist/npm"
      - name: Test publishable packages
        run: |
          pnpm --filter nanocodex-tools test
          pnpm --filter nanocodex test
          pnpm --filter nanocodex-vite test

      - name: Publish immutable npm versions
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          is_published() {
            local package_name="$1"
            local version="$2"
            [[ "$(npm view "$package_name@$version" version 2>/dev/null || true)" == "$version" ]]
          }

          publish_package() {
            local package_dir="$1"
            local package_name
            local version
            package_name=$(node -p "require('./$package_dir/package.json').name")
            version=$(node -p "require('./$package_dir/package.json').version")

            if is_published "$package_name" "$version"; then
              echo "$package_name@$version is already published"
              return
            fi

            if ! npm publish "dist/npm/$package_name-$version.tgz" --access public --provenance; then
              if is_published "$package_name" "$version"; then
                echo "$package_name@$version was published despite the client error"
                return
              fi
              echo "npm publish failed and $package_name@$version is not available" >&2
              return 1
            fi

            for attempt in {1..60}; do
              if is_published "$package_name" "$version"; then
                echo "$package_name@$version is available from the registry"
                return
              fi
              echo "Waiting for $package_name@$version registry propagation (attempt $attempt/60)..."
              sleep 10
            done

            echo "$package_name@$version did not propagate within 600 seconds" >&2
            return 1
          }

          publish_package js/nanocodex-tools
          publish_package js/nanocodex
          publish_package js/nanocodex-vite

  finalize-release:
    name: attach GitHub release assets
    needs: [build, build-windows-hand, publish-crates, publish-npm]
    if: >-
      ${{ always() &&
          needs.build.result == 'success' &&
          needs.build-windows-hand.result == 'success' &&
          needs.publish-crates.result == 'success' &&
          needs.publish-npm.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      # Release assets only (the Linux, macOS and Windows nanocodex-* artifacts);
      # build telemetry artifacts are never published.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nanocodex-*
          path: dist
          merge-multiple: true
      - name: Test Hand reuse against a fake release store
        shell: bash
        run: scripts/release/test-reuse-unchanged-hand.sh
      - name: Republish an unchanged Hand
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Compare with the latest published stable release.
          previous=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ "$previous" == "$GITHUB_REF_NAME" ]]; then previous=""; fi
          scripts/release/reuse-unchanged-hand.sh dist "$previous"
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum nanocodex-* nanocodex2-* > SHA256SUMS
      - name: Upload binary assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          is_draft=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft)
          test "$is_draft" = true
          gh release upload "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
