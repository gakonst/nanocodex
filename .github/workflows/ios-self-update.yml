name: Nanocodex iPhone delivery
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Nanocodex iPhone update {0}', inputs.request_id) || github.event_name == 'push' && format('Nanocodex iPhone update {0}', github.sha) || 'Validate Nanocodex iPhone delivery' }}

on:
  push:
    branches: [master]
    paths:
      - apple/**
      - crates/nanocodex-voice-ffi/**
      - crates/nanocodex-voice-protocol/**
      - .github/workflows/ios-self-update.yml
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID emitted by Nanocodex
        required: true
        type: string
      version:
        description: Marketing version embedded in the app
        required: true
        default: 0.1.0
        type: string
      build_version:
        description: Unique integer bundle build version
        required: true
        type: string
  pull_request:
    paths:
      - apple/**
      - .github/workflows/ios-self-update.yml

permissions:
  contents: read

concurrency:
  group: ios-delivery-${{ github.event_name == 'workflow_dispatch' && inputs.request_id || github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  deliver:
    name: Build and deliver Nanocodex
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUNDLE_ID: xyz.paradigm.centaur
      UPLOAD: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Validate request
        id: request
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          VERSION: ${{ inputs.version }}
          BUILD_VERSION: ${{ inputs.build_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            REQUEST_ID=$(printf '%s' "$GITHUB_SHA" | cut -c1-24)
            VERSION=0.1.0
            BUILD_VERSION=2
          elif [ "$EVENT_NAME" = push ]; then
            REQUEST_ID=$(printf '%s' "$GITHUB_SHA" | cut -c1-24)
            VERSION=0.1.0
            BUILD_VERSION=$(date -u +%s)
          fi
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{24}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$BUILD_VERSION" =~ ^[1-9][0-9]*$ ]]
          printf 'request_id=%s\nversion=%s\nbuild_version=%s\n' "$REQUEST_ID" "$VERSION" "$BUILD_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build shared Rust voice core
        run: bash apple/NanocodexVoice/scripts/build-core.sh
      - name: Install App Store signing credentials
        if: env.UPLOAD == 'true'
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_SHARE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGETS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=0
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_SHARE_PROVISIONING_PROFILE_BASE64 IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing Actions secret: $name"; missing=1; fi
          done
          [ "$missing" -eq 0 ]
          umask 077
          signing="$RUNNER_TEMP/nanocodex-signing"
          mkdir -p "$signing"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$signing/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$signing/app.mobileprovision"
          printf '%s' "$IOS_SHARE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$signing/share.mobileprovision"
          printf '%s' "$IOS_WIDGETS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$signing/widgets.mobileprovision"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$signing/AuthKey.p8"
          for name in app share widgets; do
            security cms -D -i "$signing/$name.mobileprovision" > "$signing/$name.plist"
          done
          python3 - <<'PY'
          import datetime, os, pathlib, plistlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "nanocodex-signing"
          destination = pathlib.Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles"
          destination.mkdir(parents=True, exist_ok=True)
          bundles = {
              "app": os.environ["BUNDLE_ID"],
              "share": os.environ["BUNDLE_ID"] + ".share",
              "widgets": os.environ["BUNDLE_ID"] + ".widgets",
          }
          profiles, team = {}, None
          for name, bundle in bundles.items():
              source = root / f"{name}.mobileprovision"
              profile = plistlib.loads((root / f"{name}.plist").read_bytes())
              entitlements = profile["Entitlements"]
              prefix = profile["ApplicationIdentifierPrefix"][0]
              assert entitlements["application-identifier"] == f"{prefix}.{bundle}", f"{name} profile bundle ID mismatch"
              assert not entitlements.get("get-task-allow", False), f"{name}: use an App Store distribution profile"
              assert "ProvisionedDevices" not in profile and not profile.get("ProvisionsAllDevices"), f"{name}: use an App Store profile"
              assert profile["ExpirationDate"] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), f"{name} profile expired"
              candidate_team = profile["TeamIdentifier"][0]
              assert team in (None, candidate_team), "profiles use different Apple teams"
              team = candidate_team
              uuid = profile["UUID"]
              profiles[bundle] = uuid
              (destination / f"{uuid}.mobileprovision").write_bytes(source.read_bytes())
          options = dict(method="app-store-connect", destination="upload", signingStyle="manual",
              teamID=team, signingCertificate="Apple Distribution", provisioningProfiles=profiles,
              uploadSymbols=True, manageAppVersionAndBuildNumber=False, testFlightInternalTestingOnly=True)
          (root / "ExportOptions.plist").write_bytes(plistlib.dumps(options))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"IOS_PROFILE_UUIDS={' '.join(profiles.values())}\nIOS_TEAM_ID={team}\n")
          PY
          password=$(openssl rand -hex 24)
          keychain="$signing/build.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$signing/distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Archive device release
        env:
          VERSION: ${{ steps.request.outputs.version }}
          BUILD_VERSION: ${{ steps.request.outputs.build_version }}
        run: |
          signing=(CODE_SIGNING_ALLOWED=NO)
          if [ "$UPLOAD" = true ]; then
            signing=(CODE_SIGN_STYLE=Manual "DEVELOPMENT_TEAM=$IOS_TEAM_ID" "CODE_SIGN_IDENTITY=Apple Distribution")
          fi
          xcodebuild -project apple/NanocodexInbox.xcodeproj -scheme NanocodexInbox \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nanocodex.xcarchive" \
            "MARKETING_VERSION=$VERSION" "CURRENT_PROJECT_VERSION=$BUILD_VERSION" \
            "${signing[@]}" archive
          app="$RUNNER_TEMP/Nanocodex.xcarchive/Products/Applications/Nanocodex.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$BUILD_VERSION"
      - name: Upload internal TestFlight build
        if: env.UPLOAD == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Nanocodex.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/nanocodex-signing/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/nanocodex-export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/nanocodex-signing/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Uploaded Nanocodex ${{ steps.request.outputs.version }} (${{ steps.request.outputs.build_version }}) to internal TestFlight." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing credentials
        if: always() && env.UPLOAD == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/nanocodex-signing/build.keychain-db" 2>/dev/null || true
          for uuid in ${IOS_PROFILE_UUIDS:-}; do
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
          done
          rm -rf "$RUNNER_TEMP/nanocodex-signing"
