name: VM toolkit images
on:
  pull_request:
    paths:
      - 'crates/nanocodex-vm/image/**'
      - 'crates/experimental/nanocodex-computer/runtime/**'
      - '.github/workflows/hand-toolkit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vm-toolkit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            dockerfile: Dockerfile
          - runner: ubuntu-24.04-arm
            dockerfile: Dockerfile.gpu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build VM toolkit
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: crates/nanocodex-vm/image
          file: crates/nanocodex-vm/image/${{ matrix.dockerfile }}
          build-contexts: computer-source=crates/experimental/nanocodex-computer/runtime
          load: true
          tags: nanocodex-vm:toolkit
          cache-from: type=gha,scope=vm-toolkit-${{ matrix.runner }}-${{ matrix.dockerfile }}
          cache-to: type=gha,scope=vm-toolkit-${{ matrix.runner }}-${{ matrix.dockerfile }},mode=max,ignore-error=true,timeout=3m
      - name: Exercise offline toolkit
        run: docker run --rm --network none --entrypoint env nanocodex-vm:toolkit -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/root sh -lc nanocodex-check-hand-toolkit
      - name: Package and validate the 16 GiB ext4 template
        run: bash crates/nanocodex-vm/image/build-root.sh nanocodex-vm:toolkit "$RUNNER_TEMP/desktop.ext4"
