name: JavaScript dependency cache
description: >-
  Restore the pnpm store (and optionally the bindings examples' npm cache) from
  the default branch. Pull requests and merge-queue runs only restore; the
  master js-cache-seed workflow is the only writer.
inputs:
  npm-examples:
    description: Also restore ~/.npm for examples/privy and examples/better-auth
    default: "false"
  save:
    description: >-
      Seed mode for js-cache-seed.yml. On master (non-PR) look up the exact keys
      without downloading and save them after the job succeeds if they are absent.
    default: "false"
outputs:
  seeded:
    description: Seed mode found every requested exact key already saved
    value: ${{ steps.mode.outputs.save == 'true' && steps.pnpm-seed.outputs.cache-hit == 'true' && (inputs.npm-examples != 'true' || steps.npm-seed.outputs.cache-hit == 'true') }}
runs:
  using: composite
  steps:
    # Key and path match actions/setup-node `cache: pnpm` exactly
    # (node-cache-<os>-<arch>-pnpm-<hashFiles(pnpm-lock.yaml)>, path from
    # `pnpm store path`), so seeded entries also serve setup-node users.
    - id: mode
      shell: bash
      continue-on-error: true
      env:
        SAVE: ${{ inputs.save == 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      run: |
        case "$RUNNER_ARCH" in X64) arch=x64 ;; ARM64) arch=arm64 ;; X86) arch=ia32 ;; *) arch=arm ;; esac
        echo "save=$SAVE" >> "$GITHUB_OUTPUT"
        echo "prefix=node-cache-$RUNNER_OS-$arch-pnpm-" >> "$GITHUB_OUTPUT"
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    # A miss or cache-service error only warns; install then runs online.
    # restore-keys lets a lockfile-changing PR start from the latest master store.
    - if: steps.mode.outputs.store != '' && steps.mode.outputs.save != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.mode.outputs.store }}
        key: ${{ steps.mode.outputs.prefix }}${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ steps.mode.outputs.prefix }}
    - if: inputs.npm-examples == 'true' && steps.mode.outputs.save != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.npm
        key: npm-examples-${{ runner.os }}-${{ hashFiles('examples/privy/package-lock.json', 'examples/better-auth/package-lock.json') }}
        restore-keys: npm-examples-${{ runner.os }}-
    # Seed: exact key only, so a saved store holds just the current lockfile's
    # packages from a cold registry install. Saved only if the job succeeds.
    - id: pnpm-seed
      if: steps.mode.outputs.store != '' && steps.mode.outputs.save == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.mode.outputs.store }}
        key: ${{ steps.mode.outputs.prefix }}${{ hashFiles('pnpm-lock.yaml') }}
        lookup-only: true
    - id: npm-seed
      if: inputs.npm-examples == 'true' && steps.mode.outputs.save == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.npm
        key: npm-examples-${{ runner.os }}-${{ hashFiles('examples/privy/package-lock.json', 'examples/better-auth/package-lock.json') }}
        lookup-only: true
