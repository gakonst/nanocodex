name: Build packaged voice runtime
description: Build pinned native sources, package the helper, and verify relocation.
inputs:
  target:
    required: true
    description: Native Rust target matching the runner.
  output:
    required: true
    description: Output tar.gz archive.
runs:
  using: composite
  steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        repository: openai/codex
        ref: 1427825c4044d48b513c7d4ea32b84e58806a188
        path: .voice-upstream
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
    - name: Install native build tools
      shell: bash
      run: |
        python -m pip install packaging==25.0
        if [[ "$RUNNER_OS" == Linux ]]; then
          sudo apt-get update
          sudo apt-get install --yes cmake pkg-config libasound2-dev libpulse-dev patchelf
        else
          brew install cmake pkg-config
        fi
    - name: Build voice release archive
      shell: bash
      env:
        VOICE_TARGET: ${{ inputs.target }}
        VOICE_OUTPUT: ${{ inputs.output }}
      run: |
        python scripts/build-voice-release.py --upstream .voice-upstream \
          --target "$VOICE_TARGET" --work "$RUNNER_TEMP/voice-release" --output "$VOICE_OUTPUT"
    - name: Verify packaged helper initialization and relocation
      shell: bash
      env:
        NANOCODEX_TEST_VOICE_RUNTIME: ${{ runner.temp }}/voice-archive/nanocodex-resources/voice
        VOICE_OUTPUT: ${{ inputs.output }}
      run: |
        mkdir "$RUNNER_TEMP/voice-archive"
        tar -xzf "$VOICE_OUTPUT" -C "$RUNNER_TEMP/voice-archive"
        cargo test --locked -p nanocodex-voice-native --test packaged -- --ignored
