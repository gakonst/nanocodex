name: Retain verified WASM outputs
description: Keep exact-input WASM outputs in both the fast cache and retained artifacts
inputs:
  key:
    description: Exact output key from the wasm-outputs action
    required: true
  cache-hit:
    description: Exact Actions cache hit from the wasm-outputs action
    default: 'false'
  rejected-artifact-id:
    description: Artifact rejected by the restore action, forcing a fresh verified upload
    default: ''
runs:
  using: composite
  steps:
    - name: Verify outputs and deduplicate retained artifact
      id: prepare
      if: github.ref == 'refs/heads/master' && contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name)
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        WASM_CACHE_KEY: ${{ inputs.key }}
        WASM_REJECTED_ARTIFACT_ID: ${{ inputs.rejected-artifact-id }}
      run: node scripts/ci/wasm-artifacts.mjs prepare "$WASM_CACHE_KEY" "$WASM_REJECTED_ARTIFACT_ID"
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: steps.prepare.outputs.name != '' && inputs.cache-hit != 'true'
      continue-on-error: true
      with:
        key: ${{ inputs.key }}
        path: |
          js/nanocodex/pkg-web
          js/nanocodex/pkg-node
          .ci-wasm-cache
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: steps.prepare.outputs.upload == 'true'
      with:
        name: ${{ steps.prepare.outputs.name }}
        # The repository is the common root. Keep this separate from the
        # nanocodex-wasm artifact whose consumers expect pkg-web/pkg-node.
        path: |
          js/nanocodex/pkg-web
          js/nanocodex/pkg-node
          .ci-wasm-cache
        include-hidden-files: true
        if-no-files-found: error
        compression-level: 0
        retention-days: 90
