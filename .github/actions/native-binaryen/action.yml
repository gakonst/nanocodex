name: Native Binaryen
description: Cache the checksum-pinned native wasm-opt used by local and CI builds
runs:
  using: composite
  steps:
    - name: Restore native Binaryen
      if: runner.os == 'Linux' || runner.os == 'macOS'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/nanocodex-binaryen
        key: native-binaryen-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('js/nanocodex-vite/scripts/native-binaryen.mjs', 'js/nanocodex/package.json') }}
    - name: Resolve native wasm-opt
      if: runner.os == 'Linux' || runner.os == 'macOS'
      # A failed download only loses the speedup; the pinned npm package still builds.
      continue-on-error: true
      shell: bash
      env:
        NANOCODEX_BINARYEN_CACHE: ${{ runner.temp }}/nanocodex-binaryen
      run: |
        wasm_opt="$(node js/nanocodex-vite/scripts/native-binaryen.mjs)"
        echo "NANOCODEX_BINARYEN_CACHE=$NANOCODEX_BINARYEN_CACHE" >> "$GITHUB_ENV"
        echo "NANOCODEX_WASM_OPT=$wasm_opt" >> "$GITHUB_ENV"
