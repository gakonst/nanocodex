name: Rust cache
description: Cargo registry cache plus content-addressed compilation reuse for every Rust job.
inputs:
  workspace:
    description: Cargo workspace whose lockfile keys the registry cache
    default: "."
  cache-targets:
    description: Also archive target/ under a job-specific key (critical-path jobs only)
    default: "false"
runs:
  using: composite
  steps:
    # Archives ~/.cargo only by default; see scripts/ci/README.md.
    - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      # rust-cache always hashes every non-empty CARGO*/CC*/CFLAGS*/CXX*/CMAKE*/
      # RUST* variable into its key; env-vars only appends prefixes. CI sets
      # these profile values at workflow level, while the Cloudflare deploy and
      # preview jobs did not, so they stored a separate ~690MB cargo-home copy
      # under every lockfile hash. Pin the values set below (CARGO_INCREMENTAL
      # is forced to 0 by rust-cache itself). Matching jobs on the same runner
      # platform and toolchain then reuse the same source-cache key.
      env:
        CARGO_PROFILE_DEV_DEBUG: "0"
        CARGO_PROFILE_TEST_DEBUG: "0"
        CARGO_TERM_COLOR: always
      with:
        cache-targets: ${{ inputs.cache-targets }}
        shared-key: ${{ inputs.cache-targets == 'true' && format('target-{0}', github.job) || 'cargo-home' }}
        workspaces: ${{ inputs.workspace }}
        save-if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
        cache-on-failure: "true"
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.16.0
    - name: Enable compiler caching
      shell: bash
      env:
        # PR-local entries cannot warm master and compete for its upload quota.
        CACHE_MODE: ${{ github.ref == 'refs/heads/master' && contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_RW_MODE=$CACHE_MODE" >> "$GITHUB_ENV"
        # Incremental compilation bypasses sccache; CI caches compiler outputs.
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        # sccache hashes every CARGO_* variable into its keys. CI sets these at
        # workflow level, so set them for every Rust job: the production deploy,
        # previews and CI's wasm-build then share WASM entries. Without this the
        # deploy (96% hits) and PR WASM builds (0% hits) never matched.
        echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
        echo "CARGO_PROFILE_TEST_DEBUG=0" >> "$GITHUB_ENV"
