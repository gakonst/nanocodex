<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">The brain outlives the machine</title>
  <desc id="desc">A durable managed agent remains active for weeks while browser, sandbox, and GPU hands attach for short intervals.</desc>
  <defs>
    <filter id="paper" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="23" result="n"/><feComponentTransfer in="n" result="f"><feFuncA type="table" tableValues="0 .035"/></feComponentTransfer><feBlend in="SourceGraphic" in2="f" mode="multiply"/></filter>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34ff34"/><stop offset=".55" stop-color="#00e900"/><stop offset="1" stop-color="#caffca"/></linearGradient>
    <style>.title{font:44px Georgia,serif;fill:#080808}.label{font:28px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#111}.small{font:25px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#666}.axis{stroke:#aaa;stroke-width:3}.tick{stroke:#aaa;stroke-width:2}.hand{fill:#fff;stroke:#c9c9c6;stroke-width:2}</style>
  </defs>
  <rect width="1200" height="460" fill="#f8f8f6" filter="url(#paper)"/>
  <text x="48" y="62" class="title">The brain outlives the machine</text>
  <g transform="translate(74 112)"><rect width="1052" height="100" rx="22" fill="url(#green)" stroke="#00cf00" stroke-width="2"/><text x="30" y="43" class="label">DURABLE MANAGED AGENT</text><text x="30" y="77" class="small">context · compaction · output · recovery</text><text x="888" y="61" class="label">weeks</text></g>
  <line x1="74" y1="306" x2="1126" y2="306" class="axis"/><line x1="74" y1="292" x2="74" y2="320" class="tick"/><line x1="1126" y1="292" x2="1126" y2="320" class="tick"/>
  <g transform="translate(150 260)"><rect width="220" height="92" rx="16" class="hand"/><text x="30" y="39" class="label">Browser</text><text x="30" y="72" class="small">minutes</text></g>
  <g transform="translate(488 260)"><rect width="230" height="92" rx="16" class="hand"/><text x="30" y="39" class="label">Sandbox</text><text x="30" y="72" class="small">minutes</text></g>
  <g transform="translate(846 260)"><rect width="190" height="92" rx="16" class="hand"/><text x="30" y="39" class="label">GPU</text><text x="30" y="72" class="small">minutes</text></g>
  <text x="48" y="414" class="small">Keep the agent alive. Pay for expensive hands only while they execute.</text>
</svg>
