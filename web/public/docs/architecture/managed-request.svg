<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1240" viewBox="0 0 900 1240" role="img" aria-labelledby="title desc">
  <title id="title">The Nanocodex product stack</title>
  <desc id="desc">Five stacked layers show Embed above Connect, Managed Agents, execution Hands, and Open Durability. Products own the interface, user connections remain portable, expensive execution attaches only when needed, and runnable state can move between hosts.</desc>
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="12" result="noise"/>
      <feComponentTransfer in="noise" result="faint"><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <linearGradient id="greenSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dfffe0"/>
      <stop offset=".55" stop-color="#a0ffa2"/>
      <stop offset="1" stop-color="#f2fff2"/>
    </linearGradient>
    <linearGradient id="greenStrong" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34ff34"/>
      <stop offset=".52" stop-color="#00e900"/>
      <stop offset="1" stop-color="#caffca"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#a9a9a6" stroke-width="2"/>
    </marker>
    <style>
      .title{font:52px Georgia,serif;fill:#050505;letter-spacing:-1.5px}
      .repo{font:24px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#111}
      .eyebrow{font:15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#626262;letter-spacing:1.7px}
      .heading{font:30px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#080808}
      .body{font:20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#4f4f4f}
      .small{font:17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#626262}
      .panel{fill:#fff;stroke:#c9c9c6;stroke-width:2}
      .line{fill:none;stroke:#a9a9a6;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="900" height="1240" fill="#f8f8f6" filter="url(#paper)"/>
  <text x="54" y="78" class="title">The Nanocodex stack</text>
  <g transform="translate(662 42)">
    <circle cx="24" cy="24" r="24" fill="#d9ffd9"/>
    <path d="M15 14l20 10-20 10z" fill="#00e900"/>
    <text x="60" y="32" class="repo">nanocodex</text>
  </g>

  <g transform="translate(60 130)">
    <rect width="780" height="166" rx="22" class="panel"/>
    <text x="32" y="35" class="eyebrow">PRODUCT LAYER</text>
    <text x="32" y="76" class="heading">Embed</text>
    <text x="32" y="113" class="body">web · React · Slack · mobile · API</text>
    <text x="32" y="143" class="small">The product owns the interface and policy.</text>
  </g>

  <path d="M450 296v28" class="line"/>

  <g transform="translate(60 334)">
    <rect width="780" height="166" rx="22" fill="url(#greenSoft)" stroke="#9bd99b" stroke-width="2"/>
    <text x="32" y="35" class="eyebrow">ACCOUNT + AUTHORIZATION</text>
    <text x="32" y="76" class="heading">Connect</text>
    <text x="32" y="113" class="body">ChatGPT · OAuth · wallet · private machines</text>
    <text x="32" y="143" class="small">Connections follow the user. Each product gets a scoped grant.</text>
  </g>

  <path d="M450 500v28" class="line"/>

  <g transform="translate(60 538)">
    <rect width="780" height="166" rx="22" fill="url(#greenStrong)" stroke="#00d500" stroke-width="2"/>
    <text x="32" y="35" class="eyebrow">DURABLE BRAIN</text>
    <text x="32" y="76" class="heading">Managed Agents</text>
    <text x="32" y="113" class="body">Codex context · long-running work · ordered output</text>
    <text x="32" y="143" class="small">Clients attach and detach without owning the work.</text>
  </g>

  <path d="M450 704v28" class="line"/>

  <g transform="translate(60 742)">
    <rect width="780" height="166" rx="22" class="panel"/>
    <text x="32" y="35" class="eyebrow">EXECUTION</text>
    <text x="32" y="76" class="heading">Hands</text>
    <text x="32" y="113" class="body">tools · WebMCP · APIs · sandboxes · GPUs</text>
    <text x="32" y="143" class="small">Mercator routes · MPP pays · Tempo settles.</text>
  </g>

  <path d="M450 908v28" class="line"/>

  <g transform="translate(60 946)">
    <rect width="780" height="166" rx="22" fill="url(#greenSoft)" stroke="#9bd99b" stroke-width="2"/>
    <text x="32" y="35" class="eyebrow">RUNNABLE STATE</text>
    <text x="32" y="76" class="heading">Open Durability</text>
    <text x="32" y="113" class="body">Paradigm · Postgres · Cloudflare · Vercel · your cloud</text>
    <text x="32" y="143" class="small">Export the agent, not only its transcript.</text>
  </g>

  <text x="60" y="1182" class="body">Embedded · connected · cheap while idle · portable</text>
</svg>
