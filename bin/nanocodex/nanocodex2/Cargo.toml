[package]
name = "nanocodex2-bin"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Small managed-agent client with local workspace tools"

[dependencies]
clap.workspace = true
crossterm.workspace = true
dotenvy.workspace = true
nanocodex-agent = { path = "../../../crates/nanocodex-agent", version = "0.5.0", default-features = false }
nanocodex-managed = { path = "../../../crates/nanocodex-managed", version = "0.5.0", default-features = false, features = ["tools"] }
nanocodex-tools = { path = "../../../crates/nanocodex-tools", version = "0.5.0", default-features = false, features = ["attachment", "workspace-runtime"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
unicode-width.workspace = true

[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
fs2.workspace = true
nanocodex-vm.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
futures-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "net", "process"] }

[[bin]]
name = "nanocodex2"
path = "../src/nanocodex2/main.rs"
doc = false

[[test]]
name = "nanocodex2_managed"
path = "../tests/nanocodex2_managed.rs"

[lints]
workspace = true
