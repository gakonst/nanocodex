[package]
name = "nanocodex2-bin"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Small managed-agent client with local workspace tools"

[dependencies]
arboard.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
dark-light = "3.0.0"
dotenvy.workspace = true
futures-util.workspace = true
image.workspace = true
nanocodex = { path = "../../../crates/nanocodex", version = "0.5.0", default-features = false }
nanocodex-agent = { path = "../../../crates/nanocodex-agent", version = "0.5.0", default-features = false }
nanocodex-browser.workspace = true
nanocodex-managed = { path = "../../../crates/nanocodex-managed", version = "0.5.0", default-features = false, features = ["tools"] }
nanocodex-observability = { workspace = true, features = ["cli"] }
nanocodex-tools = { path = "../../../crates/nanocodex-tools", version = "0.5.0", default-features = false, features = ["attachment", "workspace-runtime"] }
png = "0.18.1"
percent-encoding.workspace = true
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.0"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
syntect.workspace = true
nanocodex-subagents = { path = "../../../crates/nanocodex-subagents", version = "0.5.0" }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true
uuid.workspace = true
whoami.workspace = true

[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
fs2.workspace = true
nanocodex-vm.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
criterion.workspace = true
futures-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "net", "process"] }

[[bench]]
name = "nanocodex2_tui"
path = "../src/nanocodex2/tui/bench.rs"
harness = false

[[bin]]
name = "nanocodex2"
path = "../src/nanocodex2/main.rs"
doc = false

[[test]]
name = "nanocodex2_managed"
path = "../tests/nanocodex2_managed.rs"

[lints]
workspace = true
