[package]
name = "nanocodex-bin"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
# The managed tree is Apache-2.0 (Tact-derived); the merged package uses it.
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Nanocodex CLI: managed client and Hand (nanocodex, nc) plus the local agent (ncl)"
build = "build.rs"

[package.metadata.cargo-machete]
# cargo-machete does not resolve imports from the package build script.
ignored = ["chrono", "sha2", "toml", "vergen"]

[features]
default = []
# Keep paid-provider composition out of the direct-agent development graph.
tempo = [
    "dep:mpp",
    "dep:nanocodex-egress",
    "dep:nanousd",
]
# Criterion cases over the production shared TUI renderer (benches/nanocodex2_tui.rs).
tui-bench = ["dep:criterion"]

[dependencies]
aes-gcm = "0.10.3"
anyhow.workspace = true
criterion = { workspace = true, optional = true }
dark-light = "3.0.0"
nanocodex-agent = { path = "../../crates/nanocodex-agent", version = "0.6.7", default-features = false }
nanocodex-hand = { path = "../../crates/nanocodex-hand", version = "0.6.7" }
nanocodex-managed = { path = "../../crates/nanocodex-managed", version = "0.6.7", default-features = false, features = ["tools", "voice"] }
nanocodex-oai-tools = { workspace = true, features = ["attachment", "workspace-runtime", "mcp"] }
nanocodex-remote = { path = "../../crates/nanocodex-remote", version = "0.6.7" }
nanocodex-voice-native.workspace = true
nanocodex-voice-protocol.workspace = true
opusic-c.workspace = true
png = "0.18.1"
rayon = "1.12.0"
rustls.workspace = true
tokio-util.workspace = true
url.workspace = true
webrtc.workspace = true
whoami.workspace = true
zeroize = "1.8.2"
nanocodex-tui-control = { path = "tui-control", version = "0.6.7" }
nanocodex-screen-supervisor = { path = "screen-supervisor", version = "0.6.7" }
nanocodex-computer.workspace = true
arboard.workspace = true
async-trait.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
clap.workspace = true
chrono.workspace = true
chrono-tz = "0.10.4"
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
dotenvy.workspace = true
eyre.workspace = true
flate2.workspace = true
fs2.workspace = true
futures-util.workspace = true
hex.workspace = true
image.workspace = true
indicatif.workspace = true
percent-encoding.workspace = true
jsonschema.workspace = true
nanocodex = { workspace = true, features = ["claude-tools", "workspace-tools"] }
nanocodex-cli-auth.workspace = true
nanocodex-durability = { workspace = true, features = ["sqlite"] }
nanocodex-browser.workspace = true
nanocodex-observability = { workspace = true, features = ["cli"] }
nanocodex-subagents = { workspace = true, features = ["claude"] }
nanocodex-home.workspace = true
nanocodex-voice.workspace = true
nix = { workspace = true, features = ["fs"] }
nanousd = { workspace = true, optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false }
mpp = { workspace = true, optional = true, features = ["middleware", "sqlite", "tempo", "reqwest-rustls-tls-no-provider"] }
nanocodex-egress = { workspace = true, optional = true }
rand.workspace = true
regex.workspace = true
# Use the widget's own wrapped line count to clamp preview scrolling.
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
# ratatex exposes ratatui 0.29 buffers; adapt those into the shared 0.30 renderer.
ratatex_ratatui = { package = "ratatui", version = "0.29.0", default-features = false }
ratatex.workspace = true
reqwest = { workspace = true, features = ["blocking", "multipart", "query", "stream"] }
rusqlite.workspace = true
self-replace.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
syntect.workspace = true
sysinfo.workspace = true
two-face.workspace = true
sha2.workspace = true
shlex.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
tar.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tempo-alloy.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
yansi.workspace = true
uuid.workspace = true

[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
arcbox-ext4.workspace = true
ignore.workspace = true
nanocodex-eval.workspace = true
nanocodex-eval-adapters.workspace = true
nanocodex-vm.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.24.0"
nanocodex-vm = { workspace = true, features = ["desktop"] }

[build-dependencies]
chrono.workspace = true
sha2.workspace = true
toml.workspace = true
vergen = { workspace = true, features = ["build", "git", "gitcl"] }

[dev-dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
axum = { workspace = true, features = ["ws"] }
hkdf = "0.12.4"
nanocodex-oai-tools = { workspace = true, features = ["native"] }
p256 = { version = "0.13.2", features = ["ecdh"] }
portable-pty.workspace = true
sha2-hkdf = { package = "sha2", version = "0.10.9" }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "net", "process"] }
vt100.workspace = true

[[bench]]
name = "nanocodex2_tui"
harness = false
required-features = ["tui-bench"]

[[test]]
name = "tui_split"
path = "tests/tui_split.rs"

[[test]]
name = "managed_memory"
path = "tests/managed_memory.rs"

[[test]]
name = "login"
path = "tests/login.rs"

[[test]]
name = "account_auth"
path = "tests/account_auth.rs"

[[test]]
name = "durable_run"
path = "tests/durable_run.rs"

[[test]]
name = "harness_routing"
path = "tests/harness_routing.rs"

[[test]]
name = "local_managed_server"
path = "tests/local_managed_server.rs"

[[test]]
name = "tui_control"
path = "tests/tui_control.rs"

[[test]]
name = "code_mode_teardown"
path = "tests/code_mode_teardown.rs"

# One crate, two executables split by role: the user-facing CLI and the Hand
# daemon (installed under the historical file name nanocodex2).
[lib]
name = "nanocodex_cli"
path = "src/lib.rs"
doc = false

[[bin]]
name = "nanocodex"
path = "src/main.rs"
doc = false
test = false

[[bin]]
name = "nanocodex-hand"
path = "src/hand_main.rs"
doc = false
test = false

# The installed entrypoint initializes its environment before
# starting any threads. Keep that one unsafe boundary locally auditable while
# retaining every other workspace lint (Cargo cannot override inherited lints).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
redundant-clone = "warn"
large-enum-variant = "allow"
result-large-err = "allow"

