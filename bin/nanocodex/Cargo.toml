[package]
name = "nanocodex-bin"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Daily-driver TUI and headless JSONL adapter for Nanocodex"
build = "build.rs"

[package.metadata.cargo-machete]
# cargo-machete does not resolve imports from the package build script.
ignored = ["chrono", "vergen"]

[features]
default = []
# Keep paid-provider composition out of the direct-agent development graph.
tempo = [
    "dep:mpp",
    "dep:nanocodex-egress",
    "dep:nanousd",
]

[dependencies]
aes-gcm = "0.10.3"
nanocodex-tui-control = { path = "tui-control", version = "0.6.7" }
nanocodex-computer.workspace = true
arboard.workspace = true
async-trait.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
clap.workspace = true
chrono.workspace = true
chrono-tz = "0.10.4"
crossterm.workspace = true
dotenvy.workspace = true
eyre.workspace = true
flate2.workspace = true
fs2.workspace = true
futures-util.workspace = true
hex.workspace = true
image.workspace = true
indicatif.workspace = true
percent-encoding.workspace = true
jsonschema.workspace = true
nanocodex = { workspace = true, features = ["claude-tools", "workspace-tools"] }
nanocodex-cli-auth.workspace = true
nanocodex-durability = { workspace = true, features = ["sqlite"] }
nanocodex-browser.workspace = true
nanocodex-observability = { workspace = true, features = ["cli"] }
nanocodex-subagents.workspace = true
nanocodex-voice.workspace = true
nix = { workspace = true, features = ["fs"] }
nanousd = { workspace = true, optional = true }
pulldown-cmark.workspace = true
mpp = { workspace = true, optional = true, features = ["middleware", "sqlite", "tempo", "reqwest-rustls-tls-no-provider"] }
nanocodex-egress = { workspace = true, optional = true }
rand.workspace = true
regex.workspace = true
ratatui.workspace = true
ratatex.workspace = true
reqwest = { workspace = true, features = ["blocking", "stream"] }
rusqlite.workspace = true
self-replace.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
syntect.workspace = true
sysinfo.workspace = true
two-face.workspace = true
sha2.workspace = true
shlex.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
tar.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tempo-alloy.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
yansi.workspace = true
uuid.workspace = true

[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
arcbox-ext4.workspace = true
ignore.workspace = true
nanocodex-eval.workspace = true
nanocodex-eval-adapters.workspace = true
nanocodex-vm.workspace = true

[build-dependencies]
chrono.workspace = true
vergen = { workspace = true, features = ["build", "git", "gitcl"] }

[dev-dependencies]
criterion.workspace = true
nanocodex-oai-tools = { workspace = true, features = ["native"] }
portable-pty.workspace = true

[[bench]]
name = "tui_render"
harness = false

[[test]]
name = "tui_split"
path = "tests/tui_split.rs"

[[test]]
name = "managed_memory"
path = "tests/managed_memory.rs"

[[test]]
name = "login"
path = "tests/login.rs"

[[test]]
name = "account_auth"
path = "tests/account_auth.rs"

[[test]]
name = "durable_run"
path = "tests/durable_run.rs"

[[test]]
name = "harness_routing"
path = "tests/harness_routing.rs"

[[test]]
name = "local_managed_server"
path = "tests/local_managed_server.rs"

[[test]]
name = "tui_control"
path = "tests/tui_control.rs"

[[bin]]
name = "nanocodex"
path = "src/main.rs"
doc = false

# Like nanocodex2, the installed entrypoint initializes its environment before
# starting any threads. Keep that one unsafe boundary locally auditable while
# retaining every other workspace lint (Cargo cannot override inherited lints).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
redundant-clone = "warn"
large-enum-variant = "allow"
result-large-err = "allow"

[[test]]
name = "claude_host"
path = "tests/claude_host.rs"

[[test]]
name = "claude_hooks"
path = "tests/claude_hooks.rs"

[[test]]
name = "claude_web"
path = "tests/claude_web.rs"

[[test]]
name = "claude_skills"
path = "tests/claude_skills.rs"

[[test]]
name = "claude_mcp"
path = "tests/claude_mcp.rs"

[[test]]
name = "claude_checkpoints"
path = "tests/claude_checkpoints.rs"

[[test]]
name = "claude_prompt_images"
path = "tests/claude_prompt_images.rs"

[[test]]
name = "claude_interaction"
path = "tests/claude_interaction.rs"

[[test]]
name = "claude_resume"
path = "tests/claude_resume.rs"

[[test]]
name = "claude_permissions"
path = "tests/claude_permissions.rs"

[[test]]
name = "claude_fork"
path = "tests/claude_fork.rs"

[[test]]
name = "claude_scheduler_monitor"
path = "tests/claude_scheduler_monitor.rs"

[[test]]
name = "claude_cross_workspace"
path = "tests/claude_cross_workspace.rs"

[[test]]
name = "claude_workflow"
path = "tests/claude_workflow.rs"

[[test]]
name = "codex_resume_picker"
path = "tests/codex_resume_picker.rs"

[[test]]
name = "codex_resume_from"
path = "tests/codex_resume_from.rs"

[[test]]
name = "tui_log_location"
path = "tests/tui_log_location.rs"
