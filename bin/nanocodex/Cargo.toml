[package]
name = "nanocodex-bin"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Daily-driver TUI and headless JSONL adapter for Nanocodex"
build = "build.rs"

[package.metadata.cargo-machete]
# cargo-machete does not resolve imports from the package build script.
ignored = ["chrono", "vergen"]

[features]
default = []
# Keep paid-provider composition out of the direct-agent development graph.
tempo = [
    "dep:mpp",
    "dep:nanocodex-egress",
    "dep:nanousd",
]

[dependencies]
arboard.workspace = true
async-trait.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
dotenvy.workspace = true
eyre.workspace = true
flate2.workspace = true
fs2.workspace = true
futures-util.workspace = true
hex.workspace = true
image.workspace = true
indicatif.workspace = true
jsonschema.workspace = true
nanocodex.workspace = true
nanocodex-browser.workspace = true
nanocodex-observability.workspace = true
nanocodex-subagents.workspace = true
nanocodex-voice.workspace = true
nix = { workspace = true, features = ["fs"] }
nanousd = { workspace = true, optional = true }
pulldown-cmark.workspace = true
mpp = { workspace = true, optional = true, features = ["middleware", "sqlite", "tempo", "reqwest-rustls-tls-no-provider"] }
nanocodex-egress = { workspace = true, optional = true }
rand.workspace = true
ratatui.workspace = true
ratatex.workspace = true
reqwest = { workspace = true, features = ["blocking", "stream"] }
self-replace.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
syntect.workspace = true
two-face.workspace = true
sha2.workspace = true
shlex.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tempo-alloy.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
yansi.workspace = true

[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
arcbox-ext4.workspace = true
chrono.workspace = true
ignore.workspace = true
nanocodex-eval.workspace = true
nanocodex-eval-adapters.workspace = true
nanocodex-vm.workspace = true
regex.workspace = true
sysinfo.workspace = true
uuid.workspace = true

[build-dependencies]
chrono.workspace = true
vergen = { workspace = true, features = ["build", "git", "gitcl"] }

[dev-dependencies]
criterion.workspace = true
nanocodex-tools.workspace = true
tokio-tungstenite.workspace = true

[[bench]]
name = "tui_render"
harness = false

[[test]]
name = "tui_split"
path = "tests/tui_split.rs"

[[test]]
name = "managed_memory"
path = "tests/managed_memory.rs"

[[test]]
name = "login"
path = "tests/login.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"

[[bin]]
name = "nanocodex"
path = "src/main.rs"
doc = false

[lints]
workspace = true
