# Inputs of the standalone Hand identity (see build_hand_identity.rs).
#
# Every file of every path package in nanocodex-bin's Cargo.lock closure is
# hashed by workspace-relative path and content. The set is conservative:
# shared command definitions and dependencies remain inputs even when a
# particular target does not link them. The shared terminal UI below is
# reached only by CLI entrypoints; the daemon dispatch never invokes it.
# Unlisted files are always included, so a new file can only change the
# identity. Paths are workspace-relative; directories match recursively.
exclude = [
    # The CLI executable root; nanocodex-hand is built from src/hand_main.rs.
    "bin/nanocodex/src/main.rs",
    "bin/nanocodex/src/nanocodex2/tui",
    # Integration tests, benchmarks and documentation are not compiled into
    # either executable.
    "bin/nanocodex/tests",
    "bin/nanocodex/benches",
    "bin/nanocodex/README.md",
]

# Workspace files outside the closure's package directories that change the
# Hand: workspace manifest (profiles, features, versions), Cargo config
# (linkers, rustflags), signing entitlements, payload verifier and helper
# sources compiled by build.rs, and the cross linker wrappers.
inputs = [
    "Cargo.toml",
    ".cargo/config.toml",
    "nanocodex-vm.entitlements",
    "scripts/tests/linux-screen-helpers-bundle.py",
    "macos/HandMenuBar",
    "scripts/aarch64-unknown-linux-musl-linker",
    "scripts/aarch64-unknown-linux-musl-ar",
]

# Hashed when present.
optional_inputs = [
    "rust-toolchain.toml",
    "rust-toolchain",
]
