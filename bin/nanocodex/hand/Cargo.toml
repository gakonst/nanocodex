[package]
name = "nanocodex-hand-daemon"
description = "Nanocodex Hand daemon executable (nanocodex-hand): native, screen, VM and Docker Hands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
publish = false

# The Hand executable has its own package so that CLI and terminal UI edits
# (nanocodex-bin) never recompile or relink it, and Hand edits never
# recompile the CLI. Both share only nanocodex-bin-shared.
[lib]
name = "nanocodex_hand_daemon"
path = "src/lib.rs"
doc = false

[[bin]]
name = "nanocodex-hand"
path = "src/main.rs"
doc = false
test = false

[features]
# Embed the Linux Wayland screen helpers named by NANOCODEX_LINUX_SCREEN_BUNDLE
# (built by scripts/build-linux-screen-helpers.sh). Distributable Linux Hands
# enable it; without it the Hand reports the missing payload at runtime.
embedded-screen-helpers = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
clap.workspace = true
dotenvy.workspace = true
flate2.workspace = true
fs2.workspace = true
futures-util.workspace = true
hex.workspace = true
image.workspace = true
nanocodex.workspace = true
nanocodex-bin-shared.workspace = true
nanocodex-cli-auth.workspace = true
nanocodex-computer.workspace = true
nanocodex-hand = { path = "../../../crates/nanocodex-hand", version = "0.6.7" }
nanocodex-managed = { path = "../../../crates/nanocodex-managed", version = "0.6.7", default-features = false, features = ["tools"] }
nanocodex-oai-tools = { workspace = true, features = ["attachment", "workspace-runtime", "mcp"] }
nanocodex-remote = { path = "../../../crates/nanocodex-remote", version = "0.6.7" }
nanocodex-screen-supervisor = { path = "../screen-supervisor", version = "0.6.7" }
nix = { workspace = true, features = ["fs"] }
png = "0.18.1"
reqwest = { workspace = true, features = ["blocking", "multipart", "query", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex.workspace = true
sysinfo.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
webrtc.workspace = true
whoami.workspace = true

[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
nanocodex-vm.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.24.0"
nanocodex-vm = { workspace = true, features = ["desktop"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "net", "process"] }

# The Hand entrypoints initialize their environment before starting any
# threads. Keep that unsafe boundary locally auditable while retaining every
# other workspace lint (Cargo cannot override inherited lints).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
redundant-clone = "warn"
large-enum-variant = "allow"
result-large-err = "allow"
