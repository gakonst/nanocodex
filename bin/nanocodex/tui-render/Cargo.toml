[package]
name = "nanocodex-tui-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
# Tact-derived presentation code; see NOTICE.md.
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Pure transcript rendering for the Nanocodex terminal UI: markdown, code highlighting, diffs, images and math"

# Kept free of CLI, Hand and session dependencies (and of build scripts) so the
# compiled renderer stays cached across edits to the rest of nanocodex-bin.
[dependencies]
crossterm = "0.29.0"
image.workspace = true
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatex.workspace = true
# ratatex exposes ratatui 0.29 buffers; adapt those into the shared 0.30 renderer.
ratatex_ratatui = { package = "ratatui", version = "0.29.0", default-features = false }
ratatui = "0.30.0"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
serde.workspace = true
serde_json.workspace = true
syntect.workspace = true
tokio = { workspace = true, features = ["process", "sync", "time"] }
tracing.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true

[dev-dependencies]
png = "0.18.1"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
