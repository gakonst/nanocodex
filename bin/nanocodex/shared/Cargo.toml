[package]
name = "nanocodex-bin-shared"
description = "Code shared by the nanocodex CLI and nanocodex-hand executables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

# The CLI (nanocodex-bin) and the Hand (nanocodex-hand-daemon) both depend on
# this small crate and never on each other, so an edit to one executable's
# implementation never recompiles the other.
[dependencies]
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
chrono.workspace = true
clap.workspace = true
# Executable capability markers are found in 100+ MB binaries on every update.
memchr = "2.8.3"
nanocodex = { workspace = true }
nanocodex-cli-auth.workspace = true
nanocodex-computer.workspace = true
nanocodex-managed = { path = "../../../crates/nanocodex-managed", version = "0.6.7", default-features = false, features = ["tools"] }
nanocodex-oai-tools = { workspace = true, features = ["attachment"] }
nanocodex-observability = { workspace = true, features = ["cli"] }
nanocodex-remote = { path = "../../../crates/nanocodex-remote", version = "0.6.7" }
nix = { workspace = true, features = ["fs"] }
reqwest = { workspace = true }
# Hand device identity keys (Ed25519 PKCS#8).
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zeroize = "1.8.2"

# The launcher and executable-role entrypoints set process environment before
# any thread starts. Keep that unsafe boundary locally auditable while
# retaining every other workspace lint (Cargo cannot override inherited lints).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
redundant-clone = "warn"
large-enum-variant = "allow"
result-large-err = "allow"

[dev-dependencies]
rustls.workspace = true
