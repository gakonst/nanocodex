[package]
name = "nanocodex-webrtc-voice-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nanocodex-voice-host"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
codex-process-hardening.workspace = true
codex-realtime-webrtc.workspace = true
libwebrtc = "=0.3.48"
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync"] }

[build-dependencies]
webrtc-sys-build = "=0.3.19"

[dev-dependencies]
futures.workspace = true
cpal = "=0.18.2"
