packages:
  - "js/*"
  - "examples/node"
  - "examples/react-vite"

overrides:
  # Pending DO I/O eviction protection requires an October 2026 runtime.
  workerd: "1.20261002.1"
  "@microsoft/dev-tunnels-ssh": "3.12.40"

allowBuilds:
  "@mongodb-js/zstd": true
  "@whiskeysockets/baileys": false
  core-js-pure: false
  esbuild: true
  node-liblzma: false
  protobufjs: false
  workerd: true

minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.72"
  - "@ai-sdk/provider-utils@5.0.36"
  - "ai@7.0.90"

patchedDependencies:
  '@cloudflare/sandbox@0.12.4': patches/@cloudflare__sandbox@0.12.4.patch
  accounts@0.17.0: patches/accounts@0.17.0.patch
