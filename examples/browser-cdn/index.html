<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanocodex CDN PoC</title>
    <style>
      body { max-width: 48rem; margin: 4rem auto; padding: 0 1rem; font: 16px/1.5 system-ui; }
      textarea, output { box-sizing: border-box; display: block; width: 100%; padding: .75rem; }
      output { min-height: 8rem; margin-top: 1rem; white-space: pre-wrap; background: #f4f4f4; }
      button { margin-top: .75rem; padding: .6rem 1rem; }
    </style>
  </head>
  <body>
    <h1>Nanocodex, no build step</h1>
    <form id="prompt-form">
      <textarea id="prompt" rows="5">Reply with the name of your runtime and nothing else.</textarea>
      <button>Run agent</button>
    </form>
    <output id="result">Ready.</output>

    <script type="module">
      import { Agent, Transport } from "https://cdn.jsdelivr.net/npm/nanocodex@0.5.0/host/index.mjs";

      const form = document.querySelector("#prompt-form");
      const prompt = document.querySelector("#prompt");
      const result = document.querySelector("#result");
      let agent;
      let agentPromise;
      let closing = false;
      const releasedAgents = new WeakSet();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const input = prompt.value;
        try {
          const current = await getAgent();
          const turn = current.turn.prompt({ input });
          let completed;
          try {
            completed = await turn.result();
            result.textContent = completed.finalMessage;
          } finally {
            try {
              completed?.dispose();
            } finally {
              turn.dispose();
            }
          }
        } catch (error) {
          result.textContent = error instanceof Error ? error.message : String(error);
        }
      });

      addEventListener("pagehide", () => {
        closing = true;
        const pending = agentPromise;
        const current = agent;
        agent = undefined;
        agentPromise = undefined;
        if (current) void releaseAgent(current);
        else if (pending) void pending.then(releaseAgent, () => {});
      }, { once: true });

      async function getAgent() {
        if (closing) throw new Error("The page is closing.");
        if (agent) return agent;
        if (!agentPromise) {
          const pending = Promise.resolve()
            .then(() => Agent.create({
              transport: Transport.hostManaged({
                websocketUrl: websocketEndpoint(),
                createWebSocket(endpoint, sessionId) {
                  const url = new URL(endpoint);
                  url.searchParams.set("session_id", sessionId);
                  return new WebSocket(url);
                },
              }),
            }))
            .then(async (created) => {
              if (closing) {
                await releaseAgent(created);
                throw new Error("The page closed while the agent was starting.");
              }
              agent = created;
              return created;
            });
          agentPromise = pending;
          void pending.then(
            () => {},
            () => {
              if (agentPromise === pending) agentPromise = undefined;
            },
          );
        }
        return agentPromise;
      }

      async function releaseAgent(current) {
        if (releasedAgents.has(current)) return;
        releasedAgents.add(current);
        try {
          if (typeof current.session?.shutdown === "function") {
            await current.session.shutdown();
          } else {
            current.dispose();
          }
        } catch (error) {
          // `pagehide` cannot reliably await asynchronous cleanup. Shutdown
          // already releases the Nanocodex handle; dispose is the safe fallback
          // for another runtime implementation.
          reportCleanupError(error);
          current.dispose();
        }
      }

      function reportCleanupError(error) {
        try {
          if (typeof globalThis.reportError === "function") {
            globalThis.reportError(error);
          } else {
            console.error("Nanocodex agent shutdown failed:", error);
          }
        } catch {
          // Reporting must not prevent the idempotent cleanup fallback.
        }
      }

      function websocketEndpoint() {
        const override = new URL(location.href).searchParams.get("endpoint");
        if (override) return override;
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        return `${protocol}//${location.host}/api/responses`;
      }
    </script>
  </body>
</html>
