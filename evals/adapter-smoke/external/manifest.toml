schema_version = "1"
name = "external-smoke"

[source]
kind = "nanocodex-adapter-smoke"
revision = "nanocodex@adapter-smoke-v1"

[[case]]
id = "exact-answer"
prompt = "Reply with exactly: NANOCODEX_ADAPTER_SMOKE_OK"
output = "final_message"
oci_image = "debian:bookworm-slim"
harness = "harness"
allow_internet = true
agent_timeout_sec = 120
verifier_timeout_sec = 30

[case.resources]
cpus = 1
memory_mb = 1024
storage_mb = 1024
gpus = 0
