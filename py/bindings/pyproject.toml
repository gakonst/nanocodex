[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "nanocodex"
dynamic = ["version"]
description = "Embedded Python bindings for the Nanocodex agents SDK"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Nanocodex Contributors" }]
keywords = ["agents", "openai", "sdk", "websocket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/gakonst/nanocodex"
Repository = "https://github.com/gakonst/nanocodex"

[tool.maturin]
module-name = "nanocodex._native"
python-source = "python"
features = ["pyo3/extension-module"]
exclude = ["python/**/__pycache__", "python/**/*.py[cod]"]
