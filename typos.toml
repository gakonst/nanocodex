[files]
extend-exclude = [
    ".nanocodex/",
    # Imported binary game art and fonts are not prose.
    "examples/wow/web/assets/wow/**/*.PNG",
    "examples/wow/web/assets/wow/**/*.TTF",
    "crates/nanocodex-browser/assets/axe.js",
    "crates/nanocodex-browser/assets/react_diagnostics.js",
    # Preserve upstream sources and captured protocol/encoding fixture bytes.
    "crates/experimental/nanocodex-computer/runtime/vendor/",
    "crates/experimental/nanocodex-computer/runtime/tests/oracles/",
    "crates/experimental/nanocodex-computer/runtime/src/runtime_icu_data/",
    "js/account/public/data/",
    "js/account/src/data/harness-repository.json",
    "js/account/worker-configuration.d.ts",
]

# Xcode object identifiers are hexadecimal, not prose.
[type.pbxproj]
extend-glob = ["*.pbxproj"]
extend-ignore-re = ['\b[0-9A-F]{24}\b']

# Provider request/session IDs and Cloudflare ray IDs are opaque hexadecimal values.
# Generated workload record codes are opaque base-36/hexadecimal values.
# Tool call IDs are provider-generated opaque values, including nested call suffixes.
# Keep spelling enabled for prose and model output in the benchmark JSON.
[type.json]
# Preserve exact WebRTC statistics fields and browser-generated RTP IDs.
extend-ignore-re = ['\bpackets(?:Received|Sent)WithEct1\b', '\bOT[0-9]+A[0-9]+\b', '\b(?:req|resp|sess|msg)_[0-9a-f]+\b', '\b[0-9a-f]{16}-[A-Z]{3}\b', '\b[0-9a-f]{5}-[0-9a-z]{4}\b', '"call_id"\s*:\s*"call_[A-Za-z0-9_-]+(?:/code-[0-9]+)?"']

# Match both 'truncated' and 'truncation' in retained measurement helpers.
[type.py]
extend-ignore-re = ["'truncat'"]

# Symphonia exposes this exact time-base numerator field.
[type.rust]
extend-ignore-re = ['\btime_base\.numer\b']

[default]
# Exact executable name used by the remote-screen hand.
# Chromium's Page.createIsolatedWorld parameter has this exact wire spelling.
# Preserve the exact Apple installation URL schemes.
extend-ignore-re = ['\bwaymote-streamd\b', '\bgrantUniveralAccess\b', '\bitms-beta://', '\bitms-services\b', '\bDuPont\b']

[default.extend-words]
# Mesa's OpenGL-over-Vulkan driver.
zink = "zink"
Zink = "Zink"
# The Rust and Swift voice transcript parsers recognize this legacy XML tag.
soruce = "soruce"
ratatui = "ratatui"
serde = "serde"
wasm = "wasm"
ba = "ba"
# Apple and Appium use UDID as the canonical device identifier name.
udid = "udid"
Udid = "Udid"
# `CMO` abbreviates the differential evaluator's code-mode-only profile.
CMO = "CMO"
# `caf` is the hexadecimal middle of the reviewed Codex commit
# `312caf176a8f`, not prose.
caf = "caf"
# These are hexadecimal fragments in the reviewed commits `0c01a18ede`
# and `ded4eacdbd`.
ede = "ede"
ded = "ded"
# These are hexadecimal fragments in reviewed Codex commit hashes, not prose.
daed = "daed"
abd = "abd"
dbe = "dbe"
daa = "daa"
# `iz` appears inside the exact retained benchmark flag
# `flag{gc0d3_iz_ch4LLenGiNg}`.
iz = "iz"

# This audit quotes the original font's multilingual name table.
[type.wow-asset-metadata]
extend-glob = ["visual-assets.md"]
extend-ignore-re = ['\bNormale\b']
