[files]
extend-exclude = [
    ".nanocodex/",
    "crates/experimental/nanocodex-browser/assets/axe.js",
    "crates/experimental/nanocodex-browser/assets/react_diagnostics.js",
    "web/public/data/",
    "web/src/data/harness-repository.json",
    "web/worker-configuration.d.ts",
]

[default]
# Codex parity ledgers quote exact hexadecimal commit IDs, which are data rather than prose.
extend-ignore-re = ["`[0-9a-f]{7,40}`", "[0-9a-f]{12}"]

[default.extend-words]
ratatui = "ratatui"
serde = "serde"
wasm = "wasm"
ba = "ba"
# Apple and Appium use UDID as the canonical device identifier name.
udid = "udid"
Udid = "Udid"
# `CMO` abbreviates the differential evaluator's code-mode-only profile.
CMO = "CMO"
# `caf` is the hexadecimal middle of the reviewed Codex commit
# `312caf176a8f`, not prose.
caf = "caf"
# These are hexadecimal fragments in the reviewed commits `0c01a18ede`
# and `ded4eacdbd`.
ede = "ede"
ded = "ded"
# `iz` appears inside the exact retained benchmark flag
# `flag{gc0d3_iz_ch4LLenGiNg}`.
iz = "iz"
