# `cargo nextest run --profile ci` in .github/workflows/ci.yml.
[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
failure-output = "immediate-final"

# Hand IPC tests share host sockets: serialize them and report retries as FLAKY.
[test-groups]
host-ipc = { max-threads = 1 }

[[profile.ci.overrides]]
filter = "package(nanocodex-bin) & kind(bin) & test(/hand/)"
test-group = "host-ipc"
retries = 2

[[profile.ci.overrides]]
filter = "package(nanocodex-remote) | package(nanocodex-tui-control)"
retries = 1
