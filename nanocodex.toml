default = "local-smoke"

[benchmark.openai-evals-smoke]
adapter = "openai-evals"
registry = "evals/adapter-smoke/openai-evals/registry"
eval = "demo.match-v1"
revision = "nanocodex/openai-evals-smoke@1"

[benchmark.external-smoke]
adapter = "external"
manifest = "evals/adapter-smoke/external/manifest.toml"

[profiles.local-smoke]
tasks = ["tasks/write-greeting"]
trials = 2
model = ["sol", "luna"]
thinking = ["low", "medium"]

[profiles.terminal-bench-smoke]
benchmarks = ["terminal-bench-2.1/fix-git"]
trials = 1
model = ["sol"]
thinking = ["high"]

[profiles.deep-swe-smoke]
benchmarks = ["deep-swe-v1.1/aiomonitor-task-snapshots-diff"]
trials = 1
model = ["sol"]
thinking = ["high"]

