[package]
name = "nanocodex-phone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "phone-voice-cloud"
path = "../../examples/phone_voice.rs"

[dependencies]
base64.workspace = true
nanocodex-oai-api = { workspace = true, features = ["realtime"] }
nanocodex-managed = { workspace = true, features = ["voice"] }
nanocodex-voice-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }
uuid = { workspace = true, features = ["v7"] }

[lints]
workspace = true
