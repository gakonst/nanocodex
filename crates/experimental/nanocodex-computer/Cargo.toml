[package]
name = "nanocodex-computer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Experimental persistent CUA tools for local and attached Nanocodex computers"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "Cargo.toml"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
nanocodex-oai-api = { version = "0.6.1", path = "../../nanocodex-oai-api", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
