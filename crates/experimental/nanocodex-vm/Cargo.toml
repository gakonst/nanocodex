[package]
name = "nanocodex-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "VM lifecycle, images, and retained workspace tools for Nanocodex"

[features]
default = ["host"]
host = [
    "dep:arcbox-ext4",
    "dep:async-trait",
    "dep:flate2",
    "dep:fs2",
    "dep:futures-util",
    "dep:hex",
    "dep:ignore",
    "dep:krun",
    "dep:nix",
    "dep:oci-client",
    "dep:reflink-copy",
    "dep:sha2",
    "dep:shlex",
    "dep:tar",
    "dep:tempfile",
    "dep:tracing",
    "dep:zstd",
    "nanocodex-tools/native",
]
guest-runtime = [
    "dep:futures-util",
    "dep:landlock",
    "dep:nix",
    "dep:rtnetlink",
    "dep:rustix",
    "dep:seccompiler",
    "nanocodex-tools/workspace-runtime",
]

[dependencies]
base64.workspace = true
filetime.workspace = true
futures-util = { workspace = true, optional = true }
landlock = { workspace = true, optional = true }
nanocodex-tools = { path = "../../nanocodex-tools", version = "0.5.0", default-features = false }
nix = { workspace = true, optional = true, features = ["fs", "mount"] }
rtnetlink = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
seccompiler = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
arcbox-ext4 = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
krun = { workspace = true, optional = true }
oci-client = { workspace = true, optional = true }
reflink-copy = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
shlex = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
nix.workspace = true
reflink-copy.workspace = true
shlex.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "nanocodex-vm-guest"
path = "src/bin/nanocodex-vm-guest.rs"
doc = false
required-features = ["guest-runtime"]

[[bench]]
name = "image_cache"
harness = false
required-features = ["host"]

[[bench]]
name = "vm_session"
harness = false
required-features = ["host"]

[[test]]
name = "image_live_build"
path = "tests/image_live_build.rs"
required-features = ["host"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
redundant-clone = "warn"
large-enum-variant = "allow"
result-large-err = "allow"
