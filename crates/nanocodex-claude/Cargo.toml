[package]
name = "nanocodex-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed Anthropic Messages protocol and streaming transport"

[features]
default = []
tools = ["dep:nanocodex-claude-tools"]
# Compatibility alias for existing callers.
workspace-files = ["tools"]

[dependencies]
base64.workspace = true
getrandom = { workspace = true, features = ["wasm_js"] }
sha2.workspace = true
regex.workspace = true
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }
url.workspace = true
nanocodex-claude-tools = { path = "../nanocodex-claude-tools", version = "0.6.7", default-features = false, optional = true }
futures-util.workspace = true
httpdate = "1.0.3"
image.workspace = true
nanocodex-agent = { path = "../nanocodex-agent", version = "0.6.7", default-features = false }
nanocodex-oai-tools = { path = "../nanocodex-oai-tools", version = "0.6.7", default-features = false, features = ["image-processing"] }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
web-time.workspace = true
uuid.workspace = true
reqwest = { workspace = true, features = ["stream", "gzip", "brotli", "deflate", "zstd"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures.workspace = true
wasmtimer = { version = "0.4.3", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile.workspace = true
rustls.workspace = true

axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync"] }

[lints]
workspace = true
