[package]
name = "nanocodex-oai-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Tower-native OpenAI Responses API and managed context for Nanocodex"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = ["client"]
client = [
    "events",
    "dep:base64",
    "dep:getrandom",
    "dep:http",
    "dep:reqwest",
    "dep:rustls",
    "dep:sha2",
    "dep:tokio-tungstenite",
    "dep:tower",
    "dep:tracing",
    "dep:url",
    "dep:uuid",
]
events = ["dep:futures-util", "dep:tokio", "dep:web-time"]
realtime = ["client", "dep:opusic-c", "dep:webrtc"]

[dependencies]
async-trait.workspace = true
base64 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
http = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"], optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
getrandom = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
url = { workspace = true, optional = true }
opusic-c = { workspace = true, optional = true }
webrtc = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
eyre.workspace = true
simd-json.workspace = true
sonic-rs.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true

[[bench]]
name = "fork_history"
harness = false
required-features = ["client"]

[[bench]]
name = "tower_responses"
harness = false
required-features = ["client"]

[[bench]]
name = "session_lifecycle"
harness = false
required-features = ["client"]

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["client"]

[[test]]
name = "rustls_provider"
path = "tests/rustls_provider.rs"
required-features = ["client"]

[[test]]
name = "rustls_preinstalled_provider"
path = "tests/rustls_preinstalled_provider.rs"
required-features = ["client"]

[[test]]
name = "event_projections"
path = "tests/event_projections.rs"
required-features = ["events"]

[lints]
workspace = true
