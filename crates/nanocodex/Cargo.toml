[package]
name = "nanocodex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Alloy-style facade for the Nanocodex agents SDK"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = ["durability", "mcp", "openai", "tools", "native"]
native = ["workspace-tools", "dep:nanocodex-subagents", "dep:reqwest", "dep:serde_json", "dep:tokio"]
claude = ["dep:nanocodex-claude", "nanocodex-durability?/claude", "native", "dep:nanocodex-claude-tools", "nanocodex-claude/tools", "nanocodex-subagents?/claude"]
claude-tools = ["claude", "dep:nanocodex-claude-tools", "nanocodex-claude/tools"]
durability = ["dep:nanocodex-durability", "openai"]
managed = ["dep:nanocodex-managed"]
mcp = ["tools", "nanocodex-oai-tools/mcp"]
observability = ["dep:nanocodex-observability"]
openai = ["nanocodex-agent/openai", "nanocodex-oai-api/client"]
realtime = ["openai", "nanocodex-oai-api/realtime"]
tools = ["oai-tools"]
oai-tools = [
    "dep:nanocodex-oai-tools",
    "nanocodex-managed?/tools",
    "nanocodex-oai-tools/attachment",
]
workspace-tools = [
    "tools",
    "nanocodex-oai-tools/workspace-runtime",
]

[dependencies]
nanocodex-agent = { path = "../nanocodex-agent", version = "0.6.6", default-features = false }
nanocodex-claude = { workspace = true, optional = true }
nanocodex-claude-tools = { workspace = true, optional = true }
nanocodex-durability = { workspace = true, optional = true }
nanocodex-oai-api = { path = "../nanocodex-oai-api", version = "0.6.6", default-features = false, features = ["events"] }
nanocodex-oai-tools = { path = "../nanocodex-oai-tools", version = "0.6.6", default-features = false, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocodex-subagents = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time"], optional = true }
nanocodex-managed = { workspace = true, optional = true }
nanocodex-observability = { workspace = true, optional = true }

[dev-dependencies]
nanocodex-subagents.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile.workspace = true
axum.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
