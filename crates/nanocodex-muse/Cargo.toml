[package]
name = "nanocodex-muse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Muse Spark Responses provider and caller-owned OAuth for Nanocodex"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = ["openai"]
openai = [
    "rollout",
    "dep:chrono",
    "dep:iana-time-zone",
    "dep:nanocodex-oai-tools",
    "nanocodex-oai-tools/code-mode",
    "dep:sha2",
    "dep:tower",
    "dep:tracing",
    "dep:web-time",
    "dep:uuid",
    "dep:wasm-bindgen-futures",
    "nanocodex-oai-api/client",
    "dep:reqwest",
    "dep:base64",
    "dep:image",
    "dep:sha1",
    "dep:async-trait",
]

rollout = ["dep:chrono", "dep:tracing", "dep:uuid"]

[dependencies]
nanocodex-home.workspace = true
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["form"], optional = true }
nanocodex-agent-reference = { package = "nanocodex-agent", version = "0.6.7", path = "../nanocodex-agent", default-features = false }
chrono = { workspace = true, optional = true }
futures-util.workspace = true
iana-time-zone = { workspace = true, optional = true }
nanocodex-oai-api = { version = "0.6.7", path = "../nanocodex-oai-api", default-features = false, features = ["events"] }
nanocodex-oai-tools = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
base64.workspace = true
eyre.workspace = true
image.workspace = true
nanocodex-oai-tools = { workspace = true, features = ["mcp"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
