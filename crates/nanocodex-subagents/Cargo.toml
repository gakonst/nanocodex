[package]
name = "nanocodex-subagents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Composable task-tree subagents for Nanocodex"

[features]
default = []
claude = ["dep:nanocodex-claude"]

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
nanocodex-agent.workspace = true
nanocodex-claude = { workspace = true, optional = true }
nanocodex-oai-tools = { workspace = true, features = ["code-mode"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt", "time"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
axum.workspace = true
reqwest.workspace = true
rustls.workspace = true
nanocodex-oai-api.workspace = true
tower.workspace = true

[lints]
workspace = true
