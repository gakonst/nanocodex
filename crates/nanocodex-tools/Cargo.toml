[package]
name = "nanocodex-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Code Mode and heterogeneous tool runtime for Nanocodex"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = ["native"]
attachment = [
    "dep:async-trait",
    "dep:futures-util",
    "dep:http",
    "dep:rustls",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:url",
    "dep:uuid",
]
workspace-runtime = [
    "dep:async-trait",
    "dep:base64",
    "dep:getrandom",
    "dep:portable-pty",
    "dep:schemars",
    "dep:thiserror",
    "dep:tokio",
    "dep:nix",
]
native = [
    "attachment",
    "workspace-runtime",
    "nanocodex-oai-api/client",
    "dep:bm25",
    "dep:futures-util",
    "dep:http",
    "dep:image",
    "dep:oauth2",
    "dep:nanocodex-tools-macros",
    "dep:reqwest",
    "dep:rquickjs",
    "dep:rmcp",
    "dep:sha1",
    "dep:tokio-util",
]

[dependencies]
nanocodex-oai-api = { path = "../nanocodex-oai-api", version = "0.5.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bm25 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
http = { workspace = true, optional = true }
image = { workspace = true, optional = true }
oauth2 = { workspace = true, optional = true }
nanocodex-tools-macros = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rquickjs = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"], optional = true }
tokio-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
eyre.workspace = true
futures-util.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[[bench]]
name = "mcp_tool_search"
harness = false
required-features = ["native"]

[[bench]]
name = "tool_process_output"
harness = false
required-features = ["native"]

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["native"]

[[example]]
name = "attached_workspace"
required-features = ["attachment", "workspace-runtime"]

[lints]
workspace = true
