[package]
name = "nanocodex-durability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Portable durable execution state and stores for Nanocodex"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = []
sqlite = ["dep:rusqlite"]
postgres = ["dep:tokio-postgres"]

[dependencies]
base64.workspace = true
flate2.workspace = true
nanocodex-agent.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
uuid.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }

[dev-dependencies]
eyre.workspace = true
nanocodex-oai-api.workspace = true
nanocodex-tools.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true

[lints]
workspace = true
