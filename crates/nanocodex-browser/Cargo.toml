[package]
name = "nanocodex-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Deterministic browser automation and isolated VM lifecycle for Nanocodex"
exclude = ["assets-src/node_modules/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
chromiumoxide.workspace = true
futures-util.workspace = true
fs2.workspace = true
image.workspace = true
nanocodex-oai-api.workspace = true
nanocodex-tools.workspace = true
percent-encoding.workspace = true
reflink-copy.workspace = true
reqwest = { workspace = true, features = ["query", "stream"] }
rusqlite = { workspace = true, features = ["backup"] }
safari-binarycookies.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sourcemap.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }
tracing.workspace = true
url.workspace = true
v8-heap-parser.workspace = true

[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
nanocodex-vm.workspace = true

[dev-dependencies]
criterion.workspace = true
eyre.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing-subscriber.workspace = true

[[bench]]
name = "browser_protocol"
harness = false

[[bench]]
name = "browser_vm"
harness = false

[lints]
workspace = true
