[package]
name = "nanocodex-oai-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "OpenAI Responses tool catalog, Code Mode and execution runtime for Nanocodex"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = ["native"]
attachment = [
    "nanocodex-oai-api/native-tls",
    "dep:async-trait",
    "dep:futures-util",
    "dep:http",
    "dep:rustls",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:url",
    "dep:uuid",
]
workspace-runtime = [
    "dep:async-trait",
    "dep:base64",
    "dep:getrandom",
    "dep:portable-pty",
    "dep:regex",
    "dep:schemars",
    "dep:thiserror",
    "dep:tokio",
    "dep:nix",
    "dep:rustix",
]
# Full native runtime: Code Mode and MCP.
native = ["code-mode", "mcp"]
# Image decoding and preparation without a tool execution runtime.
image-processing = ["dep:base64", "dep:image", "dep:sha1", "dep:thiserror", "dep:tokio"]
# Code Mode tool runtime used by the agent loop, without MCP.
code-mode = [
    "attachment",
    "image-processing",
    "workspace-runtime",
    "nanocodex-oai-api/client",
    "dep:futures-util",
    "dep:http",
    "dep:nanocodex-oai-tools-macros",
    "dep:reqwest",
    "dep:rquickjs",
]
# MCP servers, OAuth login, and deferred-tool search.
mcp = ["code-mode", "dep:bm25", "dep:oauth2", "dep:rmcp", "dep:tokio-util"]

[dependencies]
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
nanocodex-oai-api = { path = "../nanocodex-oai-api", version = "0.6.7", default-features = false }
nanocodex-home.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-trait = { workspace = true, optional = true }
bm25 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
http = { workspace = true, optional = true }
oauth2 = { workspace = true, optional = true }
nanocodex-oai-tools-macros = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rquickjs = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"], optional = true }
tokio-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, optional = true }
rustix = { workspace = true, features = ["process"], optional = true }

[dev-dependencies]
criterion.workspace = true
eyre.workspace = true
futures-util.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[[bench]]
name = "mcp_tool_search"
harness = false
required-features = ["native"]

[[bench]]
name = "tool_process_output"
harness = false
required-features = ["native"]

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["native"]

[[example]]
name = "attached_workspace"
required-features = ["attachment", "workspace-runtime"]

[lints]
workspace = true
